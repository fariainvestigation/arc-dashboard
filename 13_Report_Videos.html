<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ARC Videos</title>
  <link rel="stylesheet" href="arc_report_workspace.css">
  <link rel="stylesheet" href="arc_uniform_design.css">
  <script src="arc_report_header.js"></script>
  <script src="arc_shared_keys.js"></script>
  <script src="arc_unified_bridge.js"></script>
  <script src="arc_report_assets.js"></script>
</head>
<body data-workspace="video">
<div class="rw-shell">
  <header class="rw-head">
    <div class="rw-title"><small>Reports workspace</small><h1 id="rwPageTitle">Videos</h1><p id="rwPageDescription">Upload source videos and document relevance, timestamps, and explanations.</p></div>
    <div class="rw-case"><strong id="rwCaseName">No active case</strong><span id="rwCaseMeta">Create or select a case to begin</span></div>
    <div class="rw-actions"><button class="rw-btn" id="rwEdit" type="button">Edit Records</button><button class="rw-btn" id="rwPrint" type="button">Print</button><button class="rw-btn primary" id="rwDownload" type="button">Download HTML</button></div>
  </header>
  <main class="rw-main" id="rwContent">
    <div class="rw-notice" id="rwCaseNotice">Select or create an active case before adding report records.</div>
    <section class="rw-metrics" id="rwMetrics"></section>
    <div class="rw-toolbar">
      <input class="rw-input rw-search" id="rwSearch" type="search" placeholder="Search records, descriptions, sources, and citations">
      <select class="rw-select" id="rwFilter" aria-label="Filter records by status" style="width:auto"><option value="all">All statuses</option><option value="selected">Selected for report</option><option value="draft">Draft</option><option value="approved">Approved</option><option value="rejected">Rejected</option><option value="included">Included</option></select>
      <button class="rw-btn primary" id="rwAdd" type="button">Add Video</button>
    </div>
    <section class="rw-panel"><div class="rw-panel-head"><h2>Case Records</h2></div><div class="rw-panel-body" id="rwRecords"></div></section>
  </main>
</div>
<dialog class="rw-dialog" id="rwDialog">
  <div class="rw-dialog-head"><h2 id="rwDialogTitle">Add Record</h2><button id="rwDialogClose" type="button" aria-label="Close">&times;</button></div>
  <form class="rw-form" id="rwForm">
    <div class="rw-notice error wide" id="rwFormError" hidden></div>
    <div id="rwFormFields" style="display:contents"></div>
    <div class="rw-field wide" id="rwProgress" hidden><span>Upload progress</span><div class="rw-progress"><span></span></div></div>
    <div class="rw-dialog-foot"><button class="rw-btn" id="rwFormCancel" type="button">Cancel</button><button class="rw-btn primary" type="submit">Save Record</button></div>
  </form>
</dialog>
<script src="arc_report_workspace.js"></script>
</body>
</html>
