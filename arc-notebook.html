    field('Template name', 'name', false, 'e.g. OUI Breath Test Audit');
    field('Report title', 'title', false, 'e.g. Breath Test Compliance Review');
    field('Section headings (one per line)', 'headings', true, 'Device History' + '\n' + 'Calibration Record' + '\n' + 'Deviations Identified');
    field('Instructions', 'instructions', true, 'Structure, tone, emphasis. Grounding rules always control.');

    var row = el('div', 'custrow');
    var save = el('button', 'iconbtn', 'Save template');
    save.addEventListener('click', function () {
      var name = (customDraft.name || '').trim();
      var title = (customDraft.title || '').trim();
      var heads = customHeadingsFromDraft();
      if (!name || !title || !heads.length) { $('repStatus').textContent = 'A template needs a name, a title, and at least one section heading.'; return; }
      var list = loadCustomTemplates();
      var existing = null;
      for (var i = 0; i < list.length; i++) if (list[i].id === customDraft.tplId) existing = list[i];
      if (existing) {
        existing.name = name;
        existing.title = title;
        existing.headings = heads;
        existing.instructions = customDraft.instructions || '';
      } else {
        var t = { id: uid(), name: name, title: title, headings: heads, instructions: customDraft.instructions || '' };
        list.push(t);
        customDraft.tplId = t.id;
      }
      saveCustomTemplates(list);
      $('repStatus').textContent = 'Template saved.';
      renderReportOpts();
    });
    var delb = el('button', 'iconbtn', 'Delete template');
    delb.addEventListener('click', function () {
      if (!customDraft.tplId) { $('repStatus').textContent = 'Select a saved template to delete.'; return; }
      if (!confirm('Delete the template "' + (customDraft.name || '') + '"?')) return;
      saveCustomTemplates(loadCustomTemplates().filter(function (t) { return t.id !== customDraft.tplId; }));
      customDraft = { tplId: '', name: '', title: '', headings: '', instructions: '' };
      renderReportOpts();
    });
    row.appendChild(save);
    row.appendChild(delb);
    box.appendChild(row);
  }

  function repGenerate() {
    if (pending || !current) return;
    if (!current.docs.length) { $('repStatus').textContent = 'Upload sources first.'; return; }
    var type = repTypeById(currentRepType);
    var task = '';
    var meta = null;
    if (type.id === 'custom') {
      var title = (customDraft.title || '').trim();
      var heads = customHeadingsFromDraft();
      if (!title || !heads.length) { $('repStatus').textContent = 'Enter a report title and at least one section heading.'; return; }
      meta = { title: title, headings: heads };
      task = REPORT_WRITING_STANDARD + ' ' +
        'Write a report titled "' + title + '" from the uploaded sources. ' +
        'Produce exactly these sections, in this order, each starting with a heading line in the form "## Section Name": ' + heads.join(', ') + '. ' +
        'STYLE FOR THIS REPORT: ' + REPORT_GENERAL_STYLE + ' ' +
        'Follow these additional instructions, but only to the extent they do not conflict with the STRICT GROUNDING RULES above, which always control: ' +
        ((customDraft.instructions || '').trim() || 'None.') + ' ' +
        'Every factual statement must carry [S#] citation tags. If a section has no support in the excerpts, write only this line under its heading: Not covered in the uploaded sources.';
    } else {
      var wanted = type.sections.filter(function (s) { return repOn(s.id); });
      if (!wanted.length) { $('repStatus').textContent = 'No narrative sections are selected. Deterministic sections export without generation.'; return; }
      var names = wanted.map(function (s) { return s.label; }).join(', ');
      task = REPORT_WRITING_STANDARD + ' ' +
        type.intro +
        ' Produce exactly these sections, in this order, each starting with a heading line in the form "## Section Name": ' + names + '.' +
        (type.extra ? ' ' + type.extra : '') +
        (type.style ? ' STYLE FOR THIS REPORT: ' + type.style : '') +
        ' Every factual statement must carry [S#] citation tags.' +
        (type.ownFallback ? '' : ' If a section has no support in the excerpts, write only this line under its heading: Not covered in the uploaded sources.') +
        (type.closing ? ' ' + REPORT_CLOSING : '');
    }
    pending = true;
    $('repGen').disabled = true;
    $('repStatus').textContent = 'Reading sources...';
    var built = buildExcerptBlock(current, spreadChunks(current));
    arcGeminiGenerate(groundedPrompt(current, built.block, task, false)).then(function (text) {
      var rep = { text: text.trim(), cites: built.cites, generatedAt: Date.now() };
      if (meta) { rep.title = meta.title; rep.headings = meta.headings; }
      nbReports()[currentRepType] = rep;
      $('repStatus').textContent = 'Narrative generated at ' + new Date().toLocaleTimeString() + '.';
      arcPublishCaseBrief();
      return nbPut(current);
    }).catch(function (err) {
      $('repStatus').textContent = err.message || String(err);
    }).then(function () {
      pending = false;
      $('repGen').disabled = false;
      renderReportOpts();
      renderReportPreview();
    });
  }

  function splitReportSections(text) {
    var map = {};
    var parts = ('\n' + String(text || '')).split('\n## ');
    parts.slice(1).forEach(function (pt) {
      var nl = pt.indexOf('\n');
      var name = (nl < 0 ? pt : pt.slice(0, nl)).trim().toLowerCase();
      var body = (nl < 0 ? '' : pt.slice(nl + 1)).trim();
      map[name] = body;
    });
    return map;
  }

  function usedTags(texts) {
    var seen = {};
    var out = [];
    texts.forEach(function (t) {
      var re = /\[S(\d+)\]/g;
      var m;
      while ((m = re.exec(t)) !== null) {
        var n = parseInt(m[1], 10);
        if (!seen[n]) { seen[n] = 1; out.push(n); }
      }
    });
    out.sort(function (a, b) { return a - b; });
    return out;
  }

  function buildReportBlocks() {
    var type = repTypeById(currentRepType);
    var rep = nbReports()[currentRepType] || null;
    var blocks = [];
    var secMap = splitReportSections(rep ? rep.text : '');
    var repLabel = type.id === 'custom' ? ((rep && rep.title) || (customDraft.title || '').trim() || 'Custom Report') : type.label;
    if (repOn('cover')) {
      blocks.push({ type: 'cover', title: current.name, reportLabel: repLabel, caseNo: current.caseNo || '', date: new Date().toLocaleDateString(), firm: 'ARC Investigations and Consulting' });
    }
    var aiTexts = [];
    repSectionsFor(currentRepType).forEach(function (s) {
      if (type.id !== 'custom' && !repOn(s.id)) return;
      var body = secMap[s.label.toLowerCase()] || 'Not generated yet. Run Generate narrative.';
      aiTexts.push(body);
      blocks.push({ type: 'narrative', label: s.label, body: body });
    });
    if (repOn('exhibits')) {
      blocks.push({
        type: 'exhibit_index',
        rows: current.docs.map(function (doc, i) {
          return { letter: exhibitLetter(i), name: doc.name, kind: doc.kind, pages: doc.pages || '', chars: doc.chars, added: fmtDate(doc.addedAt) };
        })
      });
    }
    if (repOn('notes') && current.notes.length) {
      blocks.push({ type: 'notes', items: current.notes.map(function (n) { return { title: n.title, text: n.text }; }) });
    }
    if (repOn('appendix') && rep) {
      var tags = usedTags(aiTexts);
      var items = [];
      tags.forEach(function (n) {
        for (var i = 0; i < rep.cites.length; i++) {
          var c = rep.cites[i];
          if (c.n === n) { items.push({ tag: 'S' + n, doc: c.docName, page: c.page || '' }); break; }
        }
      });
      if (items.length) blocks.push({ type: 'citation_appendix', items: items });
    }
    return blocks;
  }

  function blocksToMd(blocks) {
    var L = [];
    blocks.forEach(function (b) {
      if (b.type === 'cover') {
        L.push('# ' + b.title);
        if (b.reportLabel) L.push(b.reportLabel);
        if (b.caseNo) L.push('Case: ' + b.caseNo);
        L.push('Prepared: ' + b.date);
        L.push(b.firm);
        L.push('');
      } else if (b.type === 'narrative') {
        L.push('## ' + b.label, '', b.body, '');
      } else if (b.type === 'exhibit_index') {
        L.push('## Source Exhibit Index', '');
        L.push('| Exhibit | Document | Type | Pages | Size | Added |');
        L.push('| --- | --- | --- | --- | --- | --- |');
        b.rows.forEach(function (r) {
          L.push('| ' + r.letter + ' | ' + r.name + ' | ' + r.kind + ' | ' + r.pages + ' | ' + fmtSize(r.chars) + ' | ' + r.added + ' |');
        });
        L.push('');
      } else if (b.type === 'notes') {
        L.push('## Pinned Notes', '');
        b.items.forEach(function (n) { L.push('### ' + n.title, '', n.text, ''); });
      } else if (b.type === 'citation_appendix') {
        L.push('## Citation Appendix', '');
        b.items.forEach(function (it) { L.push('- ' + it.tag + ': ' + it.doc + (it.page ? ', page ' + it.page : '')); });
        L.push('');
      }
    });
    return L.join('\n');
  }

  function blocksToHtml(blocks) {
    var css = 'body{font-family:Georgia,serif;color:#1c1c1c;margin:48px;line-height:1.6;font-size:12pt}' +
      ((window.ARC_REPORT_HEADER && window.ARC_REPORT_HEADER.css) || '') +
      'h1{font-size:24pt;margin:0 0 4px}' +
      '.rule{height:3px;background:#C9A84C;width:120px;margin:14px 0 24px}' +
      'h2{font-size:15pt;margin:26px 0 8px;border-bottom:2px solid #C9A84C;padding-bottom:4px}' +
      'h3{font-size:12pt;margin:16px 0 4px}' +
      '.meta{color:#555;font-size:10.5pt}' +
      'table{border-collapse:collapse;width:100%;font-size:10.5pt}' +
      'th,td{border:1px solid #999;padding:5px 8px;text-align:left}' +
      'th{background:#f2ede0}' +
      'p{margin:0 0 10px;white-space:pre-wrap}' +
      'ul{margin:0 0 10px 20px}';
    var H = [];
    blocks.forEach(function (b) {
      if (b.type === 'cover') {
        H.push('<h1>' + esc(b.title) + '</h1>');
        H.push('<div class="meta">' + (b.reportLabel ? esc(b.reportLabel) + '<br>' : '') + (b.caseNo ? 'Case: ' + esc(b.caseNo) + '<br>' : '') + 'Prepared: ' + esc(b.date) + '<br>' + esc(b.firm) + '</div>');
        H.push('<div class="rule"></div>');
      } else if (b.type === 'narrative') {
        H.push('<h2>' + esc(b.label) + '</h2><p>' + esc(b.body) + '</p>');
      } else if (b.type === 'exhibit_index') {
        H.push('<h2>Source Exhibit Index</h2><table><tr><th>Exhibit</th><th>Document</th><th>Type</th><th>Pages</th><th>Size</th><th>Added</th></tr>' +
          b.rows.map(function (r) {
            return '<tr><td>' + esc(r.letter) + '</td><td>' + esc(r.name) + '</td><td>' + esc(r.kind) + '</td><td>' + esc(r.pages) + '</td><td>' + esc(fmtSize(r.chars)) + '</td><td>' + esc(r.added) + '</td></tr>';
          }).join('') + '</table>');
      } else if (b.type === 'notes') {
        H.push('<h2>Pinned Notes</h2>' + b.items.map(function (n) { return '<h3>' + esc(n.title) + '</h3><p>' + esc(n.text) + '</p>'; }).join(''));
      } else if (b.type === 'citation_appendix') {
        H.push('<h2>Citation Appendix</h2><ul>' + b.items.map(function (it) { return '<li>' + esc(it.tag) + ': ' + esc(it.doc) + (it.page ? ', page ' + esc(it.page) : '') + '</li>'; }).join('') + '</ul>');
      }
    });
    var banner = (window.ARC_REPORT_HEADER && window.ARC_REPORT_HEADER.html) ? window.ARC_REPORT_HEADER.html('arc-report-banner compact', { portable: true }) : '';
    return '<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + esc(current.name) + '</title><style>' + css + '</style></head><body>' + banner + H.join('\n') + '</body></html>';
  }

  function blocksToDraftV6(blocks) {
    var rep = nbReports()[currentRepType] || null;
    var type = repTypeById(currentRepType);
    var v6blocks = blocks.map(function (b) {
      if (b.type === 'narrative') {
        return { type: 'narrative', heading: b.label, bodyMarkdown: b.body, cites: usedTags([b.body]).map(function (n) { return 'S' + n; }) };
      }
      return b;
    });
    return {
      formatVersion: 6,
      generator: 'ARC Notebook',
      generatedAt: new Date().toISOString(),
      reportType: currentRepType,
      reportLabel: type.id === 'custom' ? ((rep && rep.title) || (customDraft.title || '').trim() || 'Custom Report') : type.label,
      caseFile: { title: current.name, caseNumber: current.caseNo || '' },
      citationMap: rep ? rep.cites.map(function (c) {
        return { tag: 'S' + c.n, document: c.docName, page: c.page || null, charStart: c.start, charEnd: c.end };
      }) : [],
      blocks: v6blocks
    };
  }

  function repExport(kind) {
    if (!current) return;
    var blocks = buildReportBlocks();
    if (!blocks.length) { $('repStatus').textContent = 'Select at least one section.'; return; }
    if (kind === 'md') {
      download(fileBase() + '-' + currentRepType + '-report.md', blocksToMd(blocks));
    } else if (kind === 'docx') {
      if (!window.htmlDocx) { $('repStatus').textContent = 'The html-docx library did not load. Check the network and reload the page.'; return; }
      downloadBlob(fileBase() + '-' + currentRepType + '-report.docx', window.htmlDocx.asBlob(blocksToHtml(blocks)));
    } else if (kind === 'print') {
      var w = window.open('', '_blank');
      if (!w) { $('repStatus').textContent = 'Allow pop ups for this page to use Print / PDF.'; return; }
      w.document.write(blocksToHtml(blocks));
      w.document.close();
      w.focus();
      setTimeout(function () { w.print(); }, 400);
    } else if (kind === 'json') {
      downloadBlob(fileBase() + '-draft-v6-' + currentRepType + '.json', new Blob([JSON.stringify(blocksToDraftV6(blocks), null, 2)], { type: 'application/json' }));
    }
  }

  function renderReportPreview() {
    var pv = $('repPreview');
    if (!pv || !current) return;
    var rep = nbReports()[currentRepType] || null;
    var blocks = buildReportBlocks();
    if (!blocks.length) {
      pv.innerHTML = '<span class="finemeta">Select sections above to preview the report.</span>';
      return;
    }
    var H = [];
    blocks.forEach(function (b) {
      if (b.type === 'cover') {
        if (window.ARC_REPORT_HEADER && window.ARC_REPORT_HEADER.dataUri) {
          H.push('<span style="display:block;margin:0 0 14px"><img src="' + window.ARC_REPORT_HEADER.dataUri + '" alt="ARC Investigations and Consulting confidential report header" style="display:block;width:100%;max-width:650px;height:auto"></span>');
        }
        H.push('<span class="aihead" style="font-size:19px">' + esc(b.title) + '</span>');
        H.push('<span class="finemeta">' + (b.reportLabel ? esc(b.reportLabel) + '  |  ' : '') + (b.caseNo ? esc(b.caseNo) + '  |  ' : '') + esc(b.date) + '  |  ' + esc(b.firm) + '</span>\n');
      } else if (b.type === 'narrative') {
        H.push('<span class="aihead">' + esc(b.label) + '</span>');
        H.push(renderCites(mdLite(b.body), rep ? rep.cites : null) + '\n');
      } else if (b.type === 'exhibit_index') {
        H.push('<span class="aihead">Source Exhibit Index</span>');
        H.push(b.rows.map(function (r) {
          return esc(r.letter) + '. ' + esc(r.name) + ' (' + esc(r.kind) + (r.pages ? ', ' + r.pages + ' pp' : '') + ')';
        }).join('\n') + '\n');
      } else if (b.type === 'notes') {
        H.push('<span class="aihead">Pinned Notes</span>');
        H.push(b.items.map(function (n) { return '<strong>' + esc(n.title) + '</strong>\n' + esc(n.text); }).join('\n\n') + '\n');
      } else if (b.type === 'citation_appendix') {
        H.push('<span class="aihead">Citation Appendix</span>');
        H.push(b.items.map(function (it) { return esc(it.tag) + ': ' + esc(it.doc) + (it.page ? ', page ' + it.page : ''); }).join('\n'));
      }
    });
    pv.innerHTML = H.join('\n');
  }

  /* ===================== wiring ===================== */
  function init() {
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    $('backBtn').addEventListener('click', renderHome);
    $('settingsBtn').addEventListener('click', openSettings);
    $('setClose').addEventListener('click', function () { $('setOverlay').classList.remove('show'); });
    $('srcClose').addEventListener('click', function () { $('srcOverlay').classList.remove('show'); });
    $('srcOverlay').addEventListener('click', function (e) { if (e.target === $('srcOverlay')) $('srcOverlay').classList.remove('show'); });
    $('setOverlay').addEventListener('click', function (e) { if (e.target === $('setOverlay')) $('setOverlay').classList.remove('show'); });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        ['srcOverlay', 'setOverlay', 'mmOverlay', 'deckOverlay', 'repOverlay'].forEach(function (oid) {
          $(oid).classList.remove('show');
        });
      }
    });
    $('keySave').addEventListener('click', function () {
      var v = $('keyInput').value.trim();
      if (!v) { $('keyInput').focus(); return; }
      localStorage.setItem(GEMINI_KEY, v);
      if (window.ARC_SYSTEM_KEYS) window.ARC_SYSTEM_KEYS.write({ gemini: v, googleApiKey: v });
      localStorage.removeItem(MODEL_CACHE_KEY);
      $('setOverlay').classList.remove('show');
    });
    $('keyClear').addEventListener('click', function () {
      localStorage.removeItem(GEMINI_KEY);
      if (window.ARC_SYSTEM_KEYS) window.ARC_SYSTEM_KEYS.write({ gemini: "", googleApiKey: "" });
      $('keyInput').value = '';
    });
    $('fileInput').addEventListener('change', function () {
      handleFiles(this.files);
      this.value = '';
    });
    ['mmOverlay', 'deckOverlay', 'repOverlay'].forEach(function (oid) {
      var ov = $(oid);
      ov.addEventListener('click', function (e) { if (e.target === ov) ov.classList.remove('show'); });
    });
    var closers = document.querySelectorAll('[data-close]');
    for (var ci = 0; ci < closers.length; ci++) {
      (function (btn) {
        btn.addEventListener('click', function () { $(btn.getAttribute('data-close')).classList.remove('show'); });
      })(closers[ci]);
    }
    $('mmGen').addEventListener('click', mmGenerate);
    $('mmSvg').addEventListener('click', mmExportSvg);
    $('mmPng').addEventListener('click', mmExportPng);
    $('deckGen').addEventListener('click', deckGenerate);
    $('deckAdd').addEventListener('click', deckAddSlide);
    $('deckPptx').addEventListener('click', deckExportPptx);
    $('repGen').addEventListener('click', repGenerate);
    $('repMd').addEventListener('click', function () { repExport('md'); });
    $('repDocx').addEventListener('click', function () { repExport('docx'); });
    $('repPrint').addEventListener('click', function () { repExport('print'); });
    $('repJson').addEventListener('click', function () { repExport('json'); });
    $('repType').addEventListener('change', function () {
      currentRepType = this.value;
      $('repStatus').textContent = '';
      renderReportOpts();
      renderReportPreview();
    });
    var tb = $('tabbar');
    tb.addEventListener('click', function (e) {
      var b = e.target.closest ? e.target.closest('button') : null;
      if (b) setTab(b.getAttribute('data-tab'));
    });
    renderHome();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
<script src="arc_unified_bridge.js"></script>
<script>
(function(){
  function addSendButton(){
    var anchor = document.getElementById('repJson') || document.getElementById('repPrint');
    if (!anchor || document.getElementById('arcSendMain') || !window.ARCUnified) return;
    var b = document.createElement('button');
    b.id = 'arcSendMain';
    b.className = anchor.className;
    b.textContent = 'Send to Main Report';
    b.title = 'Save the current report preview to the shared Main Report inbox';
    b.addEventListener('click', function(){
      var preview = document.getElementById('repPreview');
      if (!preview || !preview.innerText.trim()) {
        alert('Generate or preview a report first.');
        return;
      }
      var type = document.getElementById('repType');
      window.ARCUnified.saveReport({
        title: (document.querySelector('.worktitle') || document.querySelector('h1') || {}).textContent || 'ARC Notebook Report',
        reportType: type ? type.options[type.selectedIndex].text : 'Notebook Report',
        text: preview.innerText.trim(),
        html: preview.innerHTML,
        caseContext: window.ARC_CASE_CONTEXT || {}
      });
      var s = document.getElementById('repStatus');
      if (s) s.textContent = 'Sent to Main Report inbox at ' + new Date().toLocaleTimeString() + '.';
    });
    anchor.parentNode.insertBefore(b, anchor.nextSibling);
  }
  addSendButton();
})();
</script>
