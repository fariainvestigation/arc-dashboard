<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="libs/pptxgen.bundle.js"></script>
<script src="libs/html-docx.js"></script>
<script src="arc_shared_keys.js"></script>
<script src="arc_report_header.js"></script>
<style>
:root{
  --bg:#15161B;
  --panel:#1D1F26;
  --panel2:#232630;
  --line:#2E3140;
  --gold:#C9A84C;
  --gold-soft:rgba(201,168,76,.14);
  --text:#E8E6E0;
  --muted:#9A9CA8;
  --danger:#D06A5C;
  --ok:#7FAE7A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.55}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit;color:var(--text)}
::selection{background:var(--gold-soft)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- header ---------- */
.hdr{display:flex;align-items:center;gap:14px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
.hdr .mono{width:38px;height:38px;border:1px solid var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:var(--gold);font-size:17px;letter-spacing:.5px;flex:0 0 auto}
.hdr h1{font-family:'Playfair Display',serif;font-size:19px;font-weight:600;letter-spacing:.3px}
.hdr .sub{font-size:12px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
.hdr .spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:7px 12px;font-size:13px}
.iconbtn:hover{border-color:var(--gold);color:var(--gold)}
.backbtn{background:none;border:none;color:var(--gold);font-size:14px;padding:4px 8px}
.backbtn:hover{text-decoration:underline}

/* ---------- home ---------- */
.home{max-width:1040px;margin:0 auto;padding:38px 22px}
.home h2{font-family:'Playfair Display',serif;font-size:26px;font-weight:600;margin-bottom:6px}
.home .lead{color:var(--muted);margin-bottom:28px;max-width:640px}
.nbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.nbcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;cursor:pointer;position:relative;transition:border-color .15s}
.nbcard:hover{border-color:var(--gold)}
.nbcard h3{font-family:'Playfair Display',serif;font-size:18px;font-weight:600;margin-bottom:4px;padding-right:28px}
.nbcard .case{font-family:'DM Mono',monospace;font-size:12px;color:var(--gold);margin-bottom:10px}
.nbcard .meta{font-size:12.5px;color:var(--muted)}
.nbcard .del{position:absolute;top:12px;right:12px;background:none;border:none;color:var(--muted);font-size:15px;padding:4px}
.nbcard .del:hover{color:var(--danger)}
.newcard{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:18px}
.newcard h3{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--gold);margin-bottom:12px}
.newcard input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:14px;margin-bottom:10px}
.newcard input:focus{border-color:var(--gold);outline:none}
.goldbtn{background:var(--gold);color:#14151A;border:none;border-radius:6px;padding:9px 16px;font-weight:700;font-size:13.5px;letter-spacing:.3px}
.goldbtn:hover{filter:brightness(1.08)}
.goldbtn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- workspace ---------- */
.ws{display:grid;grid-template-columns:300px minmax(0,1fr) 330px;height:calc(100vh - 67px)}
.pane{overflow-y:auto;border-right:1px solid var(--line)}
.pane:last-child{border-right:none}
.panehead{padding:14px 16px 10px;font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:2;display:flex;align-items:center;gap:8px}
.panehead .count{font-family:'DM Mono',monospace;color:var(--gold)}

/* sources */
.dropzone{margin:14px;border:1px dashed var(--line);border-radius:8px;padding:18px 14px;text-align:center;color:var(--muted);font-size:13px;transition:border-color .15s,background .15s}
.dropzone.on{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
.dropzone .browse{color:var(--gold);background:none;border:none;font-size:13px;text-decoration:underline;padding:0}
.doclist{padding:0 10px 14px}
.docrow{display:flex;gap:10px;align-items:flex-start;padding:10px 8px;border-radius:8px;cursor:pointer;position:relative}
.docrow:hover{background:var(--panel)}
.exhibit{width:30px;height:30px;flex:0 0 auto;border:1px solid var(--gold);border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-weight:700;color:var(--gold);font-size:14px}
.docrow .dname{font-size:13.5px;font-weight:500;word-break:break-word;padding-right:22px}
.docrow .dmeta{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);margin-top:2px}
.docrow .ddel{position:absolute;top:8px;right:6px;background:none;border:none;color:var(--muted);font-size:14px;padding:2px 4px}
.docrow .ddel:hover{color:var(--danger)}
.busy{margin:0 14px 14px;font-size:12.5px;color:var(--gold);font-family:'DM Mono',monospace}

/* chat */
.chatwrap{display:flex;flex-direction:column;height:100%;min-width:0}
.groundbar{padding:8px 16px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:8px;align-items:center}
.groundbar .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:0 0 auto}
.msgs{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px}
.msg{max-width:86%;border-radius:10px;padding:12px 15px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--panel2);border:1px solid var(--line)}
.msg.ai{align-self:flex-start;background:var(--panel);border:1px solid var(--line)}
.msg.err{align-self:flex-start;background:none;border:1px solid var(--danger);color:var(--danger);font-size:13.5px}
.msg .mtools{margin-top:10px;display:flex;gap:8px}
.pinbtn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;font-size:11.5px;padding:4px 9px}
.pinbtn:hover{border-color:var(--gold);color:var(--gold)}
.cite{display:inline-flex;align-items:center;background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);border-radius:4px;font-family:'DM Mono',monospace;font-size:10.5px;padding:0 5px;margin:0 2px;vertical-align:baseline;cursor:pointer;line-height:1.6}
.cite:hover{background:var(--gold);color:#14151A}
.aihead{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--gold);display:block;margin:6px 0 2px}
.typing{align-self:flex-start;color:var(--muted);font-family:'DM Mono',monospace;font-size:12.5px;padding:4px 2px}
.emptychat{margin:auto;text-align:center;color:var(--muted);max-width:420px;padding:20px}
.emptychat .big{font-family:'Playfair Display',serif;font-size:20px;color:var(--text);margin-bottom:8px}
.askbar{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--line);background:var(--panel)}
.askbar textarea{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px;resize:none;height:46px;line-height:1.4}
.askbar textarea:focus{border-color:var(--gold);outline:none}

/* studio */
.studio{padding:0 0 20px}
.stubox{padding:14px 16px;border-bottom:1px solid var(--line)}
.stubox h4{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.synthbtn{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:8px}
.synthbtn:hover{border-color:var(--gold)}
.synthbtn:disabled{opacity:.4;cursor:not-allowed}
.synthbtn .hint{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.notelist{padding:6px 16px}
.note{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;margin-bottom:10px;position:relative}
.note .ntitle{font-weight:700;font-size:13px;margin-bottom:4px;padding-right:24px}
.note .ntext{font-size:12.5px;color:var(--muted);white-space:pre-wrap;max-height:130px;overflow:hidden}
.note .ndel{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--muted);font-size:13px}
.note .ndel:hover{color:var(--danger)}
.addnote textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:13px;resize:vertical;min-height:56px;margin-bottom:8px}
.addnote textarea:focus{border-color:var(--gold);outline:none}
.emptynotes{color:var(--muted);font-size:12.5px;padding:4px 16px 12px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,10,14,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(860px,100%);max-height:88vh;display:flex;flex-direction:column}
.modal .mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal .mhead h3{font-family:'Playfair Display',serif;font-size:17px;font-weight:600;flex:1;word-break:break-word}
.modal .mclose{background:none;border:none;color:var(--muted);font-size:20px;padding:2px 8px}
.modal .mclose:hover{color:var(--text)}
.modal .mbody{overflow-y:auto;padding:18px;font-size:13.5px;white-space:pre-wrap;font-family:'DM Mono',monospace;line-height:1.7;color:#C9CAD2}
.modal .mbody mark{background:var(--gold-soft);color:var(--gold);border-radius:3px;padding:1px 2px;border:1px solid var(--gold)}
.modal.small{width:min(460px,100%)}
.modal .mbody.sans{font-family:'DM Sans',sans-serif;white-space:normal}
.modal .mbody label{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.modal .mbody input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:14px;margin-bottom:12px;font-family:'DM Mono',monospace}
.modal .mbody input:focus{border-color:var(--gold);outline:none}
.modal .mbody .row{display:flex;gap:10px}
.finemeta{font-size:12px;color:var(--muted);margin-top:8px}

/* create tools */
.bigmodal{width:min(1100px,96vw)}
.toolrow{display:flex;gap:8px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.toolrow .tspacer{flex:1}
.mmwrap{overflow:auto;flex:1;padding:12px;min-height:320px}
.genhint{color:var(--muted);font-size:13px;padding:28px;text-align:center;max-width:520px;margin:0 auto}
.deckwrap{overflow-y:auto;flex:1;padding:14px 18px;min-height:320px}
.slidecard{background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
.slidecard .sc-top{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line)}
.slidecard .sc-num{font-family:'DM Mono',monospace;font-size:11px;color:var(--gold);letter-spacing:.8px;flex:1}
.slidecard .sc-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:5px;font-size:11px;padding:3px 8px}
.slidecard .sc-btn:hover{border-color:var(--gold);color:var(--gold)}
.slidecard .sc-btn:disabled{opacity:.35;cursor:not-allowed}
.slidecard input.sc-title{width:100%;background:none;border:none;font-family:'Playfair Display',serif;font-size:18px;color:var(--gold);padding:12px 16px 6px}
.slidecard input.sc-title:focus{outline:none}
.slidecard textarea.sc-bullets{width:100%;background:none;border:none;color:var(--text);font-size:13.5px;padding:8px 16px 14px;resize:vertical;min-height:84px;line-height:1.7}
.slidecard textarea.sc-bullets:focus{outline:none}
.goldrule{height:2px;background:var(--gold);margin:0 16px;opacity:.85;width:110px}
.repbody{overflow-y:auto;flex:1;padding:16px 18px;min-height:320px}
.repgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin-bottom:8px}
.repgrid label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--text);cursor:pointer}
.repgrid input{accent-color:var(--gold)}
.rephead{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:12px 0 8px}
.repsel{background:var(--bg);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;max-width:240px}
.repsel:focus{border-color:var(--gold);outline:none}
.repnote{background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);border-radius:8px;padding:9px 12px;font-size:12.5px;margin:8px 0 4px}
.custfield{margin-bottom:10px}
.custfield label{display:block;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.custfield input,.custfield textarea,.custfield select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13.5px;color:var(--text);font-family:'DM Sans',sans-serif}
.custfield textarea{resize:vertical;min-height:64px}
.custfield input:focus,.custfield textarea:focus,.custfield select:focus{border-color:var(--gold);outline:none}
.custrow{display:flex;gap:8px;margin-bottom:8px}
.reppreview{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:18px;font-size:14px;white-space:pre-wrap;margin-top:14px}
@media(max-width:700px){.repgrid{grid-template-columns:1fr}}

/* mobile */
.tabbar{display:none}
@media(max-width:1000px){
  .ws{grid-template-columns:1fr;height:calc(100vh - 108px)}
  .pane{display:none;border-right:none}
  .pane.active{display:block}
  .chatwrap{display:none}
  .chatwrap.active{display:flex}
  .tabbar{display:flex;border-bottom:1px solid var(--line);background:var(--panel)}
  .tabbar button{flex:1;background:none;border:none;color:var(--muted);padding:11px;font-size:13px;letter-spacing:.5px;border-bottom:2px solid transparent}
  .tabbar button.on{color:var(--gold);border-bottom-color:var(--gold)}
}
@media(prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
  <link rel="stylesheet" href="arc_uniform_design.css">
</head>
<body>

<header class="hdr">
  <div class="mono">A</div>
  <div>
    <h1 id="hdrTitle">ARC Notebook</h1>
    <div class="sub" id="hdrSub">Grounded document intelligence</div>
  </div>
  <div class="spacer"></div>
  <button class="backbtn" id="backBtn" style="display:none">&#8592; Notebooks</button>
  <button class="iconbtn" id="settingsBtn">Settings</button>
</header>

<div class="tabbar" id="tabbar" style="display:none">
  <button data-tab="sources">Sources</button>
  <button data-tab="chat" class="on">Chat</button>
  <button data-tab="studio">Studio</button>
</div>

<main id="app"></main>

<div class="overlay" id="srcOverlay">
  <div class="modal">
    <div class="mhead"><h3 id="srcTitle">Source</h3><button class="mclose" id="srcClose">&times;</button></div>
    <div class="mbody" id="srcBody"></div>
  </div>
</div>

<div class="overlay" id="setOverlay">
  <div class="modal small">
    <div class="mhead"><h3>Settings</h3><button class="mclose" id="setClose">&times;</button></div>
    <div class="mbody sans">
      <label for="keyInput">Gemini API key</label>
      <input type="password" id="keyInput" autocomplete="off" placeholder="AIza...">
      <div class="row">
        <button class="goldbtn" id="keySave">Save key</button>
        <button class="iconbtn" id="keyClear">Clear key</button>
      </div>
      <p class="finemeta">The key is stored only in this browser's localStorage under ARC_GEMINI_KEY_V1 and is sent only to the Google Gemini API. Answers are strictly limited to your uploaded sources.</p>
    </div>
  </div>
</div>

<div class="overlay" id="mmOverlay">
  <div class="modal bigmodal">
    <div class="mhead"><h3>Mind map</h3><button class="mclose" data-close="mmOverlay">&times;</button></div>
    <div class="toolrow">
      <button class="goldbtn" id="mmGen">Generate</button>
      <button class="iconbtn" id="mmSvg">Export SVG</button>
      <button class="iconbtn" id="mmPng">Export PNG</button>
      <span class="tspacer"></span>
      <span class="finemeta" id="mmStatus"></span>
    </div>
    <div class="mmwrap" id="mmWrap"></div>
  </div>
</div>

<div class="overlay" id="deckOverlay">
  <div class="modal bigmodal">
    <div class="mhead"><h3>Slide deck</h3><button class="mclose" data-close="deckOverlay">&times;</button></div>
    <div class="toolrow">
      <button class="goldbtn" id="deckGen">Generate</button>
      <button class="iconbtn" id="deckAdd">Add slide</button>
      <button class="iconbtn" id="deckPptx">Export .pptx</button>
      <span class="tspacer"></span>
      <span class="finemeta" id="deckStatus"></span>
    </div>
    <div class="deckwrap" id="deckWrap"></div>
  </div>
</div>

<div class="overlay" id="repOverlay">
  <div class="modal bigmodal">
    <div class="mhead"><h3>Create report</h3><button class="mclose" data-close="repOverlay">&times;</button></div>
    <div class="toolrow">
      <select id="repType" class="repsel" aria-label="Report type"></select>
      <button class="goldbtn" id="repGen">Generate narrative</button>
      <button class="iconbtn" id="repMd">Markdown</button>
      <button class="iconbtn" id="repDocx">Word .docx</button>
      <button class="iconbtn" id="repPrint">Print / PDF</button>
      <button class="iconbtn" id="repJson">Draft JSON v6</button>
      <span class="tspacer"></span>
      <span class="finemeta" id="repStatus"></span>
    </div>
    <div class="repbody">
      <div id="repOpts"></div>
      <div class="reppreview" id="repPreview"></div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple accept=".pdf,.docx,.txt,.md" style="display:none">

<script>
(function () {
  'use strict';

  /* ===================== constants ===================== */
  var INDEX_KEY = 'ARC_NB_INDEX_V1';
  var GEMINI_KEY = 'ARC_GEMINI_KEY_V1';
  var MODEL_CACHE_KEY = 'ARC_NB_MODEL_V1';
  var MODEL_LADDER = ['gemini-3.5-flash', 'gemini-2.5-flash', 'gemini-flash-latest'];
  var CHUNK_SIZE = 1400;
  var CHUNK_OVERLAP = 200;
  var RETRIEVE_TOP = 12;
  var RETRIEVE_CHAR_CAP = 22000;
  var SYNTH_CHAR_CAP = 26000;
  var DOC_CHAR_CAP = 1500000;
  var NOT_FOUND_LINE = 'The uploaded documents do not contain information to answer this question.';
  var STOP = {};
  ('the a an and or but if then else of in on at to for from by with as is are was were be been this that these those it its not no yes do does did have has had can could will would may might about into over under between within their there here what which when where who whom whose how why all any each such than very own same so too also').split(' ').forEach(function (w) { STOP[w] = 1; });

  /* ===================== small utils ===================== */
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function uid() { return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function fmtDate(ts) {
    var d = new Date(ts);
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }
  function fmtSize(n) {
    if (n > 1000000) return (n / 1000000).toFixed(1) + 'M chars';
    if (n > 1000) return Math.round(n / 1000) + 'k chars';
    return n + ' chars';
  }
  function download(filename, text) {
    var blob = new Blob([text], { type: 'text/markdown' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  /* ===================== storage: index + IndexedDB ===================== */
  function loadIndex() {
    try { return JSON.parse(localStorage.getItem(INDEX_KEY) || '[]'); } catch (e) { return []; }
  }
  function saveIndex(idx) { localStorage.setItem(INDEX_KEY, JSON.stringify(idx)); }

  var dbPromise = null;
  function idb() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise(function (resolve, reject) {
      var req = indexedDB.open('ARC_NOTEBOOK_DB_V1', 1);
      req.onupgradeneeded = function () {
        req.result.createObjectStore('notebooks', { keyPath: 'id' });
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbPromise;
  }
  function nbGet(id) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var r = db.transaction('notebooks').objectStore('notebooks').get(id);
        r.onsuccess = function () { resolve(r.result || null); };
        r.onerror = function () { reject(r.error); };
      });
    });
  }
  function nbPut(nb) {
    nb.updatedAt = Date.now();
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('notebooks', 'readwrite');
        tx.objectStore('notebooks').put(nb);
        tx.oncomplete = function () { resolve(nb); };
        tx.onerror = function () { reject(tx.error); };
      });
    }).then(function () {
      var idx = loadIndex();
      var found = false;
      for (var i = 0; i < idx.length; i++) {
        if (idx[i].id === nb.id) {
          idx[i] = indexEntry(nb);
          found = true;
        }
      }
      if (!found) idx.unshift(indexEntry(nb));
      idx.sort(function (a, b) { return b.updatedAt - a.updatedAt; });
      saveIndex(idx);
      return nb;
    });
  }
  function nbDelete(id) {
    return idb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction('notebooks', 'readwrite');
        tx.objectStore('notebooks').delete(id);
        tx.oncomplete = function () { resolve(); };
        tx.onerror = function () { reject(tx.error); };
      });
    }).then(function () {
      saveIndex(loadIndex().filter(function (e) { return e.id !== id; }));
    });
  }
  function indexEntry(nb) {
    return { id: nb.id, name: nb.name, caseNo: nb.caseNo || '', docCount: (nb.docs || []).length, updatedAt: nb.updatedAt || Date.now() };
  }

  /* ===================== app state ===================== */
  var current = null;        // full notebook object currently open
  var pending = false;       // a Gemini call is in flight
  var parsing = 0;           // files currently being parsed

  /* ===================== Gemini ===================== */
  function arcGetGeminiKey() {
    var k = localStorage.getItem(GEMINI_KEY);
    if (!k) {
      openSettings();
      throw new Error('Add your Gemini API key in Settings to continue.');
    }
    return k;
  }

  function geminiCallModel(model, key, promptText) {
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent?key=' + encodeURIComponent(key);
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{ role: 'user', parts: [{ text: promptText }] }],
        generationConfig: { temperature: 0.2, maxOutputTokens: 4096 }
      })
    }).then(function (res) {
      if (res.status === 404) return { notFound: true };
      return res.json().then(function (data) {
        if (!res.ok) {
          var msg = (data && data.error && data.error.message) ? data.error.message : ('HTTP ' + res.status);
          throw new Error('Gemini API error: ' + msg);
        }
        var out = '';
        try {
          var parts = data.candidates[0].content.parts;
          for (var i = 0; i < parts.length; i++) out += parts[i].text || '';
        } catch (e) {
          throw new Error('Gemini returned an empty response. Try again.');
        }
        if (!out.trim()) throw new Error('Gemini returned an empty response. Try again.');
        return { text: out };
      });
    });
  }

  function geminiDiscoverModels(key) {
    var url = 'https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(key);
    return fetch(url).then(function (res) { return res.json(); }).then(function (data) {
      var models = (data.models || [])
        .filter(function (m) {
          return (m.supportedGenerationMethods || []).indexOf('generateContent') >= 0 &&
                 m.name.indexOf('flash') >= 0 && m.name.indexOf('embedding') < 0;
        })
        .map(function (m) { return m.name.replace(/^models\//, ''); })
        .sort()
        .reverse();
      return models;
    });
  }

  function arcGeminiGenerate(promptText) {
    var key = arcGetGeminiKey();
    var cached = localStorage.getItem(MODEL_CACHE_KEY);
    var ladder = MODEL_LADDER.slice();
    if (cached && ladder.indexOf(cached) !== 0) {
      ladder = [cached].concat(ladder.filter(function (m) { return m !== cached; }));
    }
    function tryAt(i) {
      if (i >= ladder.length) {
        return geminiDiscoverModels(key).then(function (models) {
          if (!models.length) throw new Error('No compatible Gemini model was found on this API key.');
          return tryDiscovered(models, 0);
        });
      }
      return geminiCallModel(ladder[i], key, promptText).then(function (r) {
        if (r.notFound) return tryAt(i + 1);
        localStorage.setItem(MODEL_CACHE_KEY, ladder[i]);
        return r.text;
      });
    }
    function tryDiscovered(models, i) {
      if (i >= models.length || i >= 4) throw new Error('No compatible Gemini model responded. Check the API key and quota.');
      return geminiCallModel(models[i], key, promptText).then(function (r) {
        if (r.notFound) return tryDiscovered(models, i + 1);
        localStorage.setItem(MODEL_CACHE_KEY, models[i]);
        return r.text;
      });
    }
    return tryAt(0);
  }

  /* ===================== intake ===================== */
  function chunkOffsets(text) {
    var chunks = [];
    var s = 0;
    while (s < text.length) {
      var e = Math.min(text.length, s + CHUNK_SIZE);
      if (e < text.length) {
        var brk = text.lastIndexOf('\n', e);
        if (brk > s + CHUNK_SIZE * 0.5) e = brk;
      }
      chunks.push({ start: s, end: e });
      if (e >= text.length) break;
      s = Math.max(e - CHUNK_OVERLAP, s + 1);
    }
    return chunks;
  }

  function pageMarkers(text) {
    var out = [];
    var re = /\[Page (\d+)\]/g;
    var m;
    while ((m = re.exec(text)) !== null) out.push({ pos: m.index, page: parseInt(m[1], 10) });
    return out;
  }

  function pageAt(doc, offset) {
    var pm = doc.pm || [];
    var page = null;
    for (var i = 0; i < pm.length; i++) {
      if (pm[i].pos <= offset) page = pm[i].page; else break;
    }
    return page;
  }

  function extractPdf(buf) {
    return window.pdfjsLib.getDocument({ data: buf }).promise.then(function (pdf) {
      var chain = Promise.resolve('');
      var total = pdf.numPages;
      for (var p = 1; p <= total; p++) {
        (function (pageNo) {
          chain = chain.then(function (acc) {
            return pdf.getPage(pageNo).then(function (page) {
              return page.getTextContent().then(function (tc) {
                var line = tc.items.map(function (it) { return it.str; }).join(' ');
                return acc + '\n[Page ' + pageNo + ']\n' + line + '\n';
              });
            });
          });
        })(p);
      }
      return chain.then(function (text) { return { text: text, pages: total }; });
    });
  }

  function extractFile(file) {
    var name = file.name.toLowerCase();
    if (name.endsWith('.pdf')) {
      return file.arrayBuffer().then(extractPdf).then(function (r) { return { kind: 'PDF', text: r.text, pages: r.pages }; });
    }
    if (name.endsWith('.docx')) {
      return file.arrayBuffer().then(function (buf) {
        return window.mammoth.extractRawText({ arrayBuffer: buf }).then(function (r) {
          return { kind: 'DOCX', text: r.value, pages: null };
        });
      });
    }
    if (name.endsWith('.txt') || name.endsWith('.md')) {
      return file.text().then(function (t) { return { kind: name.endsWith('.md') ? 'MD' : 'TXT', text: t, pages: null }; });
    }
    return Promise.reject(new Error('Unsupported file type: ' + file.name + '. Upload PDF, DOCX, TXT, or MD.'));
  }

  function handleFiles(fileList) {
    if (!current) return;
    var files = Array.prototype.slice.call(fileList);
    if (!files.length) return;
    files.forEach(function (file) {
      parsing++;
      renderSources();
      extractFile(file).then(function (r) {
        var text = (r.text || '').replace(/\r\n/g, '\n');
        var truncated = false;
        if (text.length > DOC_CHAR_CAP) { text = text.slice(0, DOC_CHAR_CAP); truncated = true; }
        if (!text.trim()) throw new Error('No readable text was found in ' + file.name + '. If it is a scanned PDF, run OCR first.');
        var doc = {
          id: uid(),
          name: file.name,
          kind: r.kind,
          pages: r.pages,
          chars: text.length,
          truncated: truncated,
          text: text,
          chunks: chunkOffsets(text),
          pm: pageMarkers(text),
          addedAt: Date.now()
        };
        current.docs.push(doc);
        return nbPut(current);
      }).catch(function (err) {
        alert(err.message || String(err));
      }).then(function () {
        parsing--;
        renderSources();
        renderStudio();
        renderHeader();
      });
    });
  }

  /* ===================== retrieval ===================== */
  function tokenize(t) {
    return t.toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/).filter(function (w) {
      return w.length > 2 && !STOP[w];
    });
  }

  function allChunks(nb) {
    var out = [];
    nb.docs.forEach(function (doc) {
      doc.chunks.forEach(function (c, i) {
        out.push({ docId: doc.id, docName: doc.name, i: i, start: c.start, end: c.end });
      });
    });
    return out;
  }

  function chunkTextOf(nb, ch) {
    var doc = null;
    for (var i = 0; i < nb.docs.length; i++) if (nb.docs[i].id === ch.docId) { doc = nb.docs[i]; break; }
    return doc ? doc.text.slice(ch.start, ch.end) : '';
  }

  function retrieve(nb, question) {
    var terms = tokenize(question);
    var uniq = [];
    terms.forEach(function (t) { if (uniq.indexOf(t) < 0) uniq.push(t); });
    var chunks = allChunks(nb);
    if (!uniq.length) return chunks.slice(0, 6);
    // document frequency per term
    var lowers = chunks.map(function (ch) { return chunkTextOf(nb, ch).toLowerCase(); });
    var df = {};
    uniq.forEach(function (t) {
      var n = 0;
      for (var i = 0; i < lowers.length; i++) if (lowers[i].indexOf(t) >= 0) n++;
      df[t] = n;
    });
    var scored = chunks.map(function (ch, i) {
      var score = 0;
      uniq.forEach(function (t) {
        if (!df[t]) return;
        var count = 0, pos = 0;
        while ((pos = lowers[i].indexOf(t, pos)) >= 0) { count++; pos += t.length; }
        if (count > 0) score += (1 + Math.log(count)) * (1 / Math.log(2 + df[t]));
      });
      return { ch: ch, score: score };
    }).filter(function (s) { return s.score > 0; });
    scored.sort(function (a, b) { return b.score - a.score; });
    var picked = [];
    var chars = 0;
    for (var k = 0; k < scored.length && picked.length < RETRIEVE_TOP; k++) {
      var ch = scored[k].ch;
      var len = ch.end - ch.start;
      if (chars + len > RETRIEVE_CHAR_CAP && picked.length > 0) continue;
      picked.push(ch);
      chars += len;
    }
    return picked;
  }

  function spreadChunks(nb) {
    // even coverage across all documents for synthesis tasks
    var budget = SYNTH_CHAR_CAP;
    var picked = [];
    if (!nb.docs.length) return picked;
    var perDoc = Math.floor(budget / nb.docs.length);
    nb.docs.forEach(function (doc) {
      var used = 0;
      var step = 1;
      var estTotal = doc.chars;
      if (estTotal > perDoc) step = Math.ceil(estTotal / perDoc);
      for (var i = 0; i < doc.chunks.length; i += step) {
        var c = doc.chunks[i];
        var len = c.end - c.start;
        if (used + len > perDoc && used > 0) break;
        picked.push({ docId: doc.id, docName: doc.name, i: i, start: c.start, end: c.end });
        used += len;
      }
    });
    return picked;
  }

  /* ===================== grounded prompting ===================== */
  function buildExcerptBlock(nb, chunks) {
    var lines = [];
    var cites = [];
    chunks.forEach(function (ch, idx) {
      var n = idx + 1;
      var doc = null;
      for (var i = 0; i < nb.docs.length; i++) if (nb.docs[i].id === ch.docId) { doc = nb.docs[i]; break; }
      var page = doc ? pageAt(doc, ch.start) : null;
      var head = '[S' + n + '] From "' + ch.docName + '"' + (page ? ' (page ' + page + ')' : '') + ':';
      lines.push(head + '\n' + chunkTextOf(nb, ch));
      cites.push({ n: n, docId: ch.docId, docName: ch.docName, start: ch.start, end: ch.end, page: page });
    });
    return { block: lines.join('\n\n'), cites: cites };
  }

  function historyBlock(nb) {
    var msgs = (nb.messages || []).filter(function (m) { return m.role === 'user' || m.role === 'assistant'; });
    var last = msgs.slice(-6);
    if (!last.length) return '';
    var lines = last.map(function (m) {
      var t = m.text.length > 700 ? m.text.slice(0, 700) + ' ...' : m.text;
      return (m.role === 'user' ? 'User: ' : 'Assistant: ') + t;
    });
    return '\n\nPRIOR CONVERSATION (context only; the grounding rules above still apply):\n' + lines.join('\n');
  }

  function groundedPrompt(nb, excerpts, task, includeHistory) {
    return 'You are ARC Notebook, a document analysis assistant for a criminal defense investigation firm.\n\n' +
      'STRICT GROUNDING RULES:\n' +
      '1. Answer ONLY from the numbered source excerpts below. They are your entire universe of knowledge.\n' +
      '2. Never use outside knowledge, training data, assumptions, or general legal knowledge. Do not fill gaps.\n' +
      '3. If the excerpts do not contain the information needed, reply with exactly this sentence and nothing else: ' + NOT_FOUND_LINE + '\n' +
      '4. Cite every factual statement with the matching excerpt tag in square brackets, for example [S3]. Multiple tags are allowed, for example [S1][S4].\n' +
      '5. Never invent citations. Only use tags that appear in the excerpts below.\n' +
      '6. Quote sparingly and accurately. Flag uncertainty or conflicting sources explicitly.\n' +
      '7. Do not use em dashes anywhere in your output.\n\n' +
      'SOURCE EXCERPTS:\n\n' + excerpts +
      (includeHistory ? historyBlock(nb) : '') +
      '\n\nTASK:\n' + task;
  }

  /* ===================== chat ===================== */
  function pushMessage(msg) {
    current.messages.push(msg);
    return nbPut(current);
  }

  function ask(question, taskOverride, useSpread, label) {
    if (pending || !current) return;
    if (!current.docs.length) {
      current.messages.push({ role: 'err', text: 'Upload at least one source document first. Answers can only come from your sources.', ts: Date.now() });
      nbPut(current).then(renderChat);
      return;
    }
    pending = true;
    current.messages.push({ role: 'user', text: label || question, ts: Date.now() });
    renderChat();
    renderTyping(true);
    nbPut(current);

    var chunks = useSpread ? spreadChunks(current) : retrieve(current, question);
    if (!chunks.length) chunks = allChunks(current).slice(0, 6);
    var built = buildExcerptBlock(current, chunks);
    var task = taskOverride || ('Answer this question: ' + question);
    var prompt = groundedPrompt(current, built.block, task, !taskOverride);

    arcGeminiGenerate(prompt).then(function (text) {
      current.messages.push({ role: 'assistant', text: text.trim(), cites: built.cites, ts: Date.now() });
      return nbPut(current);
    }).catch(function (err) {
      current.messages.push({ role: 'err', text: err.message || String(err), ts: Date.now() });
      return nbPut(current);
    }).then(function () {
      pending = false;
      renderTyping(false);
      renderChat();
    });
  }

  var SYNTH = {
    briefing: {
      title: 'Briefing document',
      hint: 'Overview, parties, key facts, issues',
      task: 'Produce a structured briefing document of the uploaded sources with these sections, using ## headings: Overview, Parties and Roles, Key Facts, Key Dates, Issues and Discrepancies, Open Questions. Every factual statement must carry a citation tag. If a section has no supporting material in the excerpts, write "Not covered in the uploaded sources." under it.'
    },
    timeline: {
      title: 'Timeline of events',
      hint: 'Chronology built from the sources',
      task: 'Build a chronological timeline of events found in the excerpts. One line per event in the form: date, event description, citation tag. Order by date. List events with no stated date in a final section titled Undated Events. Do not infer dates that are not stated.'
    },
    contradictions: {
      title: 'Contradiction check',
      hint: 'Conflicts between sources',
      task: 'Compare the excerpts across documents and identify every contradiction, inconsistency, or material discrepancy between sources. For each, state what each source says with citation tags for both sides. If no contradictions appear in the excerpts, say exactly: No contradictions were found within the excerpted material.'
    }
  };

  function runSynthesis(kind) {
    var s = SYNTH[kind];
    if (!s) return;
    ask(s.title, s.task, true, 'Generate: ' + s.title);
  }

  /* ===================== notes ===================== */
  function addNote(title, text, cites) {
    current.notes.push({ id: uid(), title: title, text: text, cites: cites || null, ts: Date.now() });
    nbPut(current).then(renderStudio);
  }

  function exportNotes() {
    if (!current.notes.length) { alert('There are no notes to export yet. Pin an answer or add a note first.'); return; }
    var lines = ['# ' + current.name + (current.caseNo ? ' (' + current.caseNo + ')' : ''), '', 'Exported ' + new Date().toLocaleString(), ''];
    current.notes.forEach(function (n) {
      lines.push('## ' + n.title);
      lines.push('');
      lines.push(n.text);
      lines.push('');
    });
    download((current.name || 'arc-notebook').replace(/[^a-z0-9]+/gi, '-').toLowerCase() + '-notes.md', lines.join('\n'));
  }

  /* ===================== rendering ===================== */
  var app = $('app');

  function renderHeader() {
    if (current) {
      $('hdrTitle').textContent = current.name;
      $('hdrSub').textContent = (current.caseNo ? current.caseNo + '  |  ' : '') + current.docs.length + (current.docs.length === 1 ? ' source' : ' sources');
      $('backBtn').style.display = '';
      $('tabbar').style.display = '';
    } else {
      $('hdrTitle').textContent = 'ARC Notebook';
      $('hdrSub').textContent = 'Grounded document intelligence';
      $('backBtn').style.display = 'none';
      $('tabbar').style.display = 'none';
    }
  }

  function renderHome() {
    current = null;
    renderHeader();
    app.innerHTML = '';
    var home = el('div', 'home');
    home.appendChild(el('h2', null, 'Notebooks'));
    home.appendChild(el('p', 'lead', 'One notebook per case or matter. Upload reports, then ask questions answered strictly from those documents, with citations back to the exact passage.'));
    var grid = el('div', 'nbgrid');

    var newcard = el('div', 'newcard');
    newcard.appendChild(el('h3', null, 'New notebook'));
    var nameIn = el('input');
    nameIn.placeholder = 'Notebook name, e.g. Commonwealth v. Murray';
    var caseIn = el('input');
    caseIn.placeholder = 'Case number (optional)';
    var createBtn = el('button', 'goldbtn', 'Create notebook');
    createBtn.addEventListener('click', function () {
      var name = nameIn.value.trim();
      if (!name) { nameIn.focus(); return; }
      var nb = { id: uid(), name: name, caseNo: caseIn.value.trim(), docs: [], messages: [], notes: [], createdAt: Date.now() };
      nbPut(nb).then(function () { openNotebook(nb.id); });
    });
    nameIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') createBtn.click(); });
    caseIn.addEventListener('keydown', function (e) { if (e.key === 'Enter') createBtn.click(); });
    newcard.appendChild(nameIn);
    newcard.appendChild(caseIn);
    newcard.appendChild(createBtn);
    grid.appendChild(newcard);

    loadIndex().forEach(function (entry) {
      var card = el('div', 'nbcard');
      card.setAttribute('role', 'button');
      card.tabIndex = 0;
      card.appendChild(el('h3', null, entry.name));
      if (entry.caseNo) card.appendChild(el('div', 'case', entry.caseNo));
      card.appendChild(el('div', 'meta', entry.docCount + (entry.docCount === 1 ? ' source' : ' sources') + '  |  updated ' + fmtDate(entry.updatedAt)));
      var del = el('button', 'del', '\u2715');
      del.title = 'Delete notebook';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('Delete "' + entry.name + '" and all of its sources, chat, and notes? This cannot be undone.')) return;
        nbDelete(entry.id).then(renderHome);
      });
      card.appendChild(del);
      card.addEventListener('click', function () { openNotebook(entry.id); });
      card.addEventListener('keydown', function (e) { if (e.key === 'Enter') openNotebook(entry.id); });
      grid.appendChild(card);
    });

    home.appendChild(grid);
    app.appendChild(home);
  }

  function openNotebook(id) {
    nbGet(id).then(function (nb) {
      if (!nb) { renderHome(); return; }
      if (!nb.docs) nb.docs = [];
      if (!nb.messages) nb.messages = [];
      if (!nb.notes) nb.notes = [];
      current = nb;
      renderWorkspace();
    });
  }

  function renderWorkspace() {
    renderHeader();
    app.innerHTML = '';
    var ws = el('div', 'ws');

    var sources = el('section', 'pane');
    sources.id = 'paneSources';
    ws.appendChild(sources);

    var chat = el('section', 'chatwrap active');
    chat.id = 'paneChat';
    ws.appendChild(chat);

    var studio = el('section', 'pane studio');
    studio.id = 'paneStudio';
    ws.appendChild(studio);

    app.appendChild(ws);
    renderSources();
    buildChatShell();
    renderChat();
    renderStudio();
    setTab('chat');
  }

  function renderSources() {
    var pane = $('paneSources');
    if (!pane || !current) return;
    pane.innerHTML = '';
    var head = el('div', 'panehead');
    head.appendChild(el('span', null, 'Sources'));
    head.appendChild(el('span', 'count', String(current.docs.length)));
    pane.appendChild(head);

    var dz = el('div', 'dropzone');
    dz.innerHTML = 'Drop PDF, DOCX, TXT, or MD files here, or ';
    var browse = el('button', 'browse', 'browse');
    browse.addEventListener('click', function () { $('fileInput').click(); });
    dz.appendChild(browse);
    dz.addEventListener('dragover', function (e) { e.preventDefault(); dz.classList.add('on'); });
    dz.addEventListener('dragleave', function () { dz.classList.remove('on'); });
    dz.addEventListener('drop', function (e) {
      e.preventDefault();
      dz.classList.remove('on');
      handleFiles(e.dataTransfer.files);
    });
    pane.appendChild(dz);

    if (parsing > 0) pane.appendChild(el('div', 'busy', 'Reading ' + parsing + (parsing === 1 ? ' file...' : ' files...')));

    var list = el('div', 'doclist');
    current.docs.forEach(function (doc, i) {
      var row = el('div', 'docrow');
      row.setAttribute('role', 'button');
      row.tabIndex = 0;
      var letter = String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : '');
      row.appendChild(el('div', 'exhibit', letter));
      var info = el('div');
      info.appendChild(el('div', 'dname', doc.name));
      var meta = doc.kind + '  |  ' + (doc.pages ? doc.pages + ' pp  |  ' : '') + fmtSize(doc.chars) + (doc.truncated ? '  |  truncated' : '');
      info.appendChild(el('div', 'dmeta', meta));
      row.appendChild(info);
      var del = el('button', 'ddel', '\u2715');
      del.title = 'Remove source';
      del.addEventListener('click', function (e) {
        e.stopPropagation();
        if (!confirm('Remove "' + doc.name + '" from this notebook?')) return;
        current.docs = current.docs.filter(function (d) { return d.id !== doc.id; });
        nbPut(current).then(function () { renderSources(); renderStudio(); renderHeader(); });
      });

  function mdLite(text) {
    var h = esc(text);
    h = h.replace(/^######?\s*(.+)$/gm, '<span class="aihead">$1</span>');
    h = h.replace(/^####\s*(.+)$/gm, '<span class="aihead">$1</span>');
    h = h.replace(/^###\s*(.+)$/gm, '<span class="aihead">$1</span>');
    h = h.replace(/^##\s*(.+)$/gm, '<span class="aihead">$1</span>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    return h;
  }

  function renderCites(html, cites) {
    if (!cites) return html;
    return html.replace(/\[S(\d+)\]/g, function (full, num) {
      var n = parseInt(num, 10);
      var c = null;
      for (var i = 0; i < cites.length; i++) if (cites[i].n === n) { c = cites[i]; break; }
      if (!c) return full;
      var title = c.docName + (c.page ? ', page ' + c.page : '');
      return '<button class="cite" data-doc="' + esc(c.docId) + '" data-start="' + c.start + '" data-end="' + c.end + '" title="' + esc(title) + '">S' + n + '</button>';
    });
  }

  function renderChat() {
    var msgs = $('msgs');
    if (!msgs || !current) return;
    msgs.innerHTML = '';
    if (!current.messages.length) {
      var empty = el('div', 'emptychat');
      empty.appendChild(el('div', 'big', 'Ask the record, not the internet.'));
      empty.appendChild(el('div', null, 'Upload reports on the left, then ask a question. Every answer cites the exact source passage, and anything not in the documents is refused.'));
      msgs.appendChild(empty);
      return;
    }
    current.messages.forEach(function (m, idx) {
      var b;
      if (m.role === 'user') {
        b = el('div', 'msg user', m.text);
      } else if (m.role === 'err') {
        b = el('div', 'msg err', m.text);
      } else {
        b = el('div', 'msg ai');
        b.innerHTML = renderCites(mdLite(m.text), m.cites);
        var tools = el('div', 'mtools');
        var pin = el('button', 'pinbtn', 'Pin to notes');
        pin.addEventListener('click', function () {
          var title = 'Pinned answer';
          for (var j = idx - 1; j >= 0; j--) {

          }
          addNote(title, m.text, m.cites);
        });
        var copy = el('button', 'pinbtn', 'Copy');

        tools.appendChild(pin);

  function arcPublishCaseBrief() {
    try {
      if (!current) return;

      var context = window.ARC_CASE_CONTEXT || {};
      var reports = nbReports();
      var bestText = '';
      var bestType = '';

      Object.keys(reports).forEach(function (key) {
        var report = reports[key];
        if (report && report.text && report.text.length > bestText.length) {
          bestText = report.text;
          bestType = key;
        }
      });

      var brief = {
        version: 1,
        matter: context.matter || current.name || '',
        docket: context.docket || current.caseNo || '',
        caseContext: context,
        notebookName: current.name || '',
        docs: (current.docs || []).map(function (documentItem) {
          return {
            id: documentItem.id || '',
            name: documentItem.name || '',
            chars: documentItem.chars || String(documentItem.text || '').length || 0
          };
        }),
        reportType: bestType,
        reportText: bestText,
        deck: current.deck
          ? {
              title: current.deck.title,
              subtitle: current.deck.subtitle,
              slides: current.deck.slides
            }
          : null,
        mindmap: current.mindmap ? current.mindmap.data : null,
        updatedAt: new Date().toISOString()
      };

      localStorage.setItem('ARC_CASE_BRIEF_V1', JSON.stringify(brief));

      try {
        if ('BroadcastChannel' in window) {
          var channel = new BroadcastChannel('arc-unified-system');
          channel.postMessage({
            type: 'storage',
            key: 'ARC_CASE_BRIEF_V1',
            value: brief
          });
          channel.close();
        }
      } catch (channelError) {}

      document.dispatchEvent(
        new CustomEvent('arc:case-brief', {
          detail: brief
        })
      );
    } catch (error) {
      console.warn('ARC Notebook could not publish the shared case brief.', error);
    }
  }

  function parseJsonReply(text) {
    var t = String(text).replace(/```json/gi, '').split('```').join('').trim();
    var a = t.indexOf('{');
    var b = t.lastIndexOf('}');
    if (a < 0 || b <= a) throw new Error('The model did not return valid JSON. Try again.');
    return JSON.parse(t.slice(a, b + 1));
  }

  function downloadBlob(filename, blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  }

  function fileBase() {
    return ((current && current.name) || 'arc-notebook').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  }

  function exhibitLetter(i) {
    return String.fromCharCode(65 + (i % 26)) + (i >= 26 ? Math.floor(i / 26) : '');
  }

  function groundedJsonPrompt(excerpts, task) {
    return 'You are ARC Notebook, a document analysis assistant for a criminal defense investigation firm.\n\n' +
      'STRICT GROUNDING RULES:\n' +
      '1. Use ONLY the numbered source excerpts below. They are your entire universe of knowledge.\n' +
      '2. Never use outside knowledge, training data, assumptions, or general legal knowledge. Do not fill gaps.\n' +
      '3. Respond with a single JSON object only. No markdown, no code fences, no commentary before or after.\n' +
      '4. Reference sources by excerpt number as integers in "cites" arrays, or as [S#] tags where the shape asks for text. Only use numbers that exist below.\n' +
      '5. If the excerpts do not contain enough material for the task, respond with exactly {"error":"insufficient sources"}.\n' +
      '6. Do not use em dashes anywhere.\n\n' +
      'SOURCE EXCERPTS:\n\n' + excerpts + '\n\nTASK:\n' + task;
  }

  /* ===================== mind map ===================== */
  function openMindMap() {
    if (!current) return;
    $('mmOverlay').classList.add('show');
    $('mmStatus').textContent = '';
    renderMindMap();
  }

  function mmGenerate() {
    if (pending || !current) return;
    if (!current.docs.length) { $('mmStatus').textContent = 'Upload sources first.'; return; }
    if (current.mindmap && !confirm('Regenerate the mind map? The current map will be replaced.')) return;
    pending = true;
    $('mmGen').disabled = true;
    $('mmStatus').textContent = 'Reading sources...';
    var built = buildExcerptBlock(current, spreadChunks(current));
    var task = 'Build a mind map of the uploaded sources. Return JSON with this exact shape: ' +
      '{"root":"central theme, max 6 words","branches":[{"label":"topic, max 7 words","cites":[1],"children":[{"label":"fact or detail, max 12 words","cites":[2]}]}]}. ' +
      'Use 4 to 7 branches and 2 to 5 children per branch. Every label must come from the excerpts and every branch and child must include at least one cite number.';
    arcGeminiGenerate(groundedJsonPrompt(built.block, task)).then(function (text) {
      var data = parseJsonReply(text);
      if (data.error) throw new Error('The uploaded documents do not contain enough material for a mind map.');
      if (!data.root || !data.branches || !data.branches.length) throw new Error('The model returned an unexpected mind map shape. Try again.');
      data.branches.forEach(function (b) {
        b.open = true;
        if (!b.children) b.children = [];
        if (!b.cites) b.cites = [];
        b.children.forEach(function (c) { if (!c.cites) c.cites = []; });
      });
      current.mindmap = { data: data, cites: built.cites, generatedAt: Date.now() };
      $('mmStatus').textContent = '';
      arcPublishCaseBrief();
      return nbPut(current);
    }).catch(function (err) {
      $('mmStatus').textContent = err.message || String(err);
    }).then(function () {
      pending = false;
      $('mmGen').disabled = false;
      renderMindMap();
    });
  }

  function mmTextW(label, size) {
    return Math.max(56, 20 + String(label).length * size * 0.58);
  }

  function renderMindMap() {
    var wrap = $('mmWrap');
    if (!wrap || !current) return;
    wrap.innerHTML = '';
    var mm = current.mindmap;
    if (!mm) {
      wrap.appendChild(el('div', 'genhint', 'Generate a mind map from the current sources. Every node cites the passages it came from; click an S tag to open the source at that passage. Click a topic to collapse or expand its details.'));
      return;
    }
    var GOLD = '#C9A84C', LINE = '#3A3E50', TXT = '#E8E6E0', PANEL = '#1D1F26', BG = '#15161B';
    var svgNS = 'http://www.w3.org/2000/svg';
    var rowH = 36, gapB = 22, chipW = 26, chipH = 15;
    var data = mm.data;

    var rootW = mmTextW(data.root, 15);
    var maxBW = 0;
    data.branches.forEach(function (b) {
      maxBW = Math.max(maxBW, mmTextW(b.label, 13) + (b.cites.length * chipW) + 8);
    });
    var x0 = 12, x1 = x0 + rootW + 70, x2 = x1 + maxBW + 60;

    var yCur = 14;
    var pos = [];
    data.branches.forEach(function (b) {
      var kids = b.open ? b.children : [];
      var h = Math.max(rowH, kids.length * rowH);
      pos.push({ b: b, y: yCur, h: h });
      yCur += h + gapB;
    });
    var totalH = Math.max(yCur, 140);
    var maxCW = 0;
    data.branches.forEach(function (b) {
      b.children.forEach(function (c) {
        maxCW = Math.max(maxCW, mmTextW(c.label, 12) + (c.cites.length * chipW) + 8);
      });
    });
    var totalW = x2 + maxCW + 20;

    var svg = document.createElementNS(svgNS, 'svg');
    svg.setAttribute('xmlns', svgNS);
    svg.setAttribute('width', totalW);
    svg.setAttribute('height', totalH);
    svg.setAttribute('viewBox', '0 0 ' + totalW + ' ' + totalH);
    svg.setAttribute('font-family', 'DM Sans, Arial, sans-serif');

    function node(tag, attrs, textContent) {
      var n = document.createElementNS(svgNS, tag);
      Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
      if (textContent !== undefined) n.textContent = textContent;
      return n;
    }
    function link(xa, ya, xb, yb) {
      var mx = (xa + xb) / 2;
      return node('path', { d: 'M' + xa + ',' + ya + ' C' + mx + ',' + ya + ' ' + mx + ',' + yb + ' ' + xb + ',' + yb, stroke: LINE, fill: 'none', 'stroke-width': 1.4 });
    }
    function chips(x, cy, cites) {
      cites.forEach(function (n, i) {
        var cx = x + i * chipW;
        var cg = node('g', { 'data-cite': n, cursor: 'pointer' });
        cg.appendChild(node('rect', { x: cx, y: cy - chipH / 2, width: chipW - 4, height: chipH, rx: 3, fill: 'rgba(201,168,76,0.14)', stroke: GOLD, 'stroke-width': 0.8 }));
        cg.appendChild(node('text', { x: cx + (chipW - 4) / 2, y: cy + 3.5, 'text-anchor': 'middle', 'font-size': 9, fill: GOLD, 'font-family': 'DM Mono, monospace' }, 'S' + n));
        svg.appendChild(cg);
      });
    }

    svg.appendChild(node('rect', { x: 0, y: 0, width: totalW, height: totalH, fill: BG }));

    var rootY = totalH / 2;
    pos.forEach(function (p, pi) {
      var by = p.y + p.h / 2;
      svg.appendChild(link(x0 + rootW, rootY, x1, by));
      var bw = mmTextW(p.b.label, 13) + (p.b.cites.length * chipW) + 8;
      var bg = node('g', { 'data-branch': pi, cursor: 'pointer' });
      bg.appendChild(node('rect', { x: x1, y: by - 16, width: bw, height: 32, rx: 6, fill: PANEL, stroke: p.b.open ? GOLD : LINE, 'stroke-width': 1 }));
      var marker = p.b.children.length ? (p.b.open ? '\u2212 ' : '+ ') : '';
      bg.appendChild(node('text', { x: x1 + 10, y: by + 4.5, 'font-size': 13, fill: TXT }, marker + p.b.label));
      svg.appendChild(bg);
      chips(x1 + mmTextW(p.b.label, 13) + 4, by, p.b.cites);
      if (p.b.open) {
        p.b.children.forEach(function (c, j) {
          var cy2 = p.y + j * rowH + rowH / 2;
          svg.appendChild(link(x1 + bw, by, x2, cy2));
          svg.appendChild(node('rect', { x: x2, y: cy2 - 13, width: mmTextW(c.label, 12) + (c.cites.length * chipW) + 8, height: 26, rx: 5, fill: 'none', stroke: LINE, 'stroke-width': 1 }));
          svg.appendChild(node('text', { x: x2 + 8, y: cy2 + 4, 'font-size': 12, fill: TXT }, c.label));
          chips(x2 + mmTextW(c.label, 12) + 2, cy2, c.cites);
        });
      }
    });

    var rg = node('g', {});
    rg.appendChild(node('rect', { x: x0, y: rootY - 20, width: rootW, height: 40, rx: 7, fill: PANEL, stroke: GOLD, 'stroke-width': 1.4 }));
    rg.appendChild(node('text', { x: x0 + 10, y: rootY + 5, 'font-size': 15, fill: GOLD, 'font-family': 'Playfair Display, Georgia, serif', 'font-weight': 'bold' }, data.root));
    svg.appendChild(rg);

    svg.addEventListener('click', function (e) {
      var t = e.target;
      while (t && t !== svg) {
        if (t.getAttribute) {
          var cn = t.getAttribute('data-cite');
          if (cn !== null) {
            var n = parseInt(cn, 10);
            for (var i = 0; i < mm.cites.length; i++) {
              if (mm.cites[i].n === n) { openSource(mm.cites[i].docId, mm.cites[i].start, mm.cites[i].end); return; }
            }
            return;
          }
          var bi = t.getAttribute('data-branch');
          if (bi !== null) {
            var br = data.branches[parseInt(bi, 10)];
            if (br && br.children.length) { br.open = !br.open; nbPut(current); renderMindMap(); }
            return;
          }
        }
        t = t.parentNode;
      }
    });

    wrap.appendChild(svg);
  }

  function mmExportSvg() {
    var svg = $('mmWrap').querySelector('svg');
    if (!svg) { $('mmStatus').textContent = 'Generate the mind map first.'; return; }
    var str = new XMLSerializer().serializeToString(svg);
    downloadBlob(fileBase() + '-mindmap.svg', new Blob([str], { type: 'image/svg+xml' }));
  }

  function mmExportPng() {
    var svg = $('mmWrap').querySelector('svg');
    if (!svg) { $('mmStatus').textContent = 'Generate the mind map first.'; return; }
    var str = new XMLSerializer().serializeToString(svg);
    var img = new Image();
    img.onload = function () {
      var scale = 2;
      var c = document.createElement('canvas');
      c.width = svg.viewBox.baseVal.width * scale;
      c.height = svg.viewBox.baseVal.height * scale;
      var ctx = c.getContext('2d');
      ctx.scale(scale, scale);
      ctx.drawImage(img, 0, 0);
      c.toBlob(function (b) {
        if (b) downloadBlob(fileBase() + '-mindmap.png', b);
        else $('mmStatus').textContent = 'PNG export failed. Use Export SVG instead.';
      });
    };
    img.onerror = function () { $('mmStatus').textContent = 'PNG export failed in this browser. Use Export SVG instead.'; };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(str);
  }

  function deckGenerate() {

    pending = true;

      var down = el('button', 'sc-btn', 'Down');

      down.addEventListener('click', function () { d.slides.splice(i, 1); d.slides.splice(i + 1, 0, s); nbPut(current); renderDeck(); });
      var del = el('button', 'sc-btn', 'Delete');

      var t = el('input', 'sc-title');

      t.setAttribute('aria-label', 'Slide title');
