<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="arc_shared_keys.js"></script>
<script src="arc_report_header.js"></script>
<title>ARC Legal Research &amp; Motions · Massachusetts</title>
<style>
:root{
  --navy:#0b1726; --navy-soft:#16263b; --ink:#2C2C2B; --ink-mid:#5a5344; --ink-faint:#7D7A75;
  --canvas:#FFFFFF; --soft:#F9F8F7; --soft2:#F0EFED; --line:#E6E5E3;
  --blue:#2783DE; --blue-soft:#E5F2FC; --green:#46A171; --green-soft:#E8F1EC;
  --orange:#D5803B; --orange-soft:#FBEBDE; --red:#E56458; --red-soft:#FCE9E7;
  --gold:#b59461; --gold-soft:#f7f0e2;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",Times,serif;
  --radius:8px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);background:var(--soft);color:var(--ink);font-size:15px;line-height:1.5;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--blue);}
.hidden{display:none !important;}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:8px;}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;}
.brand-mark{width:40px;height:40px;border:1px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--gold);}
.brand-name{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;}
.brand-sub{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(226,201,139,.85);margin-top:3px;}
.nav-btn{text-align:left;background:transparent;border:0;border-radius:8px;color:rgba(255,255,255,.78);padding:11px 12px;display:flex;gap:10px;align-items:flex-start;}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-btn.on{background:rgba(181,148,97,.18);color:#fff;box-shadow:inset 3px 0 0 var(--gold);}
.nav-btn small{display:block;font-size:11px;opacity:.7;margin-top:2px;}
.nav-num{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px;}
.nav-btn.on .nav-num{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700;}
.side-foot{margin-top:auto;padding:12px 8px 4px;font-size:11px;color:rgba(255,255,255,.45);line-height:1.45;}
.main{min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--canvas);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5;}
.topbar h1{font-size:18px;font-weight:650;}
.topbar p{font-size:12.5px;color:var(--ink-faint);}
.actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid var(--line);background:var(--canvas);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;}
.btn:hover{border-color:#c9c6c0;}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.primary:hover{background:var(--navy-soft);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--red);border-color:#f0c7c3;}
.content{padding:24px;max-width:1120px;width:100%;margin:0 auto;}
.grid-2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:16px;}
.grid-2>*{min-width:0;}
.card{background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);}
.card h2{font-size:15px;margin-bottom:6px;}
.card h3{font-size:13.5px;margin:14px 0 6px;}
.muted{color:var(--ink-faint);font-size:12.5px;}
.label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:10px 0 5px;}
input[type=text],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;
}
textarea{min-height:110px;resize:vertical;line-height:1.45;}
.prompt-box{background:var(--soft);border:1px dashed #d5d2cc;border-radius:8px;padding:12px;font-size:12.5px;white-space:pre-wrap;line-height:1.45;font-family:Menlo,Consolas,monospace;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;background:var(--soft);}
.chip.blue{background:var(--blue-soft);border-color:#c7e0f8;color:#1a5fa0;}
.chip.green{background:var(--green-soft);border-color:#c5dfcf;color:#2d6b49;}
.chip.orange{background:var(--orange-soft);border-color:#efd2b3;color:#8a4f1b;}
.chip.red{background:var(--red-soft);border-color:#f0c7c3;color:#9b342d;}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;}
table.data{width:100%;border-collapse:collapse;font-size:13px;background:#fff;}
table.data th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);background:var(--soft);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.data td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.data tr:last-child td{border-bottom:0;}
table.data tr:hover td{background:#fcfcfb;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap;}
.tab{border:0;background:transparent;padding:10px 12px;color:var(--ink-faint);border-bottom:2px solid transparent;font-weight:600;font-size:13px;}
.tab.on{color:var(--navy);border-bottom-color:var(--gold);}
.sources details{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;margin-bottom:8px;}
.sources summary{cursor:pointer;font-weight:650;}
.sources ul{margin:8px 0 0 18px;}
.sources li{margin:4px 0;}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.kpi .card{padding:14px;}
.kpi strong{display:block;font-size:22px;font-family:var(--serif);line-height:1.1;}
.kpi span{font-size:11px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;}
.modal-back{position:fixed;inset:0;background:rgba(11,23,38,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;}
.modal{background:#fff;border-radius:12px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:18px;box-shadow:var(--shadow);}
.modal h2{font-family:var(--serif);font-size:20px;margin-bottom:4px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#f3e7c8;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
.empty{text-align:center;padding:28px 12px;color:var(--ink-faint);}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;}
@media (max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:sticky;top:0;z-index:6;flex-direction:row;flex-wrap:wrap;gap:6px;padding:12px;}
  .brand{width:100%;border:0;margin:0;padding:0 0 8px;}
  .side-foot{display:none;}
  .nav-btn{flex:1 1 140px;}
  .grid-2,.kpi{grid-template-columns:minmax(0,1fr);}
  .content{padding:16px;}
}
@media print{
  .sidebar,.topbar,.actions,.toast,.modal-back{display:none !important;}
  .app{display:block;}
  .content{max-width:none;padding:0;}
  .card{box-shadow:none;}
}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
<script src="arc_shared_keys.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ARC</div>
      <div>
        <div class="brand-name">Legal Research &amp; Motions</div>
        <div class="brand-sub">Massachusetts · Attorney work product</div>
      </div>
    </div>
    <button class="nav-btn on" data-route="dashboard" type="button"><span class="nav-num">1</span><span>Dashboard<small>Cases overview</small></span></button>
    <button class="nav-btn" data-route="research" type="button"><span class="nav-num">2</span><span>Legal Research<small>MA hub + APIs</small></span></button>
    <button class="nav-btn" data-route="memos" type="button"><span class="nav-num">3</span><span>Research Memos<small>IRAC generator</small></span></button>
    <button class="nav-btn" data-route="motions" type="button"><span class="nav-num">4</span><span>Motion Engine<small>Drafts + templates</small></span></button>
    <button class="nav-btn" data-route="facts" type="button"><span class="nav-num">5</span><span>Facts &amp; Evidence<small>Case building blocks</small></span></button>
    <div class="side-foot">Local-only data · verified sources prompts · CourtListener / LII / GovInfo / RECAP</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">ARC Investigations &amp; Consulting</p>
      </div>
      <div class="actions">
        <button class="btn ghost" type="button" id="btnExport">Export JSON</button>
        <button class="btn ghost" type="button" id="btnImport">Import JSON</button>
        <button class="btn primary" type="button" id="btnNewCase">+ New case</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="modal-back hidden" id="modalBack">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
"use strict";

/* Shared key vault provided by arc_shared_keys.js. */

 try{ if(window.ARC_SYSTEM_KEYS){ ARC_SYSTEM_KEYS.mergeIntoModule("report"); ARC_SYSTEM_KEYS.mergeIntoModule("motion"); } }catch(e){}

(function () {
  const STORE_KEY = "arc_legal_research_motions_v1";
  const uid = (p = "id") => p + "_" + Math.random().toString(36).slice(2, 9);
  const today = () => new Date().toISOString();
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  const RESEARCH_PROMPT = `You are a legal research assistant focused on Massachusetts law.
Use ONLY verified sources: CourtListener (MA appellate + federal), Cornell LII (statutes), GovInfo (CFR + Federal Register), RECAP (federal dockets).
Provide:
• Summary
• Relevant statutes
• Relevant case law
• Citations
• Holdings
• How this applies to the user’s case
Never hallucinate. If no authority exists, say so.`;

  const CITATION_PROMPT = `Verify the following citations using CourtListener and Cornell LII.
Identify:
• Whether the case is still good law
• Whether it has been overruled, distinguished, or criticized
• Parallel citations
• Statute validity
Provide links to the original sources.

Citations to verify:
`;

  const MOTION_PROMPT = `Draft a [Motion Type] using ONLY verified sources:
• CourtListener (MA appellate + federal)
• Cornell LII (statutes)
• GovInfo (CFR + Federal Register)
• RECAP (federal dockets)
Pull facts from the linked Facts and Evidence databases.
Cite every authority.
Never hallucinate.
If no authority exists, say so.`;

  const SUPPRESS_TMPL = `INTRODUCTION
Brief summary of the issue.

FACTS
Pull from Facts DB:
• Fourth Amendment facts
• Timestamps
• Contradictions
• Chain-of-custody gaps

ARGUMENT
Cite:
• MA appellate cases (CourtListener)
• MGL statutes (Cornell LII)
• Federal cases (CourtListener)

CASE LAW
List holdings + citations.

CONCLUSION
Requested relief.`;

  const SENTENCE_TMPL = `BACKGROUND
Client history + mitigation.

OFFENSE DETAILS
Facts from Evidence DB.

LEGAL FRAMEWORK
Statutes (Cornell LII)
Case law (CourtListener)

MITIGATION FACTORS
List facts from Facts DB.

REQUESTED SENTENCE
Explain reasoning.`;

  const MEMO_TMPL = `ISSUE
What legal question are we answering?

RULE
List statutes + case law (MA + federal).

ANALYSIS
Explain how the rule applies to the facts.

CITATIONS
CourtListener citations + statute links.

CONCLUSION
Short, actionable answer.`;

  const defaultState = () => ({
    route: "dashboard",
    activeCaseId: null,
    cases: [
      { id: "c1", name: "Commonwealth v. Sample, John", docket: "2684CR00999", court: "Suffolk Superior", client: "Counsel of record", status: "Active", createdAt: today() }
    ],
    facts: [
      { id: "f1", caseId: "c1", fact: "Stop time conflict", detail: "Arrest report 11:42 PM; witness places vehicle parked ~11:30 PM.", timestamp: "03/14/2026 23:42", source: "arrest_report.pdf / witness_stmt", category: "Contradiction" },
      { id: "f2", caseId: "c1", fact: "Public way stop", detail: "Main Street at Elm Street alleged as stop location.", timestamp: "03/14/2026 23:42", source: "arrest_report.pdf p.1", category: "Fourth Amendment" }
    ],
    evidence: [
      { id: "e1", caseId: "c1", item: "Arrest report", description: "Narrative, FST and breath references", source: "arrest_report.pdf", custody: "Discovery production", type: "Document" },
      { id: "e2", caseId: "c1", item: "Witness statement", description: "Percipient account of parked vehicle", source: "witness_stmt.docx", custody: "Defense interview file", type: "Document" }
    ],
    memos: [],
    motions: []
  });

  let state;
  try {
    state = JSON.parse(localStorage.getItem(STORE_KEY) || "null") || defaultState();
  } catch {
    state = defaultState();
  }
  if (!state.cases) state = defaultState();

  const save = () => {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { toast("Storage full — export JSON"); }
  };

  const toast = (msg) => {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2400);
  };

  const caseById = (id) => state.cases.find((c) => c.id === id);
  const activeCase = () => caseById(state.activeCaseId) || state.cases[0] || null;
  const caseName = (id) => (caseById(id) || {}).name || "—";

  const downloadText = (text, name, type = "application/json") => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], { type }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 500);
  };

  const copyText = async (text) => {
    try {
      await navigator.clipboard.writeText(text);
      toast("Copied");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast("Copied");
    }
  };

  const closeModal = () => {
    document.getElementById("modalBack").classList.add("hidden");
    document.getElementById("modal").innerHTML = "";
  };
  const openModal = (html) => {
    document.getElementById("modal").innerHTML = html;
    document.getElementById("modalBack").classList.remove("hidden");
  };

  const setRoute = (route) => {
    state.route = route;
    save();
    render();
  };

  const titles = {
    dashboard: ["Dashboard", "Cases, counts, and quick actions"],
    research: ["Legal Research Hub (Massachusetts)", "Verified sources only · CourtListener · LII · GovInfo · RECAP"],
    memos: ["Research Memos", "IRAC memos linked to cases"],
    motions: ["Motion Development Engine", "Suppression, sentencing, and related drafts"],
    facts: ["Facts & Evidence", "Building blocks for research and motions"]
  };

  function render() {
    const [title, sub] = titles[state.route] || titles.dashboard;
    document.getElementById("pageTitle").textContent = title;
    document.getElementById("pageSub").textContent = sub;
    document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("on", b.dataset.route === state.route));
    const view = document.getElementById("view");
    if (state.route === "dashboard") view.innerHTML = viewDashboard();
    if (state.route === "research") view.innerHTML = viewResearch();
    if (state.route === "memos") view.innerHTML = viewMemos();
    if (state.route === "motions") view.innerHTML = viewMotions();
    if (state.route === "facts") view.innerHTML = viewFacts();
    bindView();
  }

  function viewDashboard() {
    const ac = activeCase();
    const factsN = state.facts.filter((f) => !ac || f.caseId === ac.id).length;
    const evidN = state.evidence.filter((e) => !ac || e.caseId === ac.id).length;
    const memoN = state.memos.filter((m) => !ac || m.caseId === ac.id).length;
    const motN = state.motions.filter((m) => !ac || m.caseId === ac.id).length;
    return `
      <div class="kpi">
        <div class="card"><strong>${state.cases.length}</strong><span>Cases</span></div>
        <div class="card"><strong>${memoN}</strong><span>Memos (active case)</span></div>
        <div class="card"><strong>${motN}</strong><span>Motions (active case)</span></div>
        <div class="card"><strong>${factsN + evidN}</strong><span>Facts + evidence</span></div>
      </div>
      <div class="grid-2">
        <div class="card">
          <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;">
            <h2>Cases</h2>
            <button class="btn primary" type="button" data-act="new-case">+ Case</button>
          </div>
          <div class="table-wrap"><table class="data"><thead><tr><th>Case</th><th>Docket</th><th>Status</th><th></th></tr></thead><tbody>
            ${state.cases.map((c) => `<tr>
              <td><strong>${esc(c.name)}</strong><div class="muted">${esc(c.court || "")} · ${esc(c.client || "")}</div></td>
              <td>${esc(c.docket || "—")}</td>
              <td><span class="chip ${c.status === "Active" ? "blue" : c.status === "Closed" ? "green" : "orange"}">${esc(c.status)}</span></td>
              <td style="white-space:nowrap">
                <button class="btn" type="button" data-act="select-case" data-id="${c.id}">${ac && ac.id === c.id ? "Active" : "Open"}</button>
                <button class="icon-btn" type="button" data-act="del-case" data-id="${c.id}" title="Delete">×</button>
              </td>
            </tr>`).join("") || `<tr><td colspan="4" class="empty">No cases yet</td></tr>`}
          </tbody></table></div>
        </div>
        <div class="card">
          <h2>Active matter</h2>
          ${ac ? `<p style="margin-top:8px"><strong>${esc(ac.name)}</strong></p>
            <p class="muted">${esc(ac.docket || "No docket")} · ${esc(ac.court || "No court")}</p>
            <div class="row" style="margin-top:14px">
              <button class="btn" type="button" data-route="research">Research</button>
              <button class="btn" type="button" data-route="memos">New memo</button>
              <button class="btn primary" type="button" data-route="motions">Draft motion</button>
            </div>` : `<p class="empty">Create or select a case</p>`}
          <h3>Workflow</h3>
          <ol class="muted" style="margin-left:18px;line-height:1.7">
            <li>Create / select case</li>
            <li>Log facts &amp; evidence</li>
            <li>Run legal research prompts</li>
            <li>Save IRAC research memo</li>
            <li>Draft motion from template</li>
          </ol>
        </div>
      </div>`;
  }

  function viewResearch() {
    const q = state._researchQ || "";
    const cites = state._cites || "";
    return `
      <div class="grid-2">
        <div class="card">
          <h2>1 · Legal question box</h2>
          <p class="muted">Type the question, copy the verified-sources prompt, paste into your AI tool with the question.</p>
          <label class="label">Enter your legal question</label>
          <textarea id="researchQ" placeholder="e.g., Does an uncorroborated operation observation survive a motion for required finding when a percipient witness places the vehicle parked?">${esc(q)}</textarea>
          <div class="row">
            <button class="btn primary" type="button" data-act="copy-research-prompt">Copy research prompt + question</button>
            <button class="btn" type="button" data-act="save-memo-from-q">Save as memo stub</button>
          </div>
          <h3>Generate Answer prompt (verified sources only)</h3>
          <div class="prompt-box" id="researchPromptBox">${esc(RESEARCH_PROMPT)}</div>
          <div class="row"><button class="btn" type="button" data-act="copy-text" data-target="researchPromptBox">Copy prompt only</button></div>

          <h3>4 · Citation checker</h3>
          <textarea id="citeBox" placeholder="Paste citations to verify...">${esc(cites)}</textarea>
          <div class="row">
            <button class="btn primary" type="button" data-act="copy-cite-prompt">Copy citation-checker prompt</button>
          </div>
        </div>
        <div class="card sources">
          <h2>2 · Research sources panel</h2>
          <details open><summary>Massachusetts case law</summary>
            <ul>
              <li><a href="https://www.mass.gov/orgs/supreme-judicial-court" target="_blank" rel="noopener">SJC</a></li>
              <li><a href="https://www.mass.gov/orgs/appeals-court" target="_blank" rel="noopener">Appeals Court</a></li>
              <li><a href="https://www.courtlistener.com/?type=o&court=mass" target="_blank" rel="noopener">CourtListener MA opinions</a></li>
            </ul>
          </details>
          <details open><summary>Massachusetts statutes</summary>
            <ul><li><a href="https://www.law.cornell.edu/massachusetts" target="_blank" rel="noopener">MGL (Cornell LII)</a></li></ul>
          </details>
          <details><summary>Federal case law</summary>
            <ul>
              <li><a href="https://www.courtlistener.com/?type=o&court=mad" target="_blank" rel="noopener">D. Mass (CourtListener)</a></li>
              <li><a href="https://www.courtlistener.com/?type=o&court=ca1" target="_blank" rel="noopener">1st Circuit (CourtListener)</a></li>
            </ul>
          </details>
          <details><summary>Federal regulations</summary>
            <ul>
              <li><a href="https://www.ecfr.gov/" target="_blank" rel="noopener">eCFR</a></li>
              <li><a href="https://www.federalregister.gov/" target="_blank" rel="noopener">Federal Register</a></li>
            </ul>
          </details>
          <details><summary>Federal dockets</summary>
            <ul><li><a href="https://www.courtlistener.com/recap/" target="_blank" rel="noopener">RECAP</a></li></ul>
          </details>

          <h3>API workflows</h3>

  function bindView() {
    document.querySelectorAll("[data-route]").forEach((el) => {
      if (el.classList.contains("nav-btn")) return;
      el.addEventListener("click", () => setRoute(el.getAttribute("data-route")));
    });

    const q = document.getElementById("researchQ");
    if (q) q.addEventListener("input", () => { state._researchQ = q.value; });
    const c = document.getElementById("citeBox");
    if (c) c.addEventListener("input", () => { state._cites = c.value; });

    document.querySelectorAll("[data-act]").forEach((btn) => {
      btn.addEventListener("click", () => onAct(btn.dataset.act, btn.dataset));
    });
  }

  function onAct(act, data) {
    const ac = activeCase();
    if (act === "new-case") return modalCase();
    if (act === "select-case") { state.activeCaseId = data.id; save(); render(); toast("Case selected"); return; }
    if (act === "del-case") {
      if (!confirm("Delete case and keep orphan facts/memos/motions?")) return;
      state.cases = state.cases.filter((c) => c.id !== data.id);
      if (state.activeCaseId === data.id) state.activeCaseId = state.cases[0] && state.cases[0].id;
      save(); render(); return;
    }
    if (act === "copy-research-prompt") {
      const question = (document.getElementById("researchQ") || {}).value || "";
      return copyText(RESEARCH_PROMPT + "\n\nLegal question:\n" + question);
    }
    if (act === "copy-cite-prompt") {
      const cites = (document.getElementById("citeBox") || {}).value || "";
      return copyText(CITATION_PROMPT + cites);
    }
    if (act === "copy-text") {
      const el = document.getElementById(data.target);
      return copyText(el ? el.textContent : "");
    }
    if (act === "copy-tmpl") return copyText(data.tmpl === "sentence" ? SENTENCE_TMPL : SUPPRESS_TMPL);
    if (act === "save-memo-from-q") {
      if (!ac) return toast("Select a case first");
      const question = (document.getElementById("researchQ") || {}).value || "Untitled question";
      const memo = {
        id: uid("m"), caseId: ac.id, topic: question.slice(0, 80),
        statutes: "", casesUsed: "", summary: "", citations: "",
        body: MEMO_TMPL.replace("What legal question are we answering?", question),
        status: "Draft", updatedAt: today(), createdAt: today()
      };
      state.memos.unshift(memo); save(); setRoute("memos"); toast("Memo stub saved"); return;
    }
    if (act === "new-memo") return modalMemo();
    if (act === "edit-memo") return modalMemo(state.memos.find((m) => m.id === data.id));
    if (act === "del-memo") {
      state.memos = state.memos.filter((m) => m.id !== data.id); save(); render(); return;
    }
    if (act === "new-motion") return modalMotion(null, data.type || "Other");
    if (act === "edit-motion") return modalMotion(state.motions.find((m) => m.id === data.id));
    if (act === "del-motion") {
      state.motions = state.motions.filter((m) => m.id !== data.id); save(); render(); return;
    }
    if (act === "new-fact") return modalFact();
    if (act === "edit-fact") return modalFact(state.facts.find((f) => f.id === data.id));
    if (act === "del-fact") { state.facts = state.facts.filter((f) => f.id !== data.id); save(); render(); return; }
    if (act === "new-evidence") return modalEvidence();
    if (act === "edit-evidence") return modalEvidence(state.evidence.find((e) => e.id === data.id));
    if (act === "del-evidence") { state.evidence = state.evidence.filter((e) => e.id !== data.id); save(); render(); return; }
  }

      <select id="fType">${["Document","Video","Photo","Lab","Digital","Other"].map((t) => `<option ${((item && item.type) || "Document") === t ? "selected" : ""}>${t}</option>`).join("")}</select>
      <label class="label">Case</label><select id="fCase">${caseOptions(item ? item.caseId : ac && ac.id)}</select>
      <div class="row" style="justify-content:flex-end;margin-top:16px">
        <button class="btn" type="button" id="mCancel">Cancel</button>
        <button class="btn primary" type="button" id="mSave">Save</button>
      </div>`);
    document.getElementById("mCancel").onclick = closeModal;
    document.getElementById("mSave").onclick = () => {
      const row = {
        id: item ? item.id : uid("e"),
        item: document.getElementById("fItem").value.trim() || "Untitled item",
        description: document.getElementById("fDesc").value,
        source: document.getElementById("fSource").value,
        custody: document.getElementById("fCust").value,
        type: document.getElementById("fType").value,
        caseId: document.getElementById("fCase").value
      };
      if (item) state.evidence = state.evidence.map((e) => e.id === item.id ? row : e);
      else state.evidence.unshift(row);
      save(); closeModal(); render(); toast("Evidence saved");
    };
  }

  // Global nav
  document.querySelectorAll(".nav-btn").forEach((b) => b.addEventListener("click", () => setRoute(b.dataset.route)));
  document.getElementById("btnNewCase").onclick = () => modalCase();
  document.getElementById("btnExport").onclick = () => {
    downloadText(JSON.stringify({ version: "1.0.0", exportedAt: today(), state }, null, 2), "ARC_Legal_Research_Motions_export.json");
    toast("JSON exported");
  };
  document.getElementById("btnImport").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result || "{}"));
        if (!data.state || !data.state.cases) throw new Error("Invalid file");
        state = data.state;
        save(); render(); toast("Import complete");
      } catch {
        toast("Import failed");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  document.getElementById("modalBack").addEventListener("click", (e) => { if (e.target.id === "modalBack") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  function applySharedLegalCase(context) {
    const sharedId = String(context.caseId || "").trim();
    const matter = String(context.matter || "").trim();
    const docket = String(context.docket || "").trim();
    if (!sharedId && !matter && !docket) return;
    let row = state.cases.find((item) => sharedId && item.sharedCaseId === sharedId);
    if (!row) row = state.cases.find((item) =>
      (docket && String(item.docket || "").toLowerCase() === docket.toLowerCase()) ||
      (matter && String(item.name || "").toLowerCase() === matter.toLowerCase())
    );
    if (!row) {
      row = { id: uid("c"), name: matter || "Untitled matter", docket: docket, court: "", client: "", status: "Active", createdAt: today() };
      state.cases.unshift(row);
    }
    row.sharedCaseId = sharedId || row.sharedCaseId || "";
    if (matter) row.name = matter;
    if (docket) row.docket = docket;
    if (context.court) row.court = context.court;
    if (context.clientName) row.client = context.clientName;
    if (context.status) row.status = context.status;
    row.subjectName = context.subjectName || row.subjectName || "";
    row.incidentDate = context.incidentDate || row.incidentDate || "";
    row.investigator = context.investigator || row.investigator || "";
    row.notes = context.notes || row.notes || "";
    state.activeCaseId = row.id;
    save();
    render();
  }


  /* ---------- Case briefing: what you should know ---------- */
  const BRIEF_KEY = "ARC_CASE_BRIEF_V1";

  function readCaseBrief() {
    try {
      return JSON.parse(localStorage.getItem(BRIEF_KEY) || "null");
    } catch (error) {
      return null;
    }
  }

  function briefFlags(text) {
    const sentences = String(text || "").replace(/\s+/g, " ").match(/[^.!?]+[.!?]/g) || [];
    const gapWord = /\b(no|not|without|missing|absent|blank|incomplete|unsupplied|unaccounted)\b/i;
    const recordWord = /\b(record|report|certificate|video|footage|audio|log|receipt|warrant|affidavit|inventory|docket|result|form|photograph|statement|disposition|recording|camera|testing|seal|transfer|return|supplement)\b/i;
    const conflictWord = /\b(inconsistent|conflict|discrepan|do not form|before the reported|after the arrest|differs|contradict)\b/i;
    const gaps = [];
    const conflicts = [];

    sentences.forEach((line) => {
      const sentence = line.trim();
      if (sentence.length < 25 || sentence.length > 320) return;
      if (conflictWord.test(sentence) && conflicts.length < 8) {
        conflicts.push(sentence);
      } else if (gapWord.test(sentence) && recordWord.test(sentence) && gaps.length < 10) {
        gaps.push(sentence);
      }
    });

    return { gaps, conflicts };
  }

  function briefingHost() {
    let host = document.getElementById("arcCaseBriefing");
    if (host) return host;

    const view = document.getElementById("view");
    if (!view || !view.parentNode) return null;

    host = document.createElement("div");
    host.id = "arcCaseBriefing";
    host.className = "card";
    host.style.margin = "0 0 16px";
    view.parentNode.insertBefore(host, view);
    return host;
  }

  function renderCaseBriefing() {
    const host = briefingHost();
    if (!host) return;

    const brief = readCaseBrief();
    const shared = (window.ARCUnified && window.ARCUnified.getCase()) || {};
    const matter = (brief && brief.matter) || shared.matter || "";

    if (!brief || !brief.reportText) {
      host.innerHTML =
        "<h2>What you should know about this case</h2>" +
        "<p class=\"muted\">No shared case brief was found yet. Open ARC Notebook, upload the case records, and generate a report. The briefing appears here automatically.</p>";
      return;
    }

    const flags = briefFlags(brief.reportText);
    let html = "<h2>What you should know about this case</h2>";
    html +=
      "<p class=\"muted\">" +
      esc(matter || brief.notebookName || "Shared matter") +
      (brief.docket ? " &middot; Docket " + esc(brief.docket) : "") +
      " &middot; " +
      (brief.docs || []).length +
      " source document" +
      ((brief.docs || []).length === 1 ? "" : "s") +
      " &middot; brief updated " +
      esc(String(brief.updatedAt || "").slice(0, 10)) +
      "</p>";

    if (flags.conflicts.length) {
      html +=
        "<h3>Timing and consistency issues in the record</h3><ul>" +
        flags.conflicts.map((text) => "<li>" + esc(text) + "</li>").join("") +
        "</ul>";
    }

    if (flags.gaps.length) {
      html +=
        "<h3>Records the report identifies as missing or incomplete</h3><ul>" +
        flags.gaps.map((text) => "<li>" + esc(text) + "</li>").join("") +
        "</ul>";
    }

    if (!flags.conflicts.length && !flags.gaps.length) {
      html +=
        "<p class=\"muted\">The shared report is available, but no automatic gap or conflict keywords were detected. Review the full report before forming a legal conclusion.</p>";
    }

    html +=
      "<div class=\"row\">" +
      "<button class=\"btn primary\" type=\"button\" id=\"arcBriefGen\">Generate legal briefing with AI</button>" +
      "<button class=\"btn\" type=\"button\" id=\"arcBriefSend\">Send briefing to Main Report</button>" +
      "<span class=\"muted\" id=\"arcBriefStatus\"></span></div>" +
      "<div id=\"arcBriefOut\" style=\"white-space:pre-wrap;margin-top:10px\"></div>";

    host.innerHTML = html;
    const out = document.getElementById("arcBriefOut");
    if (host.dataset.aiText) out.textContent = host.dataset.aiText;

    document.getElementById("arcBriefGen").addEventListener("click", () => {
      generateLegalBriefing(brief, matter);
    });

    document.getElementById("arcBriefSend").addEventListener("click", () => {
      const bodyText = host.dataset.aiText || flags.conflicts.concat(flags.gaps).join("\n");
      const status = document.getElementById("arcBriefStatus");
      if (!bodyText.trim()) {
        status.textContent = "Nothing to send yet.";
        return;
      }
      if (!window.ARCUnified) {
        status.textContent = "The shared report bridge is unavailable.";
        return;
      }
      window.ARCUnified.saveReport({
        title: "Legal briefing: " + (matter || "shared matter"),
        reportType: "Legal Briefing",
        source: "legal-research",
        text: bodyText,
        html: ""
      });
      status.textContent = "Sent to the Main Report inbox for investigator review.";
    });
  }

  function briefingGeminiKey() {
    try {
      if (window.ARC_SYSTEM_KEYS && window.ARC_SYSTEM_KEYS.read) {
        const keys = window.ARC_SYSTEM_KEYS.read();
        if (keys && keys.gemini) return keys.gemini;
      }
    } catch (error) {}

    try {
      return localStorage.getItem("ARC_GEMINI_KEY_V1") || "";
    } catch (error) {
      return "";
    }
  }

  function generateLegalBriefing(brief, matter) {
    const status = document.getElementById("arcBriefStatus");
    const out = document.getElementById("arcBriefOut");
    const key = briefingGeminiKey();

    if (!key) {
      status.textContent = "Add a Gemini key in the API Key Vault first.";
      return;
    }

    status.textContent = "Generating briefing...";
    const grounding = String(brief.reportText || "").slice(0, 80000);
    const prompt =
      "You are a Massachusetts criminal defense legal research assistant preparing an orientation briefing for defense counsel" +
      (matter ? " in the matter of " + matter : "") +
      ".\n\nGROUNDING: Base every factual statement strictly on the investigation report below. Do not invent facts, case names, dates, quotations, or citation details. " +
      "Clearly distinguish allegations, recorded facts, missing information, analytical issues, and legal propositions. " +
      "Any legal authority must be identified as requiring verification before filing.\n\n" +
      "Write these sections in plain professional language, each beginning with the exact heading shown:\n" +
      "## Charges and allegations in the record\n" +
      "## Elements the Commonwealth must prove\n" +
      "## Defense issues suggested by the record\n" +
      "## Discovery and records to demand\n" +
      "## Suppression and evidentiary questions\n" +
      "## Research questions for counsel\n\n" +
      "INVESTIGATION REPORT:\n" +
      grounding;

    const models = ["gemini-2.5-flash", "gemini-2.0-flash", "gemini-1.5-flash"];

    const callModel = (index) => {
      if (index >= models.length) {
        return Promise.reject(new Error("No compatible Gemini model responded."));
      }

      return fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/" +
          models[index] +
          ":generateContent?key=" +
          encodeURIComponent(key),
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.2, maxOutputTokens: 16384 }
          })
        }
      ).then((response) => {
        if (response.status === 404) return callModel(index + 1);
        return response.json().then((data) => {
          if (data && data.error) throw new Error(data.error.message || "Gemini error");
          let text = "";
          try {
            (data.candidates[0].content.parts || []).forEach((part) => {
              text += part.text || "";
            });
          } catch (error) {}
          if (!text.trim()) throw new Error("Gemini returned an empty response.");
          return text;
        });
      });
    };

    callModel(0)
      .then((text) => {
        const host = document.getElementById("arcCaseBriefing");
        if (!host || !out || !status) return;
        host.dataset.aiText = text.trim();
        out.textContent = text.trim();
        status.textContent = "Briefing generated. Verify every fact and citation before approval.";
      })
      .catch((error) => {
        if (status) status.textContent = error.message || String(error);
      });
  }

  document.addEventListener("arc:case-brief", renderCaseBriefing);
  window.addEventListener("storage", (event) => {
    if (event.key === BRIEF_KEY) renderCaseBriefing();
  });
  setTimeout(renderCaseBriefing, 0);

  document.addEventListener("arc:case-context", (event) => applySharedLegalCase(event.detail || {}));

  if (!state.activeCaseId && state.cases[0]) state.activeCaseId = state.cases[0].id;
  render();
})();
</script>
<script src="arc_unified_bridge.js"></script>
</body>
</html>
