<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARC Discovery Gap Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #16161a;
  --panel: #1f1f24;
  --panel2: #26262c;
  --line: #34343c;
  --ink: #e8e6e1;
  --ink-dim: #9a978f;
  --gold: #C9A84C;
  --gold-dim: rgba(201, 168, 76, 0.16);
  --missing: #c14b3f;
  --missing-bg: rgba(193, 75, 63, 0.14);
  --requested: #d98e2b;
  --requested-bg: rgba(217, 142, 43, 0.12);
  --partial: #C9A84C;
  --partial-bg: rgba(201, 168, 76, 0.12);
  --received: #5a9e6f;
  --received-bg: rgba(90, 158, 111, 0.12);
  --na: #6b6b74;
  --na-bg: rgba(107, 107, 116, 0.10);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}
header {
  border-bottom: 1px solid var(--line);
  padding: 18px 28px 14px;
  display: flex;
  align-items: baseline;
  gap: 16px;
  flex-wrap: wrap;
}
header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--gold);
  letter-spacing: 0.4px;
}
header .sub {
  color: var(--ink-dim);
  font-size: 12px;
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
header .spacer { flex: 1; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 28px 80px; }
.toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 18px;
}
select, input[type="text"], input[type="date"], textarea {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 6px;
  padding: 7px 10px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
}
select:focus, input:focus, textarea:focus, button:focus-visible {
  outline: 2px solid var(--gold);
  outline-offset: 1px;
}
button {
  background: var(--panel);
  border: 1px solid var(--line);
  color: var(--ink);
  border-radius: 6px;
  padding: 7px 14px;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
button:hover { border-color: var(--gold); }
button.primary {
  background: var(--gold);
  border-color: var(--gold);
  color: #16161a;
  font-weight: 600;
}
button.primary:hover { background: #d8b95e; }
button.danger:hover { border-color: var(--missing); color: var(--missing); }
button.small { padding: 4px 9px; font-size: 12px; }
.meta-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 22px;
}
.meta-grid label {
  display: block;
  font-size: 11px;
  color: var(--ink-dim);
  text-transform: uppercase;
  letter-spacing: 0.6px;
  font-family: 'DM Mono', monospace;
  margin-bottom: 4px;
}
.meta-grid input { width: 100%; }
.overview {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 10px;
  margin-bottom: 26px;
}
.ov-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
  cursor: pointer;
}
.ov-card:hover { border-color: var(--gold); }
.ov-card .name { font-weight: 600; font-size: 13px; margin-bottom: 6px; }
.ov-bar {
  height: 8px;
  border-radius: 4px;
  background: var(--panel2);
  overflow: hidden;
  display: flex;
  margin-bottom: 6px;
}
.ov-bar span { display: block; height: 100%; }
.ov-stats {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--ink-dim);
}
.ov-stats b.gap { color: var(--missing); font-weight: 500; }
.section {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  margin-bottom: 22px;
  overflow: hidden;
}
.section-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--line);
  flex-wrap: wrap;
}
.section-head h2 {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  font-weight: 600;
  color: var(--gold);
}
.section-head .count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--ink-dim);
}
.section-head .spacer { flex: 1; }
.item-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 10px;
  padding: 14px;
}
.item {
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 10px 12px;
  background: var(--panel2);
  position: relative;
}
.item.st-missing { border-color: var(--missing); background: var(--missing-bg); box-shadow: 0 0 0 1px var(--missing); }
.item.st-requested { border-color: var(--requested); background: var(--requested-bg); }
.item.st-partial { border-color: var(--partial); background: var(--partial-bg); }
.item.st-received { border-color: rgba(90,158,111,0.5); background: var(--received-bg); }
.item.st-na { opacity: 0.55; background: var(--na-bg); }
.item .cat {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--ink-dim);
  margin-bottom: 2px;
}
.item .label { font-size: 13px; font-weight: 500; margin-bottom: 8px; padding-right: 20px; }
.item .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.status-btn {
  border: none;
  border-radius: 5px;
  padding: 4px 10px;
  font-size: 11px;
  font-weight: 700;
  font-family: 'DM Mono', monospace;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  cursor: pointer;
}
.status-btn.st-missing { background: var(--missing); color: #fff; }
.status-btn.st-requested { background: var(--requested); color: #16161a; }
.status-btn.st-partial { background: var(--partial); color: #16161a; }
.status-btn.st-received { background: var(--received); color: #16161a; }
.status-btn.st-na { background: var(--na); color: #16161a; }
.item .detail-toggle {
  position: absolute;
  top: 8px;
  right: 8px;
  background: none;
  border: none;
  color: var(--ink-dim);
  font-size: 14px;
  padding: 2px 6px;
  cursor: pointer;
}
.item .detail-toggle:hover { color: var(--gold); }
.item .details { margin-top: 10px; display: grid; gap: 6px; }
.item .details input, .item .details textarea { width: 100%; font-size: 12px; }
.item .details textarea { resize: vertical; min-height: 44px; font-family: 'DM Sans', sans-serif; }
.item .bates-tag {
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  color: var(--ink-dim);
}
.legend {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 18px;
  font-size: 12px;
  color: var(--ink-dim);
  align-items: center;
}
.legend .chip {
  display: inline-block;
  width: 11px;
  height: 11px;
  border-radius: 3px;
  margin-right: 5px;
  vertical-align: -1px;
}
.gap-report {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 22px;
}
.gap-report h2 {
  font-family: 'Playfair Display', serif;
  color: var(--gold);
  font-size: 18px;
  margin-bottom: 10px;
}
.rpt {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 26px 30px;
  margin-top: 12px;
  max-height: 520px;
  overflow: auto;
}
.rpt-firm {
  font-family: 'Playfair Display', serif;
  font-size: 20px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 0.5px;
}
.rpt-firm-sub {
  font-family: 'DM Mono', monospace;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--ink-dim);
  margin-top: 2px;
}
.rpt-rule {
  border: none;
  border-top: 2px solid var(--gold);
  margin: 14px 0 18px;
}
.rpt-title {
  font-family: 'Playfair Display', serif;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.4px;
  margin-bottom: 4px;
}
.rpt-caption {
  font-size: 13px;
  color: var(--ink);
}
.rpt-prepared {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--ink-dim);
  margin-top: 4px;
  margin-bottom: 18px;
}
.rpt-sec {
  font-family: 'DM Mono', monospace;
  font-size: 11.5px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--gold);
  border-bottom: 1px solid var(--line);
  padding-bottom: 4px;
  margin: 18px 0 8px;
}
.rpt-item {
  display: flex;
  gap: 10px;
  padding: 5px 0;
  font-size: 13px;
}
.rpt-num {
  font-family: 'DM Mono', monospace;
  color: var(--ink-dim);
  min-width: 26px;
  text-align: right;
}
.rpt-item .st {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  border-radius: 4px;
  padding: 1px 7px;
  margin-left: 6px;
  vertical-align: 1px;
  display: inline-block;
}
.rpt-item .st-missing { background: var(--missing); color: #fff; }
.rpt-item .st-requested { background: var(--requested); color: #16161a; }
.rpt-item .st-partial { background: var(--partial); color: #16161a; }
.rpt-item .meta-line {
  display: block;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--ink-dim);
  margin-top: 2px;
}
.rpt.editing {
  outline: 2px dashed var(--gold);
  outline-offset: 3px;
}
.rpt.editing:focus { outline-style: solid; }
.rpt-total {
  margin-top: 18px;
  padding-top: 10px;
  border-top: 2px solid var(--gold);
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--ink);
}
.empty {
  text-align: center;
  color: var(--ink-dim);
  padding: 40px 20px;
  border: 1px dashed var(--line);
  border-radius: 12px;
  margin-bottom: 22px;
}
.toast {
  position: fixed;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--gold);
  color: #16161a;
  font-weight: 600;
  padding: 9px 18px;
  border-radius: 8px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s;
  z-index: 50;
}
.toast.show { opacity: 1; }
@media print {
  body { background: #fff; color: #000; }
  header, .toolbar, .meta-grid, .overview, .legend, .section, .toast, .no-print, .gap-report > h2 { display: none !important; }
  .wrap { padding: 0; max-width: none; }
  .gap-report { border: none; padding: 0; background: #fff; }
  .rpt { background: #fff; border: none; max-height: none; overflow: visible; padding: 0.4in 0.2in; }
  .rpt-firm { color: #8a7332; }
  .rpt-firm-sub, .rpt-prepared, .rpt-num, .rpt-item .meta-line { color: #555; }
  .rpt-caption, .rpt-title, .rpt-item, .rpt-total { color: #000; }
  .rpt-rule, .rpt-total { border-color: #8a7332; }
  .rpt-sec { color: #8a7332; border-color: #ccc; }
  .rpt-item .st-missing { background: #fff; color: #a03328; border: 1px solid #a03328; }
  .rpt-item .st-requested { background: #fff; color: #9c6413; border: 1px solid #9c6413; }
  .rpt-item .st-partial { background: #fff; color: #8a7332; border: 1px solid #8a7332; }
  .rpt-sec { page-break-after: avoid; }
  .rpt-item { page-break-inside: avoid; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header>
  <h1>ARC Discovery Gap Map</h1>
  <span class="sub">Expected vs. Produced, by Evidence Type</span>
  <span class="spacer"></span>
  <span class="sub" id="savedStamp"></span>
</header>

<div class="wrap">
  <div class="toolbar">
    <select id="caseSelect" aria-label="Select case"></select>
    <button id="btnNewCase">New Case</button>
    <button id="btnDeleteCase" class="danger">Delete Case</button>
    <span style="flex:1"></span>
    <select id="templateSelect" aria-label="Add evidence type"></select>
    <button id="btnAddType" class="primary">Add Evidence Type</button>
    <button id="btnExport">Export JSON</button>
    <button id="btnImport">Import JSON</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>

  <div class="meta-grid" id="metaGrid">
    <div><label for="mCaption">Case Caption</label><input type="text" id="mCaption" data-meta="caption" placeholder="Commonwealth v. ..."></div>
    <div><label for="mDocket">Docket No.</label><input type="text" id="mDocket" data-meta="docket" placeholder="e.g. 2584CR00681"></div>
    <div><label for="mCourt">Court</label><input type="text" id="mCourt" data-meta="court" placeholder="e.g. Suffolk Superior"></div>
    <div><label for="mAttorney">Attorney</label><input type="text" id="mAttorney" data-meta="attorney" placeholder="Defense counsel"></div>
    <div style="grid-column: 1 / -1;"><label for="mRe">Re: / Matter Description</label><input type="text" id="mRe" data-meta="re" placeholder="e.g. Breath test administered on Draeger Alcotest 9510, Serial No. ..., Sequential Test No. ..."></div>
  </div>

  <div class="legend">
    <span><span class="chip" style="background:var(--missing)"></span>Missing</span>
    <span><span class="chip" style="background:var(--requested)"></span>Requested</span>
    <span><span class="chip" style="background:var(--partial)"></span>Partial</span>
    <span><span class="chip" style="background:var(--received)"></span>Received</span>
    <span><span class="chip" style="background:var(--na)"></span>N/A</span>
    <span style="opacity:0.8">Click a status pill to cycle. Missing items stay loud on purpose.</span>
  </div>

  <div class="overview" id="overview"></div>
  <div id="sections"></div>

  <div class="gap-report" id="gapReport">
    <h2>Outstanding Discovery (Gap Report)</h2>
    <div class="row no-print" style="display:flex; gap:10px; flex-wrap:wrap;">
      <button id="btnCopyReport" class="primary">Copy as Motion Exhibit Text</button>
      <button id="btnEditReport">Edit Report</button>
      <button id="btnRebuildReport">Rebuild from Data</button>
      <button id="btnSaveHtml">Save as HTML</button>
      <button id="btnPrint">Print Gap Report</button>
    </div>
    <div class="rpt" id="reportView"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

        { cat: 'Data', label: 'Software version and validation for probabilistic genotyping' },
        { cat: 'Process', label: 'Extraction, quantification, and amplification worksheets' },
        { cat: 'Process', label: 'Contamination logs and elimination database checks' },
        { cat: 'Personnel', label: 'Analyst CV, training file, and proficiency tests' },
        { cat: 'Lab', label: 'Lab SOPs and accreditation for the testing period' },
        { cat: 'Process', label: 'Chain of custody for all tested samples' }
      ]
    },
    informant: {
      name: 'Confidential Informant',
      items: [
        { cat: 'File', label: 'Informant file or privilege log describing withheld material' },
        { cat: 'Reliability', label: 'Track record: prior tips and outcomes' },
        { cat: 'Compensation', label: 'Payments, benefits, and consideration provided' },
        { cat: 'Compensation', label: 'Pending charges or cooperation agreements' },
        { cat: 'Process', label: 'Handler notes and contact reports for this investigation' },
        { cat: 'Process', label: 'Any recorded communications involving the informant' }
      ]
    },
    custom: {
      name: 'Custom Evidence Type',
      items: []
    }
  };

  var state = loadState();

  function uid() {
    return 'id' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function loadState() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { raw = null; }
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.cases) { return parsed; }
      } catch (e) { /* fall through to fresh state */ }
    }
    var fresh = { cases: {}, activeCaseId: null };
    var c = makeCase('New Case');
    fresh.cases[c.id] = c;
    fresh.activeCaseId = c.id;
    return fresh;
  }

  function makeCase(caption) {
    return {
      id: uid(),
      meta: { caption: caption || '', docket: '', court: '', attorney: '', re: '' },
      types: [],
      reportFrozen: false,
      reportHtml: null,
      updated: Date.now()
    };
  }

  function saveState() {
    var c = activeCase();
    if (c) { c.updated = Date.now(); }
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(state));
      var el = document.getElementById('savedStamp');
      el.textContent = 'Saved ' + new Date().toLocaleTimeString();
    } catch (e) {
      toast('Save failed: storage unavailable');
    }
  }

  function activeCase() {
    return state.cases[state.activeCaseId] || null;
  }

  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toast._h);
    toast._h = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  /* ---------- rendering ---------- */

  function renderCaseSelect() {
    var sel = document.getElementById('caseSelect');
    sel.innerHTML = '';
    Object.keys(state.cases).forEach(function (id) {
      var opt = document.createElement('option');
      opt.value = id;
      var cap = state.cases[id].meta.caption || 'Untitled Case';
      opt.textContent = cap;
      if (id === state.activeCaseId) { opt.selected = true; }
      sel.appendChild(opt);
    });
  }

  function renderTemplateSelect() {
    var sel = document.getElementById('templateSelect');
    sel.innerHTML = '';
    Object.keys(TEMPLATES).forEach(function (key) {
      var opt = document.createElement('option');
      opt.value = key;
      opt.textContent = TEMPLATES[key].name;
      sel.appendChild(opt);
    });
  }

  function renderMeta() {
    var c = activeCase();
    if (!c) { return; }
    var inputs = document.querySelectorAll('#metaGrid input[data-meta]');
    inputs.forEach(function (inp) {
      inp.value = c.meta[inp.getAttribute('data-meta')] || '';
    });
  }

  function typeStats(t) {
    var s = { missing: 0, requested: 0, partial: 0, received: 0, na: 0, total: 0 };
    t.items.forEach(function (it) {
      s[it.status] = (s[it.status] || 0) + 1;
      if (it.status !== 'na') { s.total += 1; }
    });
    return s;
  }

  function renderOverview() {
    var c = activeCase();
    var ov = document.getElementById('overview');
    ov.innerHTML = '';
    if (!c || c.types.length === 0) { return; }
    c.types.forEach(function (t) {
      var s = typeStats(t);
      var card = document.createElement('div');
      card.className = 'ov-card';
      card.setAttribute('role', 'button');
      card.tabIndex = 0;
      var gaps = s.missing + s.partial + s.requested;
      var barHtml = '';
      var order = [
        ['received', 'var(--received)'],
        ['partial', 'var(--partial)'],
        ['requested', 'var(--requested)'],
        ['missing', 'var(--missing)']
      ];
      order.forEach(function (pair) {
        var n = s[pair[0]];
        if (n > 0 && s.total > 0) {
          var pct = (n / s.total * 100).toFixed(1);
          barHtml += '<span style="width:' + pct + '%;background:' + pair[1] + '"></span>';
        }
      });
      card.innerHTML =
        '<div class="name">' + esc(t.name) + '</div>' +
        '<div class="ov-bar">' + barHtml + '</div>' +
        '<div class="ov-stats">' + s.received + '/' + s.total + ' received' +
        (gaps > 0 ? ' &middot; <b class="gap">' + gaps + ' open</b>' : ' &middot; complete') +
        '</div>';
      function jump() {
        var el = document.getElementById('sec-' + t.id);
        if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      }
      card.addEventListener('click', jump);
      card.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); jump(); }
      });
      ov.appendChild(card);
    });
  }

  function renderSections() {
    var c = activeCase();
    var host = document.getElementById('sections');
    host.innerHTML = '';
    if (!c || c.types.length === 0) {
      var em = document.createElement('div');
      em.className = 'empty';
      em.textContent = 'No evidence types yet. Pick one from the menu above and add it to start mapping expected discovery against what was produced.';
      host.appendChild(em);
      return;
    }
    c.types.forEach(function (t) {
      host.appendChild(buildSection(t));
    });
  }

  function buildSection(t) {
    var s = typeStats(t);
    var sec = document.createElement('div');
    sec.className = 'section';
    sec.id = 'sec-' + t.id;

    var head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML =
      '<h2>' + esc(t.name) + '</h2>' +
      '<span class="count">' + s.received + ' received / ' + (s.missing + s.requested + s.partial) + ' open / ' + s.na + ' n-a</span>' +
      '<span class="spacer"></span>';

    var addBtn = document.createElement('button');
    addBtn.className = 'small';
    addBtn.textContent = '+ Item';
    addBtn.addEventListener('click', function () {
      var label = prompt('Expected item description:');
      if (!label) { return; }
      t.items.push(newItem('Custom', label));
      saveState();
      renderAll();
    });
    head.appendChild(addBtn);

    var renameBtn = document.createElement('button');
    renameBtn.className = 'small';
    renameBtn.textContent = 'Rename';
    renameBtn.addEventListener('click', function () {
      var name = prompt('Evidence type name:', t.name);
      if (!name) { return; }
      t.name = name;
      saveState();
      renderAll();
    });
    head.appendChild(renameBtn);

    var delBtn = document.createElement('button');
    delBtn.className = 'small danger';
    delBtn.textContent = 'Remove';
    delBtn.addEventListener('click', function () {
      if (!confirm('Remove "' + t.name + '" and all its item statuses from this case?')) { return; }
      var c = activeCase();
      c.types = c.types.filter(function (x) { return x.id !== t.id; });
      saveState();
      renderAll();
    });
    head.appendChild(delBtn);

    sec.appendChild(head);

    var grid = document.createElement('div');
    grid.className = 'item-grid';
    t.items.forEach(function (it) {
      grid.appendChild(buildItemCard(t, it));
    });
    sec.appendChild(grid);
    return sec;
  }

  function buildItemCard(t, it) {
    var card = document.createElement('div');
    card.className = 'item st-' + it.status;

    var catHtml = it.cat ? '<div class="cat">' + esc(it.cat) + '</div>' : '';
    var bates = it.bates ? '<span class="bates-tag">' + esc(it.bates) + '</span>' : '';
    card.innerHTML = catHtml + '<div class="label">' + esc(it.label) + '</div>';

    var row = document.createElement('div');
    row.className = 'row';

    var stBtn = document.createElement('button');
    stBtn.className = 'status-btn st-' + it.status;
    stBtn.textContent = STATUS_LABEL[it.status];
    stBtn.title = 'Click to cycle status';
    stBtn.addEventListener('click', function () {
      var idx = STATUSES.indexOf(it.status);
      it.status = STATUSES[(idx + 1) % STATUSES.length];
      saveState();
      renderAll();
    });
    row.appendChild(stBtn);

    if (bates) {
      var span = document.createElement('span');
      span.innerHTML = bates;
      row.appendChild(span);
    }
    card.appendChild(row);

    var toggle = document.createElement('button');
    toggle.className = 'detail-toggle';
    toggle.setAttribute('aria-label', 'Item details');
    toggle.textContent = it.open ? '\u25B4' : '\u25BE';
    toggle.addEventListener('click', function () {
      it.open = !it.open;
      renderAll();
    });
    card.appendChild(toggle);

    if (it.open) {
      var det = document.createElement('div');
      det.className = 'details';

      det.appendChild(detailInput('Bates / production ref', it.bates, function (v) { it.bates = v; }));
      det.appendChild(detailDate('Date requested', it.dateRequested, function (v) { it.dateRequested = v; }));
      det.appendChild(detailDate('Date received', it.dateReceived, function (v) { it.dateReceived = v; }));

      var ta = document.createElement('textarea');
      ta.placeholder = 'Notes (what came, what did not, follow-up)';
      ta.value = it.notes || '';
      ta.addEventListener('change', function () {
        it.notes = ta.value;
        saveState();
        renderReport();
      });
      det.appendChild(ta);

      var rm = document.createElement('button');
      rm.className = 'small danger';
      rm.textContent = 'Delete item';
      rm.addEventListener('click', function () {
        if (!confirm('Delete this expected item?')) { return; }
        t.items = t.items.filter(function (x) { return x.id !== it.id; });
        saveState();
        renderAll();
      });
      det.appendChild(rm);

      card.appendChild(det);
    }
    return card;
  }

  function detailInput(placeholder, value, onChange) {
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = placeholder;
    inp.value = value || '';
    inp.addEventListener('change', function () {
      onChange(inp.value);
      saveState();
      renderAll();
    });
    return inp;
  }

  function detailDate(labelText, value, onChange) {
    var wrap = document.createElement('div');
    var lab = document.createElement('label');
    lab.style.cssText = 'font-size:10px;color:var(--ink-dim);font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:0.5px;display:block;';
    lab.textContent = labelText;
    var inp = document.createElement('input');
    inp.type = 'date';
    inp.style.width = '100%';
    inp.value = value || '';
    inp.addEventListener('change', function () {
      onChange(inp.value);
      saveState();
      renderReport();
    });
    wrap.appendChild(lab);
    wrap.appendChild(inp);
    return wrap;
  }

  function newItem(cat, label) {
    return {
      id: uid(),
      cat: cat || '',
      label: label,
      status: 'missing',
      bates: '',
      dateRequested: '',
      dateReceived: '',
      notes: '',
      open: false
    };
  }

  /* ---------- gap report ---------- */

  var reportPlain = '';

  function openItemMeta(it) {
    var tail = [];
    if (it.dateRequested) { tail.push('requested ' + it.dateRequested); }
    if (it.status === 'partial' && it.bates) { tail.push('partial production at ' + it.bates); }
    if (it.notes) { tail.push(it.notes); }
    return tail;
  }

  function renderReport() {
    var c = activeCase();
    var view = document.getElementById('reportView');
    if (!c) { view.innerHTML = ''; reportPlain = ''; return; }

    if (c.reportFrozen && c.reportHtml) {
      view.innerHTML = c.reportHtml;
      view.contentEditable = 'true';
      view.classList.add('editing');
      view.setAttribute('aria-label', 'Editable report, changes save automatically');
      buildPlain(c);
      return;
    }
    view.contentEditable = 'false';
    view.classList.remove('editing');
    view.innerHTML = '';
    reportPlain = '';

    var cap = c.meta.caption || 'Untitled Case';
    var captionLine = cap + (c.meta.docket ? ', No. ' + c.meta.docket : '');
    var preparedLine = 'Prepared ' + new Date().toLocaleDateString() + ' by ARC Investigations and Consulting';

    var html = '';
    html += '<div class="rpt-firm">ARC Investigations and Consulting</div>';
    html += '<div class="rpt-firm-sub">Criminal Defense Investigation &middot; Litigation Support</div>';
    html += '<hr class="rpt-rule">';
    html += '<div class="rpt-title">Outstanding Discovery</div>';
    html += '<div class="rpt-caption">' + esc(captionLine) + (c.meta.court ? '<br>' + esc(c.meta.court) : '') + '</div>';
    html += '<div class="rpt-prepared">' + esc(preparedLine) + '</div>';
    if (c.meta.re) {
      html += '<div class="rpt-caption" style="font-style:italic;margin-bottom:14px;">Re: ' + esc(c.meta.re) + '</div>';
    }

    var n = 0;
    c.types.forEach(function (t) {
      var open = t.items.filter(function (it) {
        return it.status === 'missing' || it.status === 'requested' || it.status === 'partial';
      });
      if (open.length === 0) { return; }
      html += '<div class="rpt-sec">' + esc(t.name) + '</div>';
      open.forEach(function (it) {
        n += 1;
        var tail = openItemMeta(it);
        html += '<div class="rpt-item"><span class="rpt-num">' + n + '.</span><span>' +
          esc(it.label) +
          '<span class="st st-' + it.status + '">' + STATUS_LABEL[it.status] + '</span>' +
          (tail.length ? '<span class="meta-line">' + esc(tail.join('; ')) + '</span>' : '') +
          '</span></div>';
      });
    });

    if (n === 0) {
      html += '<div class="rpt-total">No open items. All expected discovery is marked received or not applicable.</div>';
    } else {
      html += '<div class="rpt-total">Total open items: ' + n + '</div>';
    }
    view.innerHTML = html;
    buildPlain(c);
  }

  function buildPlain(c) {
    var cap = c.meta.caption || 'Untitled Case';
    var lines = [];
    lines.push('OUTSTANDING DISCOVERY');
    lines.push(cap + (c.meta.docket ? ', No. ' + c.meta.docket : ''));
    if (c.meta.court) { lines.push(c.meta.court); }
    lines.push('Prepared ' + new Date().toLocaleDateString() + ' by ARC Investigations and Consulting');
    if (c.meta.re) { lines.push('Re: ' + c.meta.re); }
    lines.push('');
    var n = 0;
    c.types.forEach(function (t) {
      var open = t.items.filter(function (it) {
        return it.status === 'missing' || it.status === 'requested' || it.status === 'partial';
      });
      if (open.length === 0) { return; }
      lines.push(t.name.toUpperCase());
      open.forEach(function (it) {
        n += 1;
        var tail = openItemMeta(it);
        lines.push('  ' + n + '. ' + it.label + ' [' + [STATUS_LABEL[it.status].toUpperCase()].concat(tail).join('; ') + ']');
      });
      lines.push('');
    });
    if (n === 0) {
      lines.push('No open items. All expected discovery is marked received or not applicable.');
    } else {
      lines.push('Total open items: ' + n);
    }
    reportPlain = lines.join('\n');
  }

  function renderAll() {
    renderCaseSelect();
    renderMeta();
    renderOverview();
    renderSections();
    renderReport();
    if (typeof syncEditButton === 'function') { syncEditButton(); }
  }

  /* ---------- wiring ---------- */

  document.getElementById('caseSelect').addEventListener('change', function (e) {
    state.activeCaseId = e.target.value;
    saveState();
    renderAll();
  });

  document.getElementById('btnNewCase').addEventListener('click', function () {
    var cap = prompt('Case caption:', 'Commonwealth v. ');
    if (cap === null) { return; }
    var c = makeCase(cap);
    state.cases[c.id] = c;
    state.activeCaseId = c.id;
    saveState();
    renderAll();
  });

  document.getElementById('btnDeleteCase').addEventListener('click', function () {
    var c = activeCase();
    if (!c) { return; }
    if (!confirm('Delete case "' + (c.meta.caption || 'Untitled') + '" and all its gap data?')) { return; }
    delete state.cases[c.id];
    var ids = Object.keys(state.cases);
    if (ids.length === 0) {
      var nc = makeCase('New Case');
      state.cases[nc.id] = nc;
      state.activeCaseId = nc.id;
    } else {
      state.activeCaseId = ids[0];
    }
    saveState();
    renderAll();
  });

  document.getElementById('btnAddType').addEventListener('click', function () {
    var c = activeCase();
    if (!c) { return; }
    var key = document.getElementById('templateSelect').value;
    var tpl = TEMPLATES[key];
    if (!tpl) { return; }
    var name = tpl.name;
    if (key === 'custom') {
      var entered = prompt('Name this evidence type:', 'e.g. Cell Site / CSLI');
      if (!entered) { return; }
      name = entered;
    }
    var t = {
      id: uid(),
      templateKey: key,
      name: name,
      items: tpl.items.map(function (i) { return newItem(i.cat, i.label); })
    };
    c.types.push(t);
    saveState();
    renderAll();
    toast('Added ' + name);
  });

  document.querySelectorAll('#metaGrid input[data-meta]').forEach(function (inp) {
    inp.addEventListener('change', function () {
      var c = activeCase();
      if (!c) { return; }
      c.meta[inp.getAttribute('data-meta')] = inp.value;
      saveState();
      renderCaseSelect();
      renderReport();
    });
  });

  document.getElementById('btnCopyReport').addEventListener('click', function () {
    var text = reportPlain;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        toast('Copied to clipboard');
      }, function () {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  });

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try {
      document.execCommand('copy');
      toast('Copied to clipboard');
    } catch (e) {
      toast('Copy failed, select the text manually');
    }
    document.body.removeChild(ta);
  }

  document.getElementById('btnPrint').addEventListener('click', function () {
    window.print();
  });

  document.getElementById('btnEditReport').addEventListener('click', function () {
    var c = activeCase();
    if (!c) { return; }
    var view = document.getElementById('reportView');
    if (c.reportFrozen) {
      c.reportFrozen = false;
      c.reportHtml = view.innerHTML;
      saveState();
      renderReport();
      syncEditButton();
      toast('Editing off. Manual version kept until you rebuild.');
    } else {
      c.reportFrozen = true;
      c.reportHtml = c.reportHtml || view.innerHTML;
      saveState();
      renderReport();
      syncEditButton();
      toast('Report is editable. Click into the text to revise.');
    }
  });

  function syncEditButton() {
    var c = activeCase();
    var btn = document.getElementById('btnEditReport');
    var on = !!(c && c.reportFrozen);
    btn.textContent = on ? 'Done Editing' : 'Edit Report';
    btn.classList.toggle('primary', on);
    document.getElementById('btnCopyReport').classList.toggle('primary', !on);
  }

  document.getElementById('btnRebuildReport').addEventListener('click', function () {
    var c = activeCase();
    if (!c) { return; }
    if (c.reportHtml && !confirm('Discard manual report edits and rebuild from the current grid data?')) { return; }
    c.reportFrozen = false;
    c.reportHtml = null;
    saveState();
    renderReport();
    syncEditButton();
    toast('Report rebuilt from data');
  });

  var editSaveTimer = null;
  document.getElementById('reportView').addEventListener('input', function () {
    var c = activeCase();
    if (!c || !c.reportFrozen) { return; }
    clearTimeout(editSaveTimer);
    editSaveTimer = setTimeout(function () {
      c.reportHtml = document.getElementById('reportView').innerHTML;
      saveState();
    }, 500);
  });

  document.getElementById('btnSaveHtml').addEventListener('click', function () {
    var c = activeCase();
    if (!c) { return; }
    var view = document.getElementById('reportView');
    var body = c.reportFrozen && c.reportHtml ? c.reportHtml : view.innerHTML;
    var css = '' +
      'body{background:#f2f0eb;margin:0;padding:34px 12px;font-family:Georgia,serif;color:#111;}' +
      '.page{background:#fff;max-width:760px;margin:0 auto;padding:56px 64px;box-shadow:0 2px 14px rgba(0,0,0,0.15);}' +
      '.rpt-firm{font-family:Georgia,serif;font-size:26px;font-weight:700;color:#8A7332;letter-spacing:0.5px;}' +
      '.rpt-firm-sub{font-family:Courier New,monospace;font-size:10px;text-transform:uppercase;letter-spacing:1.4px;color:#555;margin-top:2px;}' +
      '.rpt-rule{border:none;border-top:2px solid #8A7332;margin:14px 0 20px;}' +
      '.rpt-title{font-size:20px;font-weight:700;margin-bottom:6px;}' +
      '.rpt-caption{font-family:Calibri,Arial,sans-serif;font-size:14px;}' +
      '.rpt-prepared{font-family:Courier New,monospace;font-size:11px;color:#555;margin:4px 0 18px;}' +
      '.rpt-sec{font-family:Courier New,monospace;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#8A7332;border-bottom:1px solid #ccc;padding-bottom:4px;margin:20px 0 10px;}' +
      '.rpt-item{display:flex;gap:10px;padding:5px 0;font-family:Calibri,Arial,sans-serif;font-size:14px;}' +
      '.rpt-num{font-family:Courier New,monospace;color:#555;min-width:28px;text-align:right;}' +
      '.rpt-item .st{font-family:Courier New,monospace;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;border-radius:4px;padding:0 6px;margin-left:6px;display:inline-block;border:1px solid;}' +
      '.rpt-item .st-missing{color:#a03328;border-color:#a03328;}' +
      '.rpt-item .st-requested{color:#9c6413;border-color:#9c6413;}' +
      '.rpt-item .st-partial{color:#8A7332;border-color:#8A7332;}' +
      '.rpt-item .meta-line{display:block;font-family:Courier New,monospace;font-size:11px;color:#555;margin-top:2px;}' +
      '.rpt-total{margin-top:20px;padding-top:10px;border-top:2px solid #8A7332;font-family:Courier New,monospace;font-size:13px;font-weight:700;}' +
      '@media print{body{background:#fff;padding:0;}.page{box-shadow:none;max-width:none;padding:0.4in;}}';
    var docHtml = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n' +
      '<title>Outstanding Discovery: ' + esc(c.meta.caption || 'Untitled Case') + '</title>\n' +
      '<style>' + css + '</style>\n</head>\n<body>\n<div class="page">' + body + '</div>\n</body>\n</html>';
    var blob = new Blob([docHtml], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var slug = (c.meta.caption || 'case').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    a.download = 'arc-gap-report-' + slug + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast('Report saved as standalone HTML');
  });

  document.getElementById('btnExport').addEventListener('click', function () {
    var c = activeCase();
    if (!c) { return; }
    var blob = new Blob([JSON.stringify(c, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var slug = (c.meta.caption || 'case').replace(/[^a-z0-9]+/gi, '-').toLowerCase();
    a.download = 'arc-gapmap-' + slug + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
    toast('Exported case JSON');
  });

  document.getElementById('btnImport').addEventListener('click', function () {
    document.getElementById('importFile').click();
  });

  document.getElementById('importFile').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) { return; }
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var c = JSON.parse(reader.result);
        if (!c || !c.meta || !Array.isArray(c.types)) {
          toast('Import failed: not a gap map file');
          return;
        }
        c.id = uid();
        state.cases[c.id] = c;
        state.activeCaseId = c.id;
        saveState();
        renderAll();
        toast('Imported case');
      } catch (err) {
        toast('Import failed: invalid JSON');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });

  renderTemplateSelect();
  renderAll();
})();
</script>
</body>
</html>
