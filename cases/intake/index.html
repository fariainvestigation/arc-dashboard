<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Intake | ARC</title>
<link rel="icon" href="../../assets/arc-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

<!--
  Case Intake lives under /cases/ because the case dashboard is where cases are
  created. It is a sibling route rather than a panel inside /cases/index.html
  for two reasons: the four supplied designs must stay visually unmodified, and
  the intake markup was written against the ARC workspace design system, which
  is a different visual language from the Tailwind used by the dashboard. Mixing
  them on one screen would mean restyling one or the other.

  The pipeline itself is arc_case_intake.js, extracted whole from the Report
  Generator rather than rewritten, so the five typed upload slots, the PDF and
  DOCX text extraction, the Gemini extraction chain, Core Records, Parties
  Verification, and the arc_case_intake_db blob store all behave exactly as they
  did before the move.
-->
<link rel="stylesheet" href="../../arc_workspace.css">
<link rel="stylesheet" href="../arc_case_intake.css">
<style>
  /* This page is a single stage, not the workspace shell, so it supplies its
     own frame instead of the sidebar layout arc_workspace.css expects. */
  body { margin: 0; background: var(--soft, #f7f5f0); }
  .intake-page-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 14px 28px;
    background: var(--navy-800, #0b162c);
    color: #fff;
    position: sticky;
    top: 0;
    z-index: 40;
  }
  .intake-page-bar img { height: 28px; width: auto; }
  .intake-page-brand { display: flex; align-items: center; gap: 12px; }
  .intake-page-brand strong {
    font: 600 12px "DM Mono", ui-monospace, monospace;
    letter-spacing: .18em;
    text-transform: uppercase;
  }
  .intake-page-identity {
    font: 11px "DM Mono", ui-monospace, monospace;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: #c9b36b;
  }
  #view { display: block; padding: 28px; max-width: 1440px; margin: 0 auto; }
  .intake-gate {
    max-width: 560px;
    margin: 96px auto;
    padding: 32px;
    background: #fff;
    border: 1px solid var(--line, #e3ded2);
    border-left: 3px solid var(--gold-500, #c9a84c);
    border-radius: 8px;
  }
  .intake-gate h2 { margin: 0 0 8px; font-family: "Playfair Display", Georgia, serif; }
  .intake-gate p { margin: 0 0 18px; color: var(--muted, #6b6558); }
</style>
</head>
<body>

<div class="intake-page-bar">
  <div class="intake-page-brand">
    <img src="../../assets/arc-logo.svg" alt="">
    <strong>ARC Case Intake</strong>
  </div>
  <div class="intake-page-identity" id="intakeIdentity">confirming identity</div>
</div>

<main id="view" aria-live="polite">
  <div class="intake-gate">
    <h2>Confirming your identity</h2>
    <p>Cloudflare Access is being checked before this page loads any case data.</p>
  </div>
</main>

<div class="toast-region" id="toastRegion" aria-live="polite"></div>

<script src="../../arc_backend.js"></script>

<script>
/*
  Host shim. arc_case_intake.js was written to run inside the Report Generator
  and calls a handful of that file's helpers. Rather than edit the extracted
  pipeline (which would fork it from the version the release check verifies),
  this page supplies the same helpers with the same signatures.
*/
(function (global) {
  "use strict";

  global.view = document.getElementById("view");

  global.escapeHtml = function (value) {
    return String(value == null ? "" : value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  };

  global.formatBytes = function (bytes) {
    const value = Number(bytes) || 0;
    if (value < 1024) return value + " B";
    if (value < 1024 * 1024) return (value / 1024).toFixed(1) + " KB";
    return (value / (1024 * 1024)).toFixed(1) + " MB";
  };

  global.uid = function (prefix) {
    const suffix = global.crypto && global.crypto.randomUUID
      ? global.crypto.randomUUID()
      : Date.now() + "_" + Math.random().toString(16).slice(2);
    return String(prefix || "id") + "_" + suffix;
  };

  const ICONS = {
    plus: "M12 5v14M5 12h14",
    spark: "M12 3l2.1 6.3L20 12l-5.9 2.7L12 21l-2.1-6.3L4 12l5.9-2.7z",
    upload: "M12 16V4M7 9l5-5 5 5M4 20h16",
    check: "M4 12l5 5L20 6",
    arrow: "M5 12h14M13 6l6 6-6 6",
    file: "M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8zM14 3v5h5",
    trash: "M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"
  };
  global.icon = function (name, className) {
    const path = ICONS[name] || ICONS.file;
    return '<svg class="' + (className || "") + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" '
      + 'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" '
      + 'style="width:1em;height:1em;vertical-align:-0.125em"><path d="' + path + '"/></svg>';
  };

  global.pageHeading = function (kicker, title, description, actions) {
    return '<div class="page-heading">'
      + '<div><span class="eyebrow">' + global.escapeHtml(kicker) + "</span>"
      + "<h1>" + global.escapeHtml(title) + "</h1>"
      + "<p>" + global.escapeHtml(description) + "</p></div>"
      + '<div class="button-row">' + (actions || "") + "</div></div>";
  };

  global.toast = function (title, message, type) {
    const region = document.getElementById("toastRegion");
    if (!region) return;
    const node = document.createElement("div");
    node.className = "toast " + (type || "info");
    const heading = document.createElement("strong");
    heading.textContent = String(title || "");
    node.appendChild(heading);
    if (message) {
      const body = document.createElement("span");
      body.textContent = String(message);
      node.appendChild(body);
    }
    region.appendChild(node);
    setTimeout(function () { node.remove(); }, 4300);
  };
})(window);
</script>

<script src="../../arc_unified_bridge.js"></script>
<script src="../../arc_case_document_bridge.js"></script>
<script src="../../arc_report_assets.js"></script>

<script>
/*
  Identity gate. Nothing renders and no case can be created until Cloudflare
  Access confirms who this is. Per §7 there is no fallback identity and no
  silent pass-through.
*/
(function () {
  "use strict";
  const B = window.ARCBackend;
  const view = document.getElementById("view");

  function gate(title, message) {
    view.innerHTML = "";
    const box = document.createElement("div");
    box.className = "intake-gate";
    const heading = document.createElement("h2");
    heading.textContent = title;
    const body = document.createElement("p");
    body.textContent = message;
    const back = document.createElement("a");
    back.className = "button ghost";
    back.href = "../index.html";
    back.textContent = "Back to case dashboard";
    box.appendChild(heading);
    box.appendChild(body);
    box.appendChild(back);
    view.appendChild(box);
  }

  B.whoami().then(function (user) {
    const identity = document.getElementById("intakeIdentity");
    if (!user) {
      if (identity) identity.textContent = "not signed in";
      gate("Identity not confirmed",
        "Cloudflare Access did not confirm an identity for this session. Reload this page to sign in.");
      return;
    }
    if (identity) identity.textContent = user.email || user.userId;

    // §11: a new case starts clean. Clear navigation state only, never records.
    if (B.entryMode() === "new") B.clearActiveCase();

    if (typeof window.intakeLoad === "function") window.intakeLoad();
    if (typeof window.renderIntake === "function") window.renderIntake();
    if (typeof window.intakeMountView === "function") window.intakeMountView();
  }).catch(function (error) {
    gate("ARC server unavailable", error && error.message ? error.message : "The ARC server could not be reached.");
  });

  /*
    §11 and §14: once intake publishes the case, the real case id follows the
    user into the workspace. The URL id is authoritative; sessionStorage is a
    convenience only.
  */
  let intakeNavigationStarted = false;
  document.addEventListener("arc:case-updated", function (event) {
    if (intakeNavigationStarted) return;
    const record = event.detail || {};
    const caseId = String(record.caseId || record.id || "");
    if (!B.isCaseId(caseId)) return;
    intakeNavigationStarted = true;
    B.setActiveCase(caseId, record.caseName || record.matter || "");
    window.location.href = "../../arc-notebook.html?case=" + encodeURIComponent(caseId)
      + "&mode=new&returnTo=" + encodeURIComponent("cases/index.html");
  });
})();
</script>

<script src="../arc_case_intake.js"></script>
</body>
</html>
