<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="arc_shared_keys.js"></script>
<script src="arc_report_header.js"></script>
<title>ARC Legal Research &amp; Motions · Massachusetts</title>
<style>
:root{
  --navy:#0b1726; --navy-soft:#16263b; --ink:#2C2C2B; --ink-mid:#5a5344; --ink-faint:#7D7A75;
  --canvas:#FFFFFF; --soft:#F9F8F7; --soft2:#F0EFED; --line:#E6E5E3;
  --blue:#2783DE; --blue-soft:#E5F2FC; --green:#46A171; --green-soft:#E8F1EC;
  --orange:#D5803B; --orange-soft:#FBEBDE; --red:#E56458; --red-soft:#FCE9E7;
  --gold:#b59461; --gold-soft:#f7f0e2;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --serif:Georgia,"Times New Roman",Times,serif;
  --radius:8px;
  --shadow:0 1px 2px rgba(0,0,0,.05), 0 4px 12px rgba(0,0,0,.04);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:var(--sans);background:var(--soft);color:var(--ink);font-size:15px;line-height:1.5;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
a{color:var(--blue);}
.hidden{display:none !important;}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh;}
.sidebar{background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:8px;}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;}
.brand-mark{width:40px;height:40px;border:1px solid var(--gold);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--gold);}
.brand-name{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.2;}
.brand-sub{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(226,201,139,.85);margin-top:3px;}
.nav-btn{text-align:left;background:transparent;border:0;border-radius:8px;color:rgba(255,255,255,.78);padding:11px 12px;display:flex;gap:10px;align-items:flex-start;}
.nav-btn:hover{background:rgba(255,255,255,.06);color:#fff;}
.nav-btn.on{background:rgba(181,148,97,.18);color:#fff;box-shadow:inset 3px 0 0 var(--gold);}
.nav-btn small{display:block;font-size:11px;opacity:.7;margin-top:2px;}
.nav-num{width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;margin-top:1px;}
.nav-btn.on .nav-num{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:700;}
.side-foot{margin-top:auto;padding:12px 8px 4px;font-size:11px;color:rgba(255,255,255,.45);line-height:1.45;}
.main{min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--canvas);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5;}
.topbar h1{font-size:18px;font-weight:650;}
.topbar p{font-size:12.5px;color:var(--ink-faint);}
.actions{display:flex;gap:8px;flex-wrap:wrap;}
.btn{border:1px solid var(--line);background:var(--canvas);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;}
.btn:hover{border-color:#c9c6c0;}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.primary:hover{background:var(--navy-soft);}
.btn.ghost{background:transparent;}
.btn.danger{color:var(--red);border-color:#f0c7c3;}
.content{padding:24px;max-width:1120px;width:100%;margin:0 auto;}
.grid-2{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:16px;}
.grid-2>*{min-width:0;}
.card{background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:var(--shadow);}
.card h2{font-size:15px;margin-bottom:6px;}
.card h3{font-size:13.5px;margin:14px 0 6px;}
.muted{color:var(--ink-faint);font-size:12.5px;}
.label{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);margin:10px 0 5px;}
input[type=text],input[type=search],select,textarea{
  width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;
}
textarea{min-height:110px;resize:vertical;line-height:1.45;}
.prompt-box{background:var(--soft);border:1px dashed #d5d2cc;border-radius:8px;padding:12px;font-size:12.5px;white-space:pre-wrap;line-height:1.45;font-family:Menlo,Consolas,monospace;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;background:var(--soft);}
.chip.blue{background:var(--blue-soft);border-color:#c7e0f8;color:#1a5fa0;}
.chip.green{background:var(--green-soft);border-color:#c5dfcf;color:#2d6b49;}
.chip.orange{background:var(--orange-soft);border-color:#efd2b3;color:#8a4f1b;}
.chip.red{background:var(--red-soft);border-color:#f0c7c3;color:#9b342d;}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px;}
table.data{width:100%;border-collapse:collapse;font-size:13px;background:#fff;}
table.data th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);background:var(--soft);padding:10px;border-bottom:1px solid var(--line);white-space:nowrap;}
table.data td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.data tr:last-child td{border-bottom:0;}
table.data tr:hover td{background:#fcfcfb;}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap;}
.tab{border:0;background:transparent;padding:10px 12px;color:var(--ink-faint);border-bottom:2px solid transparent;font-weight:600;font-size:13px;}
.tab.on{color:var(--navy);border-bottom-color:var(--gold);}
.sources details{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff;margin-bottom:8px;}
.sources summary{cursor:pointer;font-weight:650;}
.sources ul{margin:8px 0 0 18px;}
.sources li{margin:4px 0;}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.kpi .card{padding:14px;}
.kpi strong{display:block;font-size:22px;font-family:var(--serif);line-height:1.1;}
.kpi span{font-size:11px;color:var(--ink-faint);letter-spacing:.06em;text-transform:uppercase;}
.modal-back{position:fixed;inset:0;background:rgba(11,23,38,.5);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;}
.modal{background:#fff;border-radius:12px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:18px;box-shadow:var(--shadow);}
.modal h2{font-family:var(--serif);font-size:20px;margin-bottom:4px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#f3e7c8;padding:10px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center;}
.toast.show{opacity:1;}
.empty{text-align:center;padding:28px 12px;color:var(--ink-faint);}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;}
@media (max-width:900px){
  .app{grid-template-columns:1fr;}
  .sidebar{position:sticky;top:0;z-index:6;flex-direction:row;flex-wrap:wrap;gap:6px;padding:12px;}
  .brand{width:100%;border:0;margin:0;padding:0 0 8px;}
  .side-foot{display:none;}
  .nav-btn{flex:1 1 140px;}
  .grid-2,.kpi{grid-template-columns:minmax(0,1fr);}
  .content{padding:16px;}
}
@media print{
  .sidebar,.topbar,.actions,.toast,.modal-back{display:none !important;}
  .app{display:block;}
  .content{max-width:none;padding:0;}
  .card{box-shadow:none;}
}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
@media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>

<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">ARC</div>
      <div>
        <div class="brand-name">Legal Research &amp; Motions</div>
        <div class="brand-sub">Massachusetts · Attorney work product</div>
      </div>
    </div>
    <button class="nav-btn on" data-route="dashboard" type="button"><span class="nav-num">1</span><span>Dashboard<small>Cases overview</small></span></button>
    <button class="nav-btn" data-route="research" type="button"><span class="nav-num">2</span><span>Legal Research<small>Ask · search · motions · verified cites</small></span></button>
    <button class="nav-btn" data-route="memos" type="button"><span class="nav-num">3</span><span>Research Memos<small>IRAC generator</small></span></button>
    <button class="nav-btn" data-route="motions" type="button"><span class="nav-num">4</span><span>Motion Engine<small>Drafts + templates</small></span></button>
    <button class="nav-btn" data-route="facts" type="button"><span class="nav-num">5</span><span>Facts &amp; Evidence<small>Case building blocks</small></span></button>
    <button class="nav-btn" data-route="knowledge" type="button"><span class="nav-num">6</span><span>Knowledge Bank<small>Forms · guide sections · checklists</small></span></button>
    <div class="side-foot">Local-only data · verified sources prompts · CourtListener / LII / GovInfo / RECAP</div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">ARC Investigations &amp; Consulting</p>
      </div>
      <div class="actions">
        <button class="btn ghost" type="button" id="btnExport">Export JSON</button>
        <button class="btn ghost" type="button" id="btnImport">Import JSON</button>
        <button class="btn primary" type="button" id="btnNewCase">+ New case</button>
      </div>
    </header>
    <div class="content" id="view"></div>
  </div>
</div>

<div class="modal-back hidden" id="modalBack">
  <div class="modal" id="modal"></div>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" class="hidden">

<script>
"use strict";

/* Shared key vault provided by arc_shared_keys.js. */

 try{ if(window.ARC_SYSTEM_KEYS){ ARC_SYSTEM_KEYS.mergeIntoModule("report"); ARC_SYSTEM_KEYS.mergeIntoModule("motion"); } }catch(e){}

(function () {
  const STORE_KEY = "arc_legal_research_motions_v1";
  const uid = (p = "id") => p + "_" + Math.random().toString(36).slice(2, 9);
  const today = () => new Date().toISOString();
  const esc = (s) => String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");


  const CITATION_PROMPT = `Verify the following citations using CourtListener and Cornell LII.
Identify:
• Whether the case is still good law
• Whether it has been overruled, distinguished, or criticized
• Parallel citations
• Statute validity
Provide links to the original sources.

Citations to verify:
`;

  const MOTION_PROMPT = `Draft a [Motion Type] using ONLY verified sources:
• CourtListener (MA appellate + federal)
• Cornell LII (statutes)
• GovInfo (CFR + Federal Register)
• RECAP (federal dockets)
Pull facts from the linked Facts and Evidence databases.
Cite every authority.
Never hallucinate.
If no authority exists, say so.`;

  const SUPPRESS_TMPL = `INTRODUCTION
Brief summary of the issue.

FACTS
Pull from Facts DB:
• Fourth Amendment facts
• Timestamps
• Contradictions
• Chain-of-custody gaps

ARGUMENT
Cite:
• MA appellate cases (CourtListener)
• MGL statutes (Cornell LII)
• Federal cases (CourtListener)

CASE LAW
List holdings + citations.

CONCLUSION
Requested relief.`;

  const SENTENCE_TMPL = `BACKGROUND
Client history + mitigation.

OFFENSE DETAILS
Facts from Evidence DB.

LEGAL FRAMEWORK
Statutes (Cornell LII)
Case law (CourtListener)

MITIGATION FACTORS
List facts from Facts DB.

REQUESTED SENTENCE
Explain reasoning.`;

  const MEMO_TMPL = `ISSUE
What legal question are we answering?

RULE
List statutes + case law (MA + federal).

ANALYSIS
Explain how the rule applies to the facts.

CITATIONS
CourtListener citations + statute links.

CONCLUSION
Short, actionable answer.`;

  function geminiKey() {
    try {
      if (window.ARC_SYSTEM_KEYS && window.ARC_SYSTEM_KEYS.read) {
        const keys = window.ARC_SYSTEM_KEYS.read();
        if (keys && keys.gemini) return keys.gemini;
      }
    } catch (error) {}
    try {
      return localStorage.getItem("ARC_GEMINI_KEY_V1") || "";
    } catch (error) {
      return "";
    }
  }

  const GEMINI_MODELS = ["gemini-3.5-flash", "gemini-2.5-flash", "gemini-flash-latest"];

  function arcBumpAiUsage(prompt) {
    try {
      const u = JSON.parse(localStorage.getItem("arc_ai_usage_v1") || "null") || { queries: 0, chars: 0, byKind: { research: 0, drafting: 0, other: 0 } };
      u.queries += 1;
      u.chars += String(prompt || "").length;
      const p = String(prompt || "").slice(0, 400).toLowerCase();
      const kind = p.indexOf("search plan") >= 0 || p.indexOf("briefing") >= 0 || p.indexOf("retrieved authority") >= 0 ? "research"
        : p.indexOf("motion") >= 0 || p.indexOf("draft") >= 0 ? "drafting" : "other";
      u.byKind[kind] = (u.byKind[kind] || 0) + 1;
      localStorage.setItem("arc_ai_usage_v1", JSON.stringify(u));
    } catch (e) {}
  }

  function callGemini(prompt, maxTokens) {
    const key = geminiKey();
    if (!key) return Promise.reject(new Error("Add a Gemini key in the API Key Vault first."));
    arcBumpAiUsage(prompt);
    const callModel = (index) => {
      if (index >= GEMINI_MODELS.length) return Promise.reject(new Error("No compatible Gemini model responded."));
      return fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/" +
          GEMINI_MODELS[index] +
          ":generateContent?key=" +
          encodeURIComponent(key),
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.2, maxOutputTokens: maxTokens || 4096 }
          })
        }
      ).then((response) => {
        if (response.status === 404) return callModel(index + 1);
        return response.json().then((data) => {
          if (data && data.error) throw new Error(data.error.message || "Gemini error");
          let text = "";
          try {
            (data.candidates[0].content.parts || []).forEach((part) => { text += part.text || ""; });
          } catch (error) {}
          if (!text.trim()) throw new Error("Gemini returned an empty response.");
          return text;
        });
      });
    };
    return callModel(0);
  }

  function parseJSONLoose(text) {
    let t = String(text || "").trim();
    t = t.replace(/^```json/i, "").replace(/^```/, "").replace(/```\s*$/, "").trim();
    return JSON.parse(t);
  }

  /* ---------- CourtListener official REST API (v4). No third-party scraper. ---------- */
  function courtListenerKey() {
    try {
      if (window.arcGetCourtListenerToken) {
        const t = window.arcGetCourtListenerToken();
        if (t) return t;
      }
    } catch (error) {}
    try {
      if (window.ARC_SYSTEM_KEYS && window.ARC_SYSTEM_KEYS.read) {
        const keys = window.ARC_SYSTEM_KEYS.read();
        if (keys && keys.courtlistener) return keys.courtlistener;
      }
    } catch (error) {}
    try {
      return localStorage.getItem("ARC_COURTLISTENER_TOKEN_V1") || "";
    } catch (error) {
      return "";
    }
  }

  function courtListenerHeaders() {
    const key = courtListenerKey();
    const headers = { "Content-Type": "application/json" };
    if (key) headers.Authorization = "Token " + key;
    return headers;
  }

  const CL_TYPE = { o: "o", r: "r", p: "p" };

  function courtListenerSearch(mode, query, court, docketNumber) {
    const params = new URLSearchParams();
    if (query) params.set("q", query);
    params.set("type", CL_TYPE[mode] || "o");
    if (court) params.set("court", court);
    if (docketNumber) params.set("docketNumber", docketNumber);
    return fetch("https://www.courtlistener.com/api/rest/v4/search/?" + params.toString(), {
      headers: courtListenerHeaders()
    }).then((response) => response.json().then((data) => {
      if (!response.ok) throw new Error((data && (data.detail || data.error)) || ("CourtListener error " + response.status));
      return data.results || [];
    }));
  }

  function courtListenerVerifyCitations(text) {
    return fetch("https://www.courtlistener.com/api/rest/v4/citation-lookup/", {
      method: "POST",
      headers: courtListenerHeaders(),
      body: JSON.stringify({ text: text })
    }).then((response) => response.json().then((data) => {
      if (!response.ok) throw new Error((data && (data.detail || data.error)) || ("CourtListener error " + response.status));
      return Array.isArray(data) ? data : (data.citations || []);
    }));
  }

  function pick(obj, keys, fallback) {
    for (const k of keys) {
      if (obj && obj[k] !== undefined && obj[k] !== null && obj[k] !== "") return obj[k];
    }
    return fallback === undefined ? "" : fallback;
  }

  function clAbsUrl(u) {
    if (!u) return "";
    return u.indexOf("http") === 0 ? u : "https://www.courtlistener.com" + u;
  }


  /* ---------- AI guided research engine: plan, search, synthesize, verify ---------- */

  const CL_COURTS = [
    ["", "All courts"],
    ["mass", "Massachusetts SJC"],
    ["massctapp", "Massachusetts Appeals Court"],
    ["mad", "D. Massachusetts (federal)"],
    ["ca1", "First Circuit"],
    ["scotus", "U.S. Supreme Court"]
  ];

  /* Transient search results, deliberately NOT persisted to localStorage. */
  let aiLastResults = [];

  function researchPlanPrompt(question, ac, facts, evid) {
    return `You convert a plain English description from a Massachusetts criminal defense investigator with no legal training into a case law search plan. You do NOT answer the question, you do NOT name any case, and you do NOT produce any citation.

Identify the legal issues in play, then write CourtListener full text search queries that would surface controlling Massachusetts authority. Use the vocabulary appellate courts actually use, not the investigator's wording. Prefer 3 to 6 short queries over one long one. Include Article 14 or Article 12 framing wherever the Massachusetts constitutional analog is broader than the federal rule.

Court identifiers you may use: mass (SJC), massctapp (Appeals Court), mad (D. Mass.), ca1 (First Circuit), scotus. Leave court empty to search everything.

Return ONLY valid JSON, no markdown fences and no commentary, in exactly this shape:
{"readBack":"","issues":[{"label":"","hook":"","whyPlain":""}],"clQueries":[{"q":"","court":"","rationale":""}],"needsClarification":""}

readBack: one sentence restating, in plain English, what you understood the investigator to be asking.
hook: exactly one of "Fourth Amendment / Art. 14", "Fifth Amendment / Miranda / Art. 12", "Sixth Amendment / Right to Counsel", "Due Process / Art. 12", "Discovery / Rule 14", "Evidentiary", "Sentencing", "Other".
whyPlain: one sentence a non lawyer understands.
needsClarification: leave empty unless the description is too vague to search, in which case put a single clarifying question here and return an empty clQueries array.

INVESTIGATOR'S DESCRIPTION OR QUESTION:
${question}

MATTER: ${ac ? esc(ac.name) : "none selected"}${ac && ac.court ? " (" + esc(ac.court) + ")" : ""}

LOGGED FACTS:
${facts.map((f) => `- ${f.fact}: ${f.detail || ""}`).join("\n") || "(none logged)"}

LOGGED EVIDENCE:
${evid.map((e) => `- ${e.item}: ${e.description || ""}`).join("\n") || "(none logged)"}`;
  }

  function researchSynthesisPrompt(question, plan, ac, facts, evid, results) {
    return `You are briefing a Massachusetts criminal defense investigator who has no legal training. Explain what the retrieved authority means for this matter in plain English.

ABSOLUTE CONSTRAINT: you may reference only the opinions listed under RESULTS below, and only by the exact citation string given there. You may not cite, name, mention, or allude to any other case, statute, rule, or authority. If the retrieved authority does not answer the question, say so plainly and state what search or what record would answer it. Never fill a gap with recalled knowledge. If a result has no citation string, refer to it by party name and state that the citation still needs to be confirmed.

Distinguish holdings from dicta. Note wherever Article 14 or Article 12 of the Massachusetts Declaration of Rights gives broader protection than the federal analog. Flag any result whose precedential status suggests it is unpublished, non precedential, or may have been limited.

Write these sections, each starting with the exact heading shown:
## What this means
Three sentences maximum, plain English, no legal jargon.
## Controlling authority
One bullet per case: the exact citation, then a one line holding.
## How it applies here
Tie each authority to a specific logged fact. Where a needed fact is missing, say so.
## What is still missing from the record
Concrete records, searches, or witnesses that would resolve the open questions.

QUESTION:
${question}

WHAT THE PLANNER UNDERSTOOD: ${plan && plan.readBack ? plan.readBack : "(not recorded)"}

RESULTS (the only authority you may use):
${results.map((r, i) => `[${i + 1}] ${r.caseName}${r.citation ? ", " + r.citation : " (no citation string returned)"} | court: ${r.court || "unknown"} | filed: ${r.dateFiled || "unknown"} | status: ${r.status || "unknown"}\n    excerpt: ${(r.snippet || "(no excerpt returned)").slice(0, 500)}`).join("\n") || "(no results returned)"}

MATTER FACTS (${ac ? esc(ac.name) : "no active matter"}):
${facts.map((f) => `- ${f.fact}: ${f.detail || ""} (${f.source || "no source"})`).join("\n") || "(none logged)"}

EVIDENCE:
${evid.map((e) => `- ${e.item}: ${e.description || ""} (${e.source || "no source"})`).join("\n") || "(none logged)"}${kbGroundingBlock(question)}`;
  }

  function matterMotionSuggestPrompt(ac, precedents, facts, evid) {
    return `You are a Massachusetts criminal defense strategist helping an investigator with no legal training spot every defense angle the record supports. Base every suggestion strictly on the SAVED AUTHORITY and the MATTER FACTS below. Do not invent facts. Do not cite any case other than the saved authority listed.

For each suggested motion return: motionType (short label such as "Suppression - Warrantless Search"), title (a filing ready motion title), issue (exactly one of "Fourth Amendment / Art. 14", "Fifth Amendment / Miranda / Art. 12", "Sixth Amendment / Right to Counsel", "Due Process / Art. 12", "Discovery / Rule 14", "Evidentiary", "Sentencing", "Other"), rationale (1 to 2 sentences tying a specific holding to a specific logged fact), precedentIndex (the [n] number of the single saved authority this motion rests on), and strength ("supported" when a logged fact and a holding both back it, "contingent" when it depends on a record you do not have yet).

Return 2 to 6 suggestions, strongest first. If nothing in this record clearly supports a motion, return exactly one item with motionType "None clearly supported" and explain why in rationale.

Return ONLY a valid JSON array, no markdown and no commentary, shape:
[{"motionType":"","title":"","issue":"","rationale":"","precedentIndex":1,"strength":""}]

SAVED AUTHORITY FOR THIS MATTER:
${precedents.map((p, i) => `[${i + 1}] ${p.partyName || "Untitled"}${p.citation ? ", " + p.citation : ""} (${p.court || "court unknown"}${p.dateFiled ? ", " + p.dateFiled : ""}). Disposition: ${p.disposition || "unknown"}. ${(p.overview || p.outcome || p.sourceText || "").slice(0, 400)}`).join("\n") || "(none saved)"}

MATTER FACTS (${ac ? esc(ac.name) : "no active matter"}):
${facts.map((f) => `- ${f.fact}: ${f.detail || ""} (${f.source || "no source"})`).join("\n") || "(none logged)"}

EVIDENCE:
${evid.map((e) => `- ${e.item}: ${e.description || ""} (${e.source || "no source"})`).join("\n") || "(none logged)"}`;
  }

  /* CourtListener v4 opinion results are clustered; the excerpt lives on the nested opinion. */
  function normalizeClResult(r, kind) {
    const op = Array.isArray(r.opinions) && r.opinions.length ? r.opinions[0] : {};
    const citationRaw = r.citation || r.citations || op.citation;
    const citation = Array.isArray(citationRaw) ? citationRaw.filter(Boolean).join("; ") : (citationRaw || "");
    const snippetRaw = pick(r, ["snippet", "text"], "") || pick(op, ["snippet", "text"], "");
    return {
      kind: kind || "o",
      caseName: pick(r, ["caseName", "case_name"], "Untitled"),
      court: pick(r, ["court", "courtName", "court_id"], ""),
      dateFiled: pick(r, ["dateFiled", "date_filed"], ""),
      docketNumber: pick(r, ["docketNumber", "docket_number"], ""),
      citation: citation,
      status: pick(r, ["status", "precedential_status"], ""),
      snippet: String(snippetRaw || "").replace(/<[^>]*>/g, "").trim(),
      url: clAbsUrl(pick(r, ["absolute_url", "docket_absolute_url", "url"], "") || pick(op, ["absolute_url"], "")),
      raw: r
    };
  }

  function dedupeResults(list) {
    const seen = Object.create(null);
    const out = [];
    list.forEach((r) => {
      const key = String(r.citation || r.url || (r.caseName + r.dateFiled)).toLowerCase();
      if (!key || seen[key]) return;
      seen[key] = true;
      out.push(r);
    });
    return out;
  }

  /* The citation gate. Every generated citation is round tripped through CourtListener
     before the investigator is allowed to rely on the text. Nothing else may vouch for a cite. */
  function gateCitations(text) {
    if (!String(text || "").trim()) return Promise.resolve({ rows: [], unverified: 0 });
    return courtListenerVerifyCitations(text).then((results) => {
      const rows = (results || []).map((r) => ({
        citation: String(r.citation || r.normalized_citations || r.text || ""),
        status: r.status,
        url: r.clusters && r.clusters[0] && r.clusters[0].absolute_url
          ? clAbsUrl(r.clusters[0].absolute_url)
          : (r.cluster && r.cluster.absolute_url ? clAbsUrl(r.cluster.absolute_url) : (r.absolute_url ? clAbsUrl(r.absolute_url) : ""))
      }));
      return { rows: rows, unverified: rows.filter((r) => r.status !== 200).length };
    });
  }

  function aiStatus(msg) {
    const el = document.getElementById("aiStatus");
    if (el) el.textContent = msg || "";
  }

  function runAiResearch() {
    const ac = activeCase();
    const question = ((document.getElementById("aiQ") || {}).value || "").trim();
    if (!question) return toast("Describe what happened, or ask a question");
    const courtOverride = (document.getElementById("aiCourt") || {}).value || "";
    const docketOverride = ((document.getElementById("aiDocket") || {}).value || "").trim();
    const facts = state.facts.filter((f) => !ac || f.caseId === ac.id);
    const evid = state.evidence.filter((e) => !ac || e.caseId === ac.id);

    state._aiQ = question;
    state._aiCourt = courtOverride;
    state._aiDocket = docketOverride;
    state._aiBriefing = "";
    state._aiCiteRows = [];
    state._aiUnverified = 0;
    state._aiPlan = null;
    aiLastResults = [];
    save();

    aiStatus("Step 1 of 4 · working out what to search for...");
    callGemini(researchPlanPrompt(question, ac, facts, evid), 2048)
      .then((text) => {
        let plan;
        try { plan = parseJSONLoose(text); } catch (e) { throw new Error("Could not read the search plan the AI returned."); }
        state._aiPlan = plan;
        if (plan && plan.needsClarification) {
          throw new Error("Need one more detail: " + plan.needsClarification);
        }
        const queries = (Array.isArray(plan.clQueries) ? plan.clQueries : []).slice(0, 6);
        if (docketOverride) queries.unshift({ q: "", court: courtOverride, docketNumber: docketOverride, rationale: "Docket number supplied by the investigator." });
        if (!queries.length) throw new Error("The planner did not produce any searches. Add more detail and try again.");
        aiStatus("Step 2 of 4 · searching CourtListener (" + queries.length + " searches)...");
        return Promise.all(queries.map((qq) => {
          const court = courtOverride || qq.court || "";
          return courtListenerSearch("o", qq.q || "", court, qq.docketNumber || "")
            .then((rows) => (rows || []).slice(0, 8).map((r) => normalizeClResult(r, "o")))
            .catch(() => []);
        }));
      })
      .then((batches) => {
        const flat = [];
        batches.forEach((b) => b.forEach((r) => flat.push(r)));
        aiLastResults = dedupeResults(flat).slice(0, 24);
        if (!aiLastResults.length) {
          aiStatus("No authority came back for those searches. Try describing more of what happened, or widen the court filter.");
          render();
          return null;
        }
        aiStatus("Step 3 of 4 · reading " + aiLastResults.length + " opinions and writing the briefing...");
        return callGemini(researchSynthesisPrompt(question, state._aiPlan, ac, facts, evid, aiLastResults), 4096);
      })
      .then((briefing) => {
        if (briefing === null || briefing === undefined) return null;
        state._aiBriefing = String(briefing).trim();
        save();
        aiStatus("Step 4 of 4 · verifying every citation against CourtListener...");
        return gateCitations(state._aiBriefing);
      })
      .then((gate) => {
        if (!gate) return;
        state._aiCiteRows = gate.rows;
        state._aiUnverified = gate.unverified;
        save();
        render();
        toast(gate.unverified ? gate.unverified + " citation(s) failed verification" : "Research complete, citations verified");
      })
      .catch((err) => {
        aiStatus(err.message || String(err));
        render();
      });
  }

  const CASELAW_EXTRACT_PROMPT = `You are extracting structured data from a pasted court case for a Massachusetts criminal defense file. Use ONLY the text provided below. Do not add outside facts, citations, holdings, or case law that is not present in the text. If a field is not present in the text, return an empty string (or empty array for headnotes). Return ONLY valid JSON, no markdown code fences, no preamble or commentary, matching exactly this shape:

  function renderAiResults() {
    if (!aiLastResults.length) return "";
    return `<div class="card" style="margin-top:16px">
        <h2>Authority found <span class="chip blue" style="font-weight:400">${aiLastResults.length}</span></h2>
        <p class="muted">Straight from CourtListener's database. Each one is a real opinion, not an AI recollection.</p>
        ${aiLastResults.map((r, i) => `<div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px">
          <strong>${esc(r.caseName)}</strong>
          <div class="muted">${esc(r.court || "Court unknown")}${r.dateFiled ? " · " + esc(r.dateFiled) : ""}${r.citation ? " · " + esc(r.citation) : ""}</div>
          ${r.snippet ? `<p class="muted" style="margin-top:6px">${esc(r.snippet.slice(0, 240))}</p>` : ""}
          <div class="row" style="margin-top:6px">
            ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener" class="btn">Read on CourtListener</a>` : ""}
            <button class="btn primary" type="button" data-act="ai-add-result" data-idx="${i}">Add to matter</button>
          </div>
        </div>`).join("")}
      </div>`;
  }

  function citeRowsHtml(rows) {
    const labels = { 200: "Verified", 404: "Valid format, not in database", 400: "Invalid reporter", 300: "Ambiguous" };
    if (!rows || !rows.length) return `<p class="muted">No citations detected.</p>`;
    return rows.map((r) => `<div class="row" style="justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-top:6px">
        <span>${esc(r.citation)}</span>
        <span class="chip ${r.status === 200 ? "green" : r.status === 404 ? "orange" : "red"}">${esc(labels[r.status] || ("Status " + r.status))}</span>
        ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener" class="muted">View</a>` : ""}
      </div>`).join("");
  }

        "language": "The Defendant moves to revise or revoke the sentence because the sentence should be modified in light of the nature and circumstances of the offense, the Defendant's history and character, proportionality, newly presented mitigation, or other reasons showing that the sentence is unduly harsh or should be corrected.",
        "authority": "Mass. R. Crim. P. 29; Article 12.",
        "relief": "revising, revoking, reducing, or otherwise modifying the sentence"
      },
      {
        "num": "XXXIII.145",
        "title": "Motion to Release Unlawfully Detained Probationer",
        "group": "Release",
        "cats": [
          "Post-Conviction",
          "Probation",
          "Release"
        ],
        "language": "The Defendant moves for immediate release from custody where the Defendant is detained solely on an alleged probation violation and has not received the required timely initial violation hearing or other process necessary to justify continued detention.",
        "authority": "Mass. R. Crim. P. 30(a); Superior Court Guidelines for Probation Violation Proceedings; Article 12.",
        "relief": "releasing the Defendant from custody pending the probation violation hearing"
      },
      {
        "num": "XXXII.139",
        "title": "Motion to Set Aside Unauthorized or Invalid Sentence",
        "group": "Rule 30",
        "cats": [
          "Post-Conviction",
          "Sentencing",
          "Rule 30"
        ],
        "language": "The Defendant moves to set aside a sentence that was unauthorized, illegally imposed, or otherwise invalid as a matter of law. A sentence imposed contrary to statute, rule, constitutional requirement, or lawful sentencing authority must be vacated or corrected.",
        "authority": "Mass. R. Crim. P. 30(a); Article 12.",
        "relief": "setting aside, vacating, or correcting the unauthorized or invalid sentence"
      }
    ]
  };

  function phaseMotionBody(m, ac) {
    const caption = ac ? (ac.name || "") : "";
    const lines = [];
    lines.push("COMMONWEALTH OF MASSACHUSETTS");
    if (ac && ac.court) lines.push(String(ac.court).toUpperCase());
    if (ac && ac.docket) lines.push("Docket No. " + ac.docket);
    lines.push("");
    lines.push("COMMONWEALTH");
    lines.push("v.");
    lines.push(caption ? caption.toUpperCase() : "[DEFENDANT]");
    lines.push("");
    lines.push(m.title.toUpperCase());
    lines.push("");
    lines.push(m.language);
    if (m.authority) {
      lines.push("");
      lines.push("AUTHORITY: " + m.authority);
    }
    if (m.relief) {
      lines.push("");
      lines.push("WHEREFORE, the Defendant respectfully requests that this Honorable Court enter an order " + m.relief + ".");
    }
    lines.push("");
    lines.push("Respectfully submitted,");
    lines.push("");
    lines.push("_______________________________");
    lines.push("Counsel for the Defendant");
    lines.push("Dated: " + today());
    return lines.join("\n");
  }

  function phaseTailorPrompt(m, ac, facts, evid, precedents) {
    return [
      "You are assisting a criminal defense investigator in Massachusetts. Tailor a stock motion to this specific matter.",
      "",
      "ABSOLUTE CONSTRAINTS:",
      "1. You may cite ONLY the authorities listed under STOCK AUTHORITY and SAVED PRECEDENTS below, using the exact citation strings given. You may not add, recall, or invent any other case, statute, or rule.",
      "2. Every factual assertion must come from FACTS or EVIDENCE below. Where a necessary fact is missing, write a bracketed placeholder such as [DATE OF STOP NOT IN RECORD]. Never invent a fact.",
      "3. Keep the legal standard from the stock language intact. You are adapting it, not rewriting the law.",
      "",
      "Return the complete motion as plain text with: caption, title, numbered paragraphs of fact with record references, argument, and a prayer for relief.",
      "",
      "MOTION TITLE: " + m.title,
      "STOCK LANGUAGE: " + m.language,
      "STOCK AUTHORITY: " + (m.authority || "none supplied"),
      "RELIEF SOUGHT: " + (m.relief || "none supplied"),
      "",
      "MATTER: " + (ac ? ac.name : "unspecified") + (ac && ac.docket ? " | Docket " + ac.docket : "") + (ac && ac.court ? " | " + ac.court : ""),
      "",
      "FACTS:",
      facts.length ? facts.map((f, i) => (i + 1) + ". " + (f.text || f.summary || "")).join("\n") : "(none logged)",
      "",
      "EVIDENCE:",
      evid.length ? evid.map((e, i) => (i + 1) + ". " + (e.label || e.name || "") + " " + (e.description || "")).join("\n") : "(none logged)",
      "",
      "SAVED PRECEDENTS (verified against CourtListener):",
      precedents.length ? precedents.map((p) => "- " + (p.partyName || "Untitled") + (p.citation ? ", " + p.citation : "") + (p.court ? " (" + p.court + ")" : "") + (p.overview ? " \u2014 " + p.overview : "")).join("\n") : "(none saved \u2014 rely on the stock authority only)",
    ].join("\n");
  }

  function currentPhase() {
    return PHASES.indexOf(state._phase) >= 0 ? state._phase : PHASES[0];
  }

  function viewCasePhases() {
    const ac = activeCase();
    const phase = currentPhase();
    const q = (state._phaseQ || "").trim().toLowerCase();
    let list = PHASE_MOTIONS[phase] || [];
    if (q) {
      list = list.filter((m) =>
        m.title.toLowerCase().includes(q) ||
        (m.language || "").toLowerCase().includes(q) ||
        (m.cats || []).join(" ").toLowerCase().includes(q));
    }

    const strip = `<div class="row" style="gap:6px;flex-wrap:wrap">
        ${PHASES.map((p) => `<button class="btn ${p === phase ? "primary" : ""}" type="button" data-act="phase-select" data-phase="${esc(p)}">${esc(p)} <span class="chip ${p === phase ? "" : "blue"}" style="font-weight:400">${(PHASE_MOTIONS[p] || []).length}</span></button>`).join("")}
      </div>`;

    const groups = [];
    list.forEach((m) => {
      let g = groups.find((x) => x.name === m.group);
      if (!g) { g = { name: m.group, items: [] }; groups.push(g); }
      g.items.push(m);
    });

    const idxOf = (m) => (PHASE_MOTIONS[phase] || []).indexOf(m);

    const body = groups.length ? groups.map((g) => `
      <div style="margin-top:14px">
        <h3 style="margin:0 0 6px">${esc(g.name)} <span class="muted" style="font-weight:400">${g.items.length}</span></h3>
        ${g.items.map((m) => {
          const i = idxOf(m);
          return `<details style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:8px">
            <summary><strong>${esc(m.title)}</strong> <span class="muted" style="font-weight:400">${esc(m.num || "")}</span></summary>
            <pre style="white-space:pre-wrap;font-family:inherit;margin:10px 0 0;padding:10px;background:var(--bg2,#f7f7f8);border-radius:6px">${esc(phaseMotionBody(m, ac))}</pre>
            ${m.authority ? `<p class="muted" style="margin-top:6px"><strong>Authority.</strong> ${esc(m.authority)}</p>` : ""}
            <div class="row" style="margin-top:8px">
              <button class="btn primary" type="button" data-act="copy-phase-motion" data-idx="${i}">Copy motion</button>
              <button class="btn" type="button" data-act="tailor-phase-motion" data-idx="${i}">Tailor to this matter with AI</button>
              <button class="btn" type="button" data-act="save-phase-motion" data-idx="${i}">Save to Motion Engine</button>
            </div>
          </details>`;
        }).join("")}
      </div>`).join("") : `<p class="empty" style="margin-top:14px">No motions match “${esc(state._phaseQ || "")}” in ${esc(phase)}.</p>`;

    const note = phase === "Sentencing" && (PHASE_MOTIONS.Sentencing || []).length < 5
      ? `<p class="muted" style="margin-top:8px">This phase is thin — only ${(PHASE_MOTIONS.Sentencing || []).length} motions carried a sentencing tag in the Motion Bank. Sentencing-specific filings (departure, mitigation, credit for time served, probation conditions, revocation) still need to be written into the library.</p>`
      : "";

    return `<div class="card">
        <h2>Case phases</h2>
        <p class="muted">Every motion in the 154-motion Motion Bank library, sorted by the stage of the case where it is filed. Each one is complete and ready to copy. ${ac ? "Captions are filled from " + esc(ac.name) + "." : "Select a matter to auto-fill the caption."}</p>
        ${strip}
        ${note}
        <input id="phaseQ" type="text" style="margin-top:10px" value="${esc(state._phaseQ || "")}" placeholder="Filter within ${esc(phase)}…">
        <p class="muted" id="phaseStatus" style="margin-top:6px"></p>
        ${body}
      </div>`;
  }

  function phaseMotionAt(idx) {
    const list = PHASE_MOTIONS[currentPhase()] || [];
    return list[idx];
  }

  function copyPhaseMotion(idx) {
    const m = phaseMotionAt(idx);
    if (!m) return toast("Motion not found");
    copyText(phaseMotionBody(m, activeCase()));
  }

  function savePhaseMotion(idx) {
    const ac = activeCase();
    if (!ac) return toast("Select a matter first");
    const m = phaseMotionAt(idx);
    if (!m) return toast("Motion not found");
    state.motions.unshift({
      id: uid("mo"), caseId: ac.id, title: m.title, type: currentPhase(),
      body: phaseMotionBody(m, ac), authority: m.authority || "",
      status: "Draft", updatedAt: today(), createdAt: today()
    });
    save(); toast("Saved to Motion Engine");
  }

  function tailorPhaseMotion(idx) {
    const ac = activeCase();
    if (!ac) return toast("Select a matter first");
    const m = phaseMotionAt(idx);
    if (!m) return toast("Motion not found");
    const status = document.getElementById("phaseStatus");
    const facts = state.facts.filter((f) => f.caseId === ac.id);
    const evid = state.evidence.filter((e) => e.caseId === ac.id);
    const precedents = state.precedents.filter((p) => p.caseId === ac.id);

    if (status) status.textContent = "Tailoring \u201c" + m.title + "\u201d to " + ac.name + "\u2026";
    callGemini(phaseTailorPrompt(m, ac, facts, evid, precedents))
      .then((text) => {
        state._matterDraft = {
          title: m.title, motionType: currentPhase(), text: text,
          citeRows: [], unverified: null, busy: false
        };
        save();
        if (status) status.textContent = "Verifying citations\u2026";
        return gateCitations(text);
      })
      .then((gate) => {
        state._matterDraft.citeRows = gate.rows;
        state._matterDraft.unverified = gate.unverified;
        state._researchTab = "motions";
        save(); render();
        toast(gate.unverified ? gate.unverified + " citation(s) failed verification" : "Draft ready, all citations verified");
      })
      .catch((err) => {
        if (status) status.textContent = "Could not tailor: " + (err && err.message ? err.message : String(err));
      });
  }

  function viewCaseLaw() {
    const valid = ["search", "motions", "phases"];
    const tab = valid.indexOf(state._researchTab) >= 0 ? state._researchTab : "search";
    const n = (state._matterMotions || []).length;
    const total = PHASES.reduce((a, p) => a + (PHASE_MOTIONS[p] || []).length, 0);
    return `<div class="tabs" style="margin-bottom:14px">
        <button class="tab ${tab === "search" ? "on" : ""}" type="button" data-act="research-tab" data-tab="search">1 · Search</button>
        <button class="tab ${tab === "motions" ? "on" : ""}" type="button" data-act="research-tab" data-tab="motions">2 · Recommended motions${n ? ` <span class="chip blue" style="font-weight:400">${n}</span>` : ""}</button>
        <button class="tab ${tab === "phases" ? "on" : ""}" type="button" data-act="research-tab" data-tab="phases">3 · Case phases <span class="chip blue" style="font-weight:400">${total}</span></button>
      </div>` + (tab === "phases" ? viewCasePhases() : tab === "motions" ? viewRecommendedMotions() : viewResearchSearch());
  }

  function viewResearchSearch() {
    const ac = activeCase();
    const hasKey = Boolean(courtListenerKey());
    const plan = state._aiPlan;

    const searchCard = `
      <div class="card">
        <h2>What do you need to know?</h2>
        <p class="muted">Describe what happened in your own words, or ask a question. The AI works out the legal issues, searches real Massachusetts and federal case law, and explains what it found. You do not need to know the legal terms.</p>
        <textarea id="aiQ" style="min-height:88px;margin-top:8px" placeholder="e.g. The officer searched the trunk after my client was already handcuffed in the cruiser. Is that allowed?">${esc(state._aiQ || "")}</textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn primary" type="button" data-act="ai-research">Run AI research</button>
          ${state._aiBriefing ? `<button class="btn" type="button" data-act="save-briefing-memo">Save as memo</button>` : ""}
        </div>
        <details style="margin-top:10px">
          <summary class="muted">Narrow the search (optional)</summary>
          <label class="label">Court</label>
          <select id="aiCourt">${CL_COURTS.map(([v, l]) => `<option value="${v}" ${((state._aiCourt || "") === v) ? "selected" : ""}>${l}</option>`).join("")}</select>
          <label class="label">Docket number</label>
          <input id="aiDocket" type="text" value="${esc(state._aiDocket || "")}" placeholder="e.g. 2684CR00999">
          <p class="muted" style="margin:4px 0 0">Docket numbers repeat across courts, so pair one with a court filter. Massachusetts Superior and District Court matters are not in CourtListener; federal and appellate only.</p>
        </details>
        <p class="muted" id="aiStatus" style="margin-top:8px">${hasKey ? "" : "No CourtListener key set. Add one in the API Key Vault; unauthenticated search is capped at 125 requests per day."}</p>
      </div>`;

    const planCard = (plan && Array.isArray(plan.issues) && plan.issues.length) ? `
      <div class="card" style="margin-top:16px">
        <h2>What the AI understood</h2>
        ${plan.readBack ? `<p>${esc(plan.readBack)}</p>` : ""}
        <div class="row" style="margin-top:8px;flex-direction:column;align-items:stretch;gap:6px">
          ${plan.issues.map((i) => `<div style="border-left:3px solid var(--blue);padding:2px 0 2px 10px">
            <strong>${esc(i.label || "Issue")}</strong>${i.hook ? ` <span class="chip blue" style="font-weight:400">${esc(i.hook)}</span>` : ""}
            ${i.whyPlain ? `<div class="muted">${esc(i.whyPlain)}</div>` : ""}
          </div>`).join("")}
        </div>
      </div>` : "";

    const briefingCard = state._aiBriefing ? `
      <div class="card" style="margin-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <h2>Briefing</h2>
          <span class="chip ${state._aiUnverified ? "red" : "green"}">${state._aiUnverified ? state._aiUnverified + " citation(s) UNVERIFIED" : "All citations verified"}</span>
        </div>
        <p class="muted">Written only from the opinions listed below. Verify holdings against the full text before relying on them.</p>
        <div style="white-space:pre-wrap;margin-top:10px;border-top:1px solid var(--line);padding-top:10px">${esc(state._aiBriefing)}</div>
        <h3>Citation check</h3>
        ${citeRowsHtml(state._aiCiteRows)}
      </div>` : "";

    const libraryCard = `
      <div class="card">
        <h2>Case library${ac ? " · " + esc(ac.name) : ""}</h2>
        <p class="muted">Authority saved to this matter. The Recommended motions tab works from this list.</p>
        ${libraryTable()}
        <details style="margin-top:10px">
          <summary class="muted">Add a case by hand</summary>
          <p class="muted" style="margin-top:6px">Paste case text from Lexis, Westlaw, or CourtListener. AI structures it using only what you paste.</p>
          <textarea id="clPaste" style="min-height:110px" placeholder="Paste full case text here...">${esc(state._clPaste || "")}</textarea>
          <div class="row">
            <button class="btn primary" type="button" data-act="extract-caselaw">Extract with AI</button>
            <button class="btn" type="button" data-act="new-caselaw">+ Add manually</button>
          </div>
          <p class="muted" id="clExtractStatus" style="margin-top:8px"></p>
        </details>
      </div>`;

    return `<div class="grid-2">
        <div>${searchCard}${planCard}${briefingCard}${renderAiResults()}</div>
        <div>${libraryCard}${caseDetailCard()}${citeCard()}${sourcesCard()}</div>
      </div>`;
  }

  function libraryTable() {
    const ac = activeCase();
    const list = state.precedents.filter((p) => !ac || p.caseId === ac.id);
    return `<div class="table-wrap" style="margin-top:10px"><table class="data"><thead><tr><th>Case</th><th>Citation</th><th></th></tr></thead><tbody>
        ${list.map((p) => `<tr>
          <td><strong>${esc(p.partyName || "Untitled")}</strong><div class="muted">${esc(p.court || "")}</div></td>
          <td class="muted">${esc(p.citation || "—")}</td>
          <td style="white-space:nowrap">
            <button class="btn" type="button" data-act="open-caselaw" data-id="${p.id}">Open</button>
            <button class="icon-btn" type="button" data-act="del-caselaw" data-id="${p.id}" title="Delete">×</button>
          </td>
        </tr>`).join("") || `<tr><td colspan="3" class="empty">Nothing saved for this matter yet</td></tr>`}
      </tbody></table></div>`;
  }

  function caseDetailCard() {
    const ac = activeCase();
    const list = state.precedents.filter((p) => !ac || p.caseId === ac.id);
    const sel = list.find((p) => p.id === state._activePrecedentId);
    if (!sel) return "";
    const headnotes = sel.headnotes || [];
    return `<div class="card" style="margin-top:16px">
        <div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">
          <div>
            <h2 style="font-family:var(--serif);font-size:19px">${esc(sel.partyName || "Untitled case")}</h2>
            <p class="muted">${esc(sel.court || "Court not set")}${sel.dateFiled ? " · " + esc(sel.dateFiled) : ""}</p>
          </div>
          <button class="btn" type="button" data-act="edit-caselaw" data-id="${sel.id}">Edit</button>
        </div>
        <div class="row" style="margin-top:8px">
          <span class="chip blue">${esc(sel.citation || "No citation")}</span>
          ${sel.disposition ? `<span class="chip green">${esc(sel.disposition)}</span>` : ""}
        </div>
        ${sel.proceduralPosture ? `<p style="margin-top:8px"><strong>Procedural posture.</strong> ${esc(sel.proceduralPosture)}</p>` : ""}
        ${sel.overview ? `<p style="margin-top:6px"><strong>Overview.</strong> ${esc(sel.overview)}</p>` : ""}
        ${sel.outcome ? `<p style="margin-top:6px"><strong>Outcome.</strong> ${esc(sel.outcome)}</p>` : ""}
        ${sel.sourceText && !(sel.overview || sel.outcome) ? `<p class="muted" style="margin-top:6px">${esc(String(sel.sourceText).slice(0, 400))}</p>` : ""}
        ${headnotes.length ? `<h3>Headnotes</h3><ol style="margin-left:18px;line-height:1.7">${headnotes.map((h) => `<li>${esc(h)}</li>`).join("")}</ol>` : ""}
        ${sel.sourceUrl ? `<div class="row" style="margin-top:8px"><a href="${esc(sel.sourceUrl)}" target="_blank" rel="noopener" class="btn">Read full opinion</a></div>` : ""}
      </div>`;
  }

  function viewRecommendedMotions() {
    const ac = activeCase();
    const precedents = state.precedents.filter((p) => !ac || p.caseId === ac.id);
    const suggestions = state._matterMotions || [];
    const d = state._matterDraft;

    const listCard = `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <div>
            <h2>Recommended motions</h2>
            <p class="muted">${esc(ac ? ac.name : "No matter selected")} · ${precedents.length} case(s) in the library</p>
          </div>
          <button class="btn primary" type="button" data-act="suggest-matter-motions">${suggestions.length ? "Re-run" : "Find motions"}</button>
        </div>
        <p class="muted" style="margin-top:6px">Built from every case saved to this matter plus the facts and evidence you logged. Click one to generate the complete motion with verified citations.</p>
        <p class="muted" id="matterMotionStatus" style="margin-top:6px"></p>
        <div class="row" style="margin-top:8px;flex-direction:column;align-items:stretch;gap:8px">
          ${suggestions.map((s, i) => `
            <button class="btn" type="button" style="text-align:left;white-space:normal;height:auto;padding:12px" data-act="draft-matter-motion" data-idx="${i}">
              <strong>${esc(s.title || s.motionType || "Motion")}</strong>
              ${s.issue ? ` <span class="chip blue" style="font-weight:400">${esc(s.issue)}</span>` : ""}
              ${s.strength ? ` <span class="chip ${s.strength === "supported" ? "green" : "orange"}" style="font-weight:400">${esc(s.strength)}</span>` : ""}
              <br><span class="muted" style="font-weight:400">${esc(s.rationale || "")}</span>
              ${s.precedentLabel ? `<br><span class="muted" style="font-weight:400">Rests on: ${esc(s.precedentLabel)}</span>` : ""}
            </button>`).join("") || `<p class="empty">${precedents.length ? "No suggestions yet. Click Find motions." : "Save some case law on the Search tab first."}</p>`}
        </div>
      </div>`;

    const gateBlocked = !d || d.unverified === null || d.unverified > 0;
    const draftCard = d ? `
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <h2>${esc(d.title || "Draft motion")}</h2>
          ${d.unverified === null
            ? `<span class="chip orange">Citations not yet checked</span>`
            : `<span class="chip ${d.unverified ? "red" : "green"}">${d.unverified ? d.unverified + " citation(s) UNVERIFIED" : "All citations verified"}</span>`}
        </div>
        <p class="muted">${esc(d.motionType || "")} · AI drafted. Every factual assertion and every citation must be checked against the record before filing.</p>
        <p class="muted" id="matterDraftStatus" style="margin-top:6px"></p>
        <textarea id="matterDraftText" style="min-height:340px;margin-top:8px" ${d.busy ? "disabled" : ""}>${esc(d.busy ? "Drafting..." : (d.text || ""))}</textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn" type="button" data-act="verify-matter-draft">Verify citations</button>
          <button class="btn" type="button" data-act="copy-matter-draft">Copy</button>
          <button class="btn primary" type="button" data-act="save-matter-draft" ${gateBlocked ? "disabled" : ""}>Save to Motion Engine</button>
        </div>
        ${gateBlocked ? `<p class="muted" style="margin-top:6px">Saving unlocks once every citation in the draft verifies against CourtListener.</p>` : ""}
        ${d.citeRows && d.citeRows.length ? `<h3>Citation check</h3>${citeRowsHtml(d.citeRows)}` : ""}
      </div>` : `<div class="card"><h2>Motion draft</h2><p class="empty">Pick a recommended motion to generate the full text.</p></div>`;

    return `<div class="grid-2"><div>${listCard}</div><div>${draftCard}</div></div>`;
  }
  function citeCard() {
    return `
      <div class="card" style="margin-top:16px">
        <h2>Citation checker</h2>
        <p class="muted">Paste any citations to confirm they exist in CourtListener's real database.</p>
        <textarea id="citeBox" style="min-height:70px" placeholder="Paste citations to verify...">${esc(state._cites || "")}</textarea>
        <div class="row">
          <button class="btn primary" type="button" data-act="verify-citations-cl">Verify with CourtListener</button>
          <button class="btn" type="button" data-act="copy-cite-prompt">Copy AI treatment-check prompt</button>
        </div>
        <p class="muted" id="clCiteStatus" style="margin-top:6px"></p>
        <div id="clCiteResults"></div>
      </div>`;
  }

  function sourcesCard() {
    return `
      <div class="card sources" style="margin-top:16px">
        <h2>Reference sources</h2>
        <details><summary>Massachusetts</summary>
          <ul>
            <li><a href="https://www.mass.gov/orgs/supreme-judicial-court" target="_blank" rel="noopener">SJC</a></li>

    if (aid) aid.addEventListener("input", () => { state._aiDocket = aid.value; });

  function onAct(act, data) {
    const ac = activeCase();
    if (act === "new-case") return modalCase();
    if (act === "select-case") { state.activeCaseId = data.id; save(); render(); toast("Case selected"); return; }
    if (act === "del-case") {
      if (!confirm("Delete case and keep orphan facts/memos/motions?")) return;
      state.cases = state.cases.filter((c) => c.id !== data.id);
      if (state.activeCaseId === data.id) state.activeCaseId = state.cases[0] && state.cases[0].id;
      save(); render(); return;
    }
    if (act === "copy-cite-prompt") {
      const cites = (document.getElementById("citeBox") || {}).value || "";
      return copyText(CITATION_PROMPT + cites);
    }
    if (act === "copy-text") {
      const el = document.getElementById(data.target);
      return copyText(el ? el.textContent : "");
    }
    if (act === "copy-tmpl") return copyText(data.tmpl === "sentence" ? SENTENCE_TMPL : SUPPRESS_TMPL);
    if (act === "research-tab") { state._researchTab = data.tab; save(); render(); return; }
    if (act === "ai-research") return runAiResearch();
    if (act === "phase-select") { state._phase = data.phase; state._phaseQ = ""; save(); render(); return; }
    if (act === "copy-phase-motion") return copyPhaseMotion(Number(data.idx));
    if (act === "save-phase-motion") return savePhaseMotion(Number(data.idx));
    if (act === "tailor-phase-motion") return tailorPhaseMotion(Number(data.idx));
    if (act === "ai-add-result") return addAiResultAsCaseLaw(Number(data.idx));
    if (act === "save-briefing-memo") return saveBriefingAsMemo();
    if (act === "new-memo") return modalMemo();
    if (act === "edit-memo") return modalMemo(state.memos.find((m) => m.id === data.id));
    if (act === "del-memo") {
      state.memos = state.memos.filter((m) => m.id !== data.id); save(); render(); return;
    }
    if (act === "new-motion") return modalMotion(null, data.type || "Other");
    if (act === "edit-motion") return modalMotion(state.motions.find((m) => m.id === data.id));
    if (act === "del-motion") {
      state.motions = state.motions.filter((m) => m.id !== data.id); save(); render(); return;
    }
    if (act === "new-fact") return modalFact();
    if (act === "edit-fact") return modalFact(state.facts.find((f) => f.id === data.id));
    if (act === "del-fact") { state.facts = state.facts.filter((f) => f.id !== data.id); save(); render(); return; }
    if (act === "new-evidence") return modalEvidence();
    if (act === "edit-evidence") return modalEvidence(state.evidence.find((e) => e.id === data.id));
    if (act === "del-evidence") { state.evidence = state.evidence.filter((e) => e.id !== data.id); save(); render(); return; }

    if (act === "new-caselaw") return modalPrecedent();
    if (act === "edit-caselaw") return modalPrecedent(state.precedents.find((p) => p.id === data.id));
    if (act === "open-caselaw") { state._activePrecedentId = data.id; save(); render(); return; }
    if (act === "del-caselaw") {
      if (!confirm("Delete this saved case?")) return;
      state.precedents = state.precedents.filter((p) => p.id !== data.id);
      save(); render(); return;
    }
    if (act === "extract-caselaw") return extractCaseLaw();
    if (act === "suggest-matter-motions") return suggestMatterMotions();
    if (act === "draft-matter-motion") return draftMatterMotion(Number(data.idx));
    if (act === "verify-matter-draft") return verifyMatterDraft();
    if (act === "save-matter-draft") return saveMatterDraftAsMotion();
    if (act === "copy-matter-draft") {
      const el = document.getElementById("matterDraftText");
      return copyText(el ? el.value : "");
    }
    if (act === "verify-citations-cl") return verifyCitationsWithCourtListener();
  }






  function verifyCitationsWithCourtListener() {
    const cites = (document.getElementById("citeBox") || {}).value || "";
    if (!cites.trim()) return toast("Paste citations first");
    const status = document.getElementById("clCiteStatus");
    const out = document.getElementById("clCiteResults");
    if (status) status.textContent = "Checking against CourtListener...";
    if (out) out.innerHTML = "";
    gateCitations(cites)
      .then((gate) => {
        if (status) status.textContent = gate.unverified ? gate.unverified + " of " + gate.rows.length + " could not be verified." : "";
        if (out) out.innerHTML = citeRowsHtml(gate.rows);
      })
      .catch((err) => { if (status) status.textContent = err.message || String(err); });
  }

  function extractCaseLaw() {
    const ac = activeCase();
    if (!ac) return toast("Select or create a case first");
    const pasted = (document.getElementById("clPaste") || {}).value || "";
    if (!pasted.trim()) return toast("Paste case text first");
    const status = document.getElementById("clExtractStatus");
    if (status) status.textContent = "Extracting...";
    callGemini(CASELAW_EXTRACT_PROMPT + pasted.slice(0, 60000), 4096)
      .then((text) => {
        let fields;
        try { fields = parseJSONLoose(text); } catch (e) { throw new Error("Could not parse AI response as JSON."); }
        const row = {
          id: uid("pl"), caseId: ac.id,
          partyName: fields.partyName || "", court: fields.court || "", dateFiled: fields.dateFiled || "",
          citation: fields.citation || "", docketNo: fields.docketNo || "",
          priorHistory: fields.priorHistory || "", subsequentHistory: fields.subsequentHistory || "",
          disposition: fields.disposition || "", coreTerms: fields.coreTerms || "",
          proceduralPosture: fields.proceduralPosture || "", overview: fields.overview || "", outcome: fields.outcome || "",
          headnotes: Array.isArray(fields.headnotes) ? fields.headnotes.filter(Boolean) : [],
          sourceText: pasted, recommendedMotions: [],
          createdAt: today(), updatedAt: today()
        };
        state.precedents.unshift(row);
        state._activePrecedentId = row.id;
        state._clPaste = "";
        save(); render(); toast("Case extracted. Review the fields before relying on them.");
      })
      .catch((err) => { if (status) status.textContent = err.message || String(err); else toast(err.message || String(err)); });
  }

      const evid = state.evidence.filter((e) => [...document.querySelectorAll("#evidPick input:checked")].map((i) => i.value).includes(e.id));
