  /* ===== ARC Knowledge Bank v1 =====
     Office reference library: MA criminal form templates plus OUI practice guide sections.
     Storage: IndexedDB (arc_legal_kb_v1) so the bank never competes with localStorage state.
     Load once from arc-knowledge-bank-v1.json (auto fetch when served over http, manual import otherwise). */

  const KB_DB_NAME = "arc_legal_kb_v1";
  const KB_DOCS = "docs";
  const KB_META = "meta";
  let kbDocs = [];
  let kbMeta = null;
  let kbStatus = "loading";
  let kbFilterQ = "";
  let kbFilterCollection = "";
  let kbFilterType = "";

  function kbOpenDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(KB_DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(KB_DOCS)) db.createObjectStore(KB_DOCS, { keyPath: "id" });
        if (!db.objectStoreNames.contains(KB_META)) db.createObjectStore(KB_META, { keyPath: "k" });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  function kbTx(db, store, mode, fn) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction(store, mode);
      const out = fn(tx.objectStore(store));
      tx.oncomplete = () => resolve(out && out.result !== undefined ? out.result : undefined);
      tx.onerror = () => reject(tx.error);
    });
  }

  async function kbLoadFromDb() {
    try {
      const db = await kbOpenDb();
      const docs = await new Promise((resolve, reject) => {
        const tx = db.transaction(KB_DOCS, "readonly");
        const req = tx.objectStore(KB_DOCS).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
      const meta = await new Promise((resolve, reject) => {
        const tx = db.transaction(KB_META, "readonly");
        const req = tx.objectStore(KB_META).get("bank");
        req.onsuccess = () => resolve(req.result || null);
        req.onerror = () => reject(req.error);
      });
      db.close();
      kbDocs = docs;
      kbMeta = meta;
      kbStatus = docs.length ? "ready" : "empty";
    } catch (e) {
      kbStatus = "error";
    }
  }

  async function kbImportBank(bank) {
    if (!bank || bank.schema !== "arc-knowledge-bank-v1" || !Array.isArray(bank.entries)) {
      throw new Error("Not an arc-knowledge-bank-v1 file");
    }
    const db = await kbOpenDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction([KB_DOCS, KB_META], "readwrite");
      const store = tx.objectStore(KB_DOCS);
      store.clear();
      bank.entries.forEach((e) => store.put(e));
      tx.objectStore(KB_META).put({
        k: "bank",
        generated: bank.generated || "",
        count: bank.entries.length,
        collections: bank.collections || [],
        importedAt: new Date().toLocaleString()
      });
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    await kbLoadFromDb();
  }

  async function kbClearBank() {
    const db = await kbOpenDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction([KB_DOCS, KB_META], "readwrite");
      tx.objectStore(KB_DOCS).clear();
      tx.objectStore(KB_META).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    kbDocs = [];
    kbMeta = null;
    kbStatus = "empty";
  }

  async function kbAutoFetch() {
    /* Works when the tool is served over http(s) with the bank JSON alongside it.
       Silently skipped on file:// or when the JSON is absent. */
    if (location.protocol === "file:") return;
    try {
      const res = await fetch("arc-knowledge-bank-v1.json", { cache: "no-store" });
      if (!res.ok) return;
      const bank = await res.json();
      await kbImportBank(bank);
      if (state.route === "knowledge") render();
      toast("Knowledge bank loaded (" + kbDocs.length + " documents)");
    } catch (e) { /* offline or not deployed next to the tool; manual import remains available */ }
  }

  function kbTokens(q) {
    return String(q || "").toLowerCase().split(/[^a-z0-9]+/).filter((t) => t.length > 2);
  }

  function kbScore(doc, tokens) {
    if (!tokens.length) return 0;
    const title = doc.title.toLowerCase();
    const tags = (doc.tags || []).join(" ");
    const text = doc.text.toLowerCase();
    let score = 0;
    for (const t of tokens) {
      if (title.includes(t)) score += 6;
      if (tags.includes(t)) score += 4;
      let idx = 0, hits = 0;
      while (hits < 10) {
        idx = text.indexOf(t, idx);
        if (idx === -1) break;
        hits += 1; idx += t.length;
      }
      score += hits;
    }
    return score;
  }

  function kbSearch(query, limit) {
    const tokens = kbTokens(query);
    if (!tokens.length) return [];
    return kbDocs
      .map((d) => ({ d, s: kbScore(d, tokens) }))
      .filter((x) => x.s > 0)
      .sort((a, b) => b.s - a.s)
      .slice(0, limit || 8)
      .map((x) => x.d);
  }

  function kbExcerpt(doc, query, maxLen) {
    const cap = maxLen || 1000;
    const tokens = kbTokens(query);
    const lower = doc.text.toLowerCase();
    let at = -1;
    for (const t of tokens) {
      const i = lower.indexOf(t);
      if (i !== -1 && (at === -1 || i < at)) at = i;
    }
    if (at === -1) return doc.text.slice(0, cap);
    const start = Math.max(0, at - Math.floor(cap / 4));
    return (start > 0 ? "..." : "") + doc.text.slice(start, start + cap);
  }

  function kbGroundingBlock(question) {
    if (!kbDocs.length) return "";
    const top = kbSearch(question, 3);
    if (!top.length) return "";
    const excerpts = top.map((d, i) =>
      "[KB " + (i + 1) + "] " + d.title + " (" + d.collectionLabel + (d.section ? ", sec. " + d.section : "") + ", type: " + d.docType + ")\n" + kbExcerpt(d, question, 1100)
    ).join("\n\n");
    return "\n\nPRACTICE GUIDANCE EXCERPTS from the office Knowledge Bank (secondary reference materials: Massachusetts criminal form templates and an OUI practice guide). These excerpts are NOT retrieved case law and are NOT citable authority. Use them only to add one final optional section with the exact heading:\n## Practice pointers (from office knowledge bank)\n2 to 5 bullets on procedure, drafting, or strategy drawn only from these excerpts, each ending with the excerpt title in parentheses. If a case, statute, or rule is named inside an excerpt, do not assert it as authority; instead list it under \"What is still missing from the record\" as a citation to verify on CourtListener. If the excerpts do not bear on the question, omit the section entirely.\n\n" + excerpts;
  }

  function kbTypeChip(t) {
    const colors = { form: "blue", treatise: "gold", checklist: "green", affidavit: "orange", memorandum: "orange", synopsis: "gold", notice: "blue", order: "orange", letter: "blue", process: "blue" };
    return "<span class=\"chip " + (colors[t] || "blue") + "\">" + esc(t) + "</span>";
  }

  function kbFiltered() {
    let docs = kbFilterQ ? kbSearch(kbFilterQ, 500) : kbDocs.slice().sort((a, b) => a.collection === b.collection ? String(a.section || a.title).localeCompare(String(b.section || b.title)) : a.collection.localeCompare(b.collection));
    if (kbFilterCollection) docs = docs.filter((d) => d.collection === kbFilterCollection);
    if (kbFilterType) docs = docs.filter((d) => d.docType === kbFilterType);
    return docs;
  }

  function viewKnowledge() {
    if (kbStatus === "loading") return "<div class=\"card\"><p class=\"empty\">Loading knowledge bank...</p></div>";
    const collections = kbMeta && kbMeta.collections ? kbMeta.collections : [];
    const types = Array.from(new Set(kbDocs.map((d) => d.docType))).sort();
    const docs = kbFiltered();
    const shown = docs.slice(0, 120);
    return "\n      <div class=\"kpi\">\n        <div class=\"card\"><strong>" + kbDocs.length + "</strong><span>Documents</span></div>\n        <div class=\"card\"><strong>" + collections.length + "</strong><span>Collections</span></div>\n        <div class=\"card\"><strong>" + kbDocs.filter((d) => d.docType === "form").length + "</strong><span>Form templates</span></div>\n        <div class=\"card\"><strong>" + kbDocs.filter((d) => d.docType === "treatise" || d.docType === "checklist").length + "</strong><span>Guide sections + checklists</span></div>\n      </div>\n      <div class=\"card\" style=\"margin-bottom:16px\">\n        <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap\">\n          <h2>Office reference library</h2>\n          <div class=\"row\">\n            <button class=\"btn\" type=\"button\" data-act=\"kb-import\">Import bank JSON</button>\n            " + (kbDocs.length ? "<button class=\"icon-btn\" type=\"button\" data-act=\"kb-clear\" title=\"Remove all knowledge bank documents\">Clear</button>" : "") + "\n            <input id=\"kbFile\" type=\"file\" accept=\"application/json,.json\" style=\"display:none\">\n          </div>\n        </div>\n        <p class=\"muted\" style=\"margin-top:6px\">" + (kbMeta ? "Bank generated " + esc(kbMeta.generated || "unknown") + " · imported " + esc(kbMeta.importedAt || "unknown") + ". Search results here also ground the AI research answers as practice pointers (never as citable authority)." : "No bank loaded. Import arc-knowledge-bank-v1.json to add the firm's MA criminal forms and OUI practice guide library.") + "</p>\n        <div class=\"row\" style=\"margin-top:12px;gap:8px;flex-wrap:wrap\">\n          <input id=\"kbQ\" type=\"text\" placeholder=\"Search titles, tags, and full text (e.g. breathalyzer suppression, hardship license, voir dire)\" value=\"" + esc(kbFilterQ) + "\" style=\"flex:1;min-width:240px\">\n          <select id=\"kbCollection\"><option value=\"\">All collections</option>" + collections.map((c) => "<option value=\"" + esc(c.id) + "\" " + (kbFilterCollection === c.id ? "selected" : "") + ">" + esc(c.label) + "</option>").join("") + "</select>\n          <select id=\"kbType\"><option value=\"\">All types</option>" + types.map((t) => "<option value=\"" + esc(t) + "\" " + (kbFilterType === t ? "selected" : "") + ">" + esc(t) + "</option>").join("") + "</select>\n        </div>\n      </div>\n      <div class=\"card\">\n        <h2>" + (kbFilterQ ? "Results" : "Browse") + " <span class=\"chip blue\" style=\"font-weight:400\">" + docs.length + "</span>" + (docs.length > shown.length ? " <span class=\"muted\" style=\"font-size:12px\">showing first " + shown.length + "</span>" : "") + "</h2>\n        <div class=\"table-wrap\"><table class=\"data\"><thead><tr><th>Document</th><th>Collection</th><th>Type</th><th></th></tr></thead><tbody>\n          " + (shown.map((d) => "<tr>\n            <td><strong>" + esc(d.title) + "</strong>" + (d.section ? "<div class=\"muted\">sec. " + esc(d.section) + "</div>" : "") + (d.tags && d.tags.length ? "<div class=\"muted\" style=\"font-size:11px\">" + d.tags.map(esc).join(" · ") + "</div>" : "") + "</td>\n            <td class=\"muted\">" + esc(d.collectionLabel) + "</td>\n            <td>" + kbTypeChip(d.docType) + "</td>\n            <td style=\"white-space:nowrap\"><button class=\"btn\" type=\"button\" data-act=\"kb-open\" data-id=\"" + d.id + "\">Open</button></td>\n          </tr>").join("") || "<tr><td colspan=\"4\" class=\"empty\">" + (kbDocs.length ? "No documents match" : "No bank loaded yet") + "</td></tr>") + "\n        </tbody></table></div>\n      </div>";
  }

  function kbOpenDoc(id) {
    const d = kbDocs.find((x) => x.id === id);
    if (!d) return;
    openModal("\n      <div style=\"display:flex;justify-content:space-between;gap:8px;align-items:flex-start\">\n        <div>\n          <h2 style=\"margin:0\">" + esc(d.title) + "</h2>\n          <p class=\"muted\" style=\"margin:4px 0 0\">" + esc(d.collectionLabel) + (d.section ? " · sec. " + esc(d.section) : "") + " · " + esc(d.docType) + " · " + esc(d.sourceFile) + "</p>\n        </div>\n        <button class=\"icon-btn\" type=\"button\" data-act=\"kb-close\">×</button>\n      </div>\n      <div class=\"row\" style=\"margin:12px 0\">\n        <button class=\"btn\" type=\"button\" data-act=\"kb-copy\" data-id=\"" + d.id + "\">Copy text</button>\n        <button class=\"btn\" type=\"button\" data-act=\"kb-download\" data-id=\"" + d.id + "\">Download .txt</button>\n      </div>\n      <div style=\"max-height:60vh;overflow:auto;white-space:pre-wrap;font-size:13px;line-height:1.55;background:rgba(0,0,0,.14);border-radius:8px;padding:14px\">" + esc(d.text) + "</div>");
  }

  document.getElementById("view").addEventListener("click", (e) => {
    const el = e.target.closest("[data-act^='kb-']");
    if (!el) return;
    const act = el.getAttribute("data-act");
    if (act === "kb-import") {
      const inp = document.getElementById("kbFile");
      if (!inp) return;
      inp.onchange = (ev) => {
        const file = ev.target.files && ev.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          try {
            await kbImportBank(JSON.parse(String(reader.result || "{}")));
            render();
            toast("Knowledge bank imported (" + kbDocs.length + " documents)");
          } catch (err) {
            toast("Import failed: not a valid knowledge bank file");
          }
        };
        reader.readAsText(file);
        ev.target.value = "";
      };
      inp.click();
    }
    if (act === "kb-clear") {
      if (!confirm("Remove all knowledge bank documents from this browser? The JSON file itself is not affected.")) return;
      kbClearBank().then(() => { render(); toast("Knowledge bank cleared"); });
    }
    if (act === "kb-open") kbOpenDoc(el.getAttribute("data-id"));
  });

  document.getElementById("view").addEventListener("input", (e) => {
    if (e.target.id === "kbQ") {
      kbFilterQ = e.target.value;
      const docs = kbFiltered();
      /* live refresh of the results card only, preserving input focus */
      const tables = document.querySelectorAll("#view .card table.data tbody");
      const tbody = tables[tables.length - 1];
      if (tbody) {
        const shown = docs.slice(0, 120);
        tbody.innerHTML = shown.map((d) => "<tr>\n            <td><strong>" + esc(d.title) + "</strong>" + (d.section ? "<div class=\"muted\">sec. " + esc(d.section) + "</div>" : "") + "</td>\n            <td class=\"muted\">" + esc(d.collectionLabel) + "</td>\n            <td>" + kbTypeChip(d.docType) + "</td>\n            <td style=\"white-space:nowrap\"><button class=\"btn\" type=\"button\" data-act=\"kb-open\" data-id=\"" + d.id + "\">Open</button></td>\n          </tr>").join("") || "<tr><td colspan=\"4\" class=\"empty\">No documents match</td></tr>";
      }
    }
  });

  document.getElementById("view").addEventListener("change", (e) => {
    if (e.target.id === "kbCollection") { kbFilterCollection = e.target.value; render(); }
    if (e.target.id === "kbType") { kbFilterType = e.target.value; render(); }
  });

  document.getElementById("modal").addEventListener("click", (e) => {
    const el = e.target.closest("[data-act^='kb-']");
    if (!el) return;
    const act = el.getAttribute("data-act");
    if (act === "kb-close") closeModal();
    if (act === "kb-copy") {
      const d = kbDocs.find((x) => x.id === el.getAttribute("data-id"));
      if (d) copyText(d.text);
    }
    if (act === "kb-download") {
      const d = kbDocs.find((x) => x.id === el.getAttribute("data-id"));
      if (d) downloadText(d.text, d.title.replace(/[^a-z0-9]+/gi, "_").slice(0, 80) + ".txt", "text/plain");
    }
  });

  kbLoadFromDb().then(() => {
    if (!kbDocs.length) kbAutoFetch();
    if (state.route === "knowledge") render();
  });
  /* ===== end ARC Knowledge Bank v1 ===== */

  // Global nav
  document.querySelectorAll(".nav-btn").forEach((b) => b.addEventListener("click", () => setRoute(b.dataset.route)));
  document.getElementById("btnNewCase").onclick = () => modalCase();
  document.getElementById("btnExport").onclick = () => {
    downloadText(JSON.stringify({ version: "1.0.0", exportedAt: today(), state }, null, 2), "ARC_Legal_Research_Motions_export.json");
    toast("JSON exported");
  };
  document.getElementById("btnImport").onclick = () => document.getElementById("importFile").click();
  document.getElementById("importFile").onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result || "{}"));
        if (!data.state || !data.state.cases) throw new Error("Invalid file");
        state = data.state;
        save(); render(); toast("Import complete");
      } catch {
        toast("Import failed");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };
  document.getElementById("modalBack").addEventListener("click", (e) => { if (e.target.id === "modalBack") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

  function applySharedLegalCase(context) {
    const sharedId = String(context.caseId || "").trim();
    const matter = String(context.matter || "").trim();
    const docket = String(context.docket || "").trim();
    if (!sharedId && !matter && !docket) return;
    let row = state.cases.find((item) => sharedId && item.sharedCaseId === sharedId);
    if (!row) row = state.cases.find((item) =>
      (docket && String(item.docket || "").toLowerCase() === docket.toLowerCase()) ||
      (matter && String(item.name || "").toLowerCase() === matter.toLowerCase())
    );
    if (!row) {
      row = { id: uid("c"), name: matter || "Untitled matter", docket: docket, court: "", client: "", status: "Active", createdAt: today() };
      state.cases.unshift(row);
    }
    row.sharedCaseId = sharedId || row.sharedCaseId || "";
    if (matter) row.name = matter;
    if (docket) row.docket = docket;
    if (context.court) row.court = context.court;
    if (context.clientName) row.client = context.clientName;
    if (context.status) row.status = context.status;
    row.subjectName = context.subjectName || row.subjectName || "";
    row.incidentDate = context.incidentDate || row.incidentDate || "";
    row.investigator = context.investigator || row.investigator || "";
    row.notes = context.notes || row.notes || "";
    state.activeCaseId = row.id;
    save();
    render();
  }


  /* ---------- Case briefing: what you should know ---------- */
  const BRIEF_KEY = "ARC_CASE_BRIEF_V1";

  function readCaseBrief() {
    try {
      return JSON.parse(localStorage.getItem(BRIEF_KEY) || "null");
    } catch (error) {
      return null;
    }
  }

  function briefFlags(text) {
    const sentences = String(text || "").replace(/\s+/g, " ").match(/[^.!?]+[.!?]/g) || [];
    const gapWord = /\b(no|not|without|missing|absent|blank|incomplete|unsupplied|unaccounted)\b/i;
    const recordWord = /\b(record|report|certificate|video|footage|audio|log|receipt|warrant|affidavit|inventory|docket|result|form|photograph|statement|disposition|recording|camera|testing|seal|transfer|return|supplement)\b/i;
    const conflictWord = /\b(inconsistent|conflict|discrepan|do not form|before the reported|after the arrest|differs|contradict)\b/i;
    const gaps = [];
    const conflicts = [];

    sentences.forEach((line) => {
      const sentence = line.trim();
      if (sentence.length < 25 || sentence.length > 320) return;
      if (conflictWord.test(sentence) && conflicts.length < 8) {
        conflicts.push(sentence);
      } else if (gapWord.test(sentence) && recordWord.test(sentence) && gaps.length < 10) {
        gaps.push(sentence);
      }
    });

    return { gaps, conflicts };
  }

  function briefingHost() {
    let host = document.getElementById("arcCaseBriefing");
    if (host) return host;

    const view = document.getElementById("view");
    if (!view || !view.parentNode) return null;

    host = document.createElement("div");
    host.id = "arcCaseBriefing";
    host.className = "card";
    host.style.margin = "0 0 16px";
    view.parentNode.insertBefore(host, view);
    return host;
  }

  function renderCaseBriefing() {
    const host = briefingHost();
    if (!host) return;

    const brief = readCaseBrief();
    const shared = (window.ARCUnified && window.ARCUnified.getCase()) || {};
    const matter = (brief && brief.matter) || shared.matter || "";

    if (!brief || !brief.reportText) {
      host.innerHTML =
        "<h2>What you should know about this case</h2>" +
        "<p class=\"muted\">No shared case brief was found yet. Open ARC Notebook, upload the case records, and generate a report. The briefing appears here automatically.</p>";
      return;
    }

    const flags = briefFlags(brief.reportText);
    let html = "<h2>What you should know about this case</h2>";
    html +=
      "<p class=\"muted\">" +
      esc(matter || brief.notebookName || "Shared matter") +
      (brief.docket ? " &middot; Docket " + esc(brief.docket) : "") +
      " &middot; " +
      (brief.docs || []).length +
      " source document" +
      ((brief.docs || []).length === 1 ? "" : "s") +
      " &middot; brief updated " +
      esc(String(brief.updatedAt || "").slice(0, 10)) +
      "</p>";

    if (flags.conflicts.length) {
      html +=
        "<h3>Timing and consistency issues in the record</h3><ul>" +
        flags.conflicts.map((text) => "<li>" + esc(text) + "</li>").join("") +
        "</ul>";
    }

    if (flags.gaps.length) {
      html +=
        "<h3>Records the report identifies as missing or incomplete</h3><ul>" +
        flags.gaps.map((text) => "<li>" + esc(text) + "</li>").join("") +
        "</ul>";
    }

    if (!flags.conflicts.length && !flags.gaps.length) {
      html +=
        "<p class=\"muted\">The shared report is available, but no automatic gap or conflict keywords were detected. Review the full report before forming a legal conclusion.</p>";
    }

    html +=
      "<div class=\"row\">" +
      "<button class=\"btn primary\" type=\"button\" id=\"arcBriefGen\">Generate legal briefing with AI</button>" +
      "<button class=\"btn\" type=\"button\" id=\"arcBriefSend\">Send briefing to Main Report</button>" +
      "<span class=\"muted\" id=\"arcBriefStatus\"></span></div>" +
      "<div id=\"arcBriefOut\" style=\"white-space:pre-wrap;margin-top:10px\"></div>";

    host.innerHTML = html;
    const out = document.getElementById("arcBriefOut");
    if (host.dataset.aiText) out.textContent = host.dataset.aiText;

    document.getElementById("arcBriefGen").addEventListener("click", () => {
      generateLegalBriefing(brief, matter);
    });

    document.getElementById("arcBriefSend").addEventListener("click", () => {
      const bodyText = host.dataset.aiText || flags.conflicts.concat(flags.gaps).join("\n");
      const status = document.getElementById("arcBriefStatus");
      if (!bodyText.trim()) {
        status.textContent = "Nothing to send yet.";
        return;
      }
      if (!window.ARCUnified) {
        status.textContent = "The shared report bridge is unavailable.";
        return;
      }
      window.ARCUnified.saveReport({
        title: "Legal briefing: " + (matter || "shared matter"),
        reportType: "Legal Briefing",
        source: "legal-research",
        text: bodyText,
        html: ""
      });
      status.textContent = "Sent to the Main Report inbox for investigator review.";
    });
  }

  function briefingGeminiKey() {
    try {
      if (window.ARC_SYSTEM_KEYS && window.ARC_SYSTEM_KEYS.read) {
        const keys = window.ARC_SYSTEM_KEYS.read();
        if (keys && keys.gemini) return keys.gemini;
      }
    } catch (error) {}

    try {
      return localStorage.getItem("ARC_GEMINI_KEY_V1") || "";
    } catch (error) {
      return "";
    }
  }

  function generateLegalBriefing(brief, matter) {
    const status = document.getElementById("arcBriefStatus");
    const out = document.getElementById("arcBriefOut");
    const key = briefingGeminiKey();

    if (!key) {
      status.textContent = "Add a Gemini key in the API Key Vault first.";
      return;
    }

    status.textContent = "Generating briefing...";
    const grounding = String(brief.reportText || "").slice(0, 80000);
    const prompt =
      "You are a Massachusetts criminal defense legal research assistant preparing an orientation briefing for defense counsel" +
      (matter ? " in the matter of " + matter : "") +
      ".\n\nGROUNDING: Base every factual statement strictly on the investigation report below. Do not invent facts, case names, dates, quotations, or citation details. " +
      "Clearly distinguish allegations, recorded facts, missing information, analytical issues, and legal propositions. " +
      "Any legal authority must be identified as requiring verification before filing.\n\n" +
      "Write these sections in plain professional language, each beginning with the exact heading shown:\n" +
      "## Charges and allegations in the record\n" +
      "## Elements the Commonwealth must prove\n" +
      "## Defense issues suggested by the record\n" +
      "## Discovery and records to demand\n" +
      "## Suppression and evidentiary questions\n" +
      "## Research questions for counsel\n\n" +
      "INVESTIGATION REPORT:\n" +
      grounding;

    const models = GEMINI_MODELS;

    const callModel = (index) => {
      if (index >= models.length) {
        return Promise.reject(new Error("No compatible Gemini model responded."));
      }

      return fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/" +
          models[index] +
          ":generateContent?key=" +
          encodeURIComponent(key),
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ role: "user", parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.2, maxOutputTokens: 16384 }
          })
        }
      ).then((response) => {
        if (response.status === 404) return callModel(index + 1);
        return response.json().then((data) => {
          if (data && data.error) throw new Error(data.error.message || "Gemini error");
          let text = "";
          try {
            (data.candidates[0].content.parts || []).forEach((part) => {
              text += part.text || "";
            });
          } catch (error) {}
          if (!text.trim()) throw new Error("Gemini returned an empty response.");
          return text;
        });
      });
    };

    callModel(0)
      .then((text) => {
        const host = document.getElementById("arcCaseBriefing");
        if (!host || !out || !status) return;
        host.dataset.aiText = text.trim();
        out.textContent = text.trim();
        status.textContent = "Briefing generated. Verify every fact and citation before approval.";
      })
      .catch((error) => {
        if (status) status.textContent = error.message || String(error);
      });
  }

  document.addEventListener("arc:case-brief", renderCaseBriefing);
  window.addEventListener("storage", (event) => {
    if (event.key === BRIEF_KEY) renderCaseBriefing();
  });
  setTimeout(renderCaseBriefing, 0);

  document.addEventListener("arc:case-context", (event) => applySharedLegalCase(event.detail || {}));

  if (!state.activeCaseId && state.cases[0]) state.activeCaseId = state.cases[0].id;
  render();
})();
</script>
<script src="arc_unified_bridge.js"></script>
</body>
</html>
