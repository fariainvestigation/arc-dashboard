<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARC · Motion &amp; Legal</title>
<link rel="stylesheet" href="arc_uniform_design.css">
<link rel="stylesheet" href="arc_motion_legal.css">
<script src="arc_report_header.js"></script>
<script src="arc_unified_bridge.js"></script>
</head>
<body data-workspace="motion-legal">

<div class="ml-shell">

  <!-- ARC shared header slot: arc_report_header.js populates this if present -->
  <header class="ml-head" id="arcSharedHeader">
    <div class="ml-head-brand">
      <span class="ml-mark">ARC</span>
      <div><h1>Motion &amp; Legal</h1><small>Massachusetts criminal defense drafting and authority control</small></div>
    </div>
    <div class="ml-head-actions">
      <a class="ml-btn" href="01_Case_Dashboard.html">Cases</a>
      <a class="ml-btn" href="investigation.html">Investigator</a>
    </div>
  </header>

  <!-- ARC active-case header -->
  <section class="ml-case" id="activeCaseBar">
    <div class="ml-case-none" id="caseNone">No active ARC case selected.</div>
    <div class="ml-case-info" id="caseInfo" hidden>
      <div class="ml-case-name"><strong id="cbClient">-</strong><span id="cbCaseName"></span></div>
      <dl class="ml-case-meta">
        <div><dt>Docket</dt><dd id="cbDocket">-</dd></div>
        <div><dt>Court</dt><dd id="cbCourt">-</dd></div>
        <div><dt>Charges</dt><dd id="cbCharges">-</dd></div>
        <div><dt>Attorney</dt><dd id="cbAttorney">-</dd></div>
        <div><dt>Investigator</dt><dd id="cbInvestigator">-</dd></div>
        <div><dt>Signed in</dt><dd id="cbUser">-</dd></div>
      </dl>
    </div>
  </section>

  <nav class="ml-tabs" id="mlTabs" role="tablist">
    <button role="tab" data-tab="dashboard" class="active">Legal Dashboard</button>
    <button role="tab" data-tab="issues">Issues</button>
    <button role="tab" data-tab="research">CourtListener Research</button>
    <button role="tab" data-tab="authorities">Authorities</button>
    <button role="tab" data-tab="recommendations">Motion Recommendations</button>
    <button role="tab" data-tab="irac">IRAC Builder</button>
    <button role="tab" data-tab="builder">Motion Builder</button>
    <button role="tab" data-tab="exhibits">Exhibits</button>
    <button role="tab" data-tab="review">Filing Review</button>
    <button role="tab" data-tab="export">Export &amp; Versions</button>
  </nav>

  <main class="ml-main" id="mlView" role="tabpanel" aria-live="polite"></main>
</div>

<div class="ml-modal" id="mlModal" hidden><div class="ml-modal-card" id="mlModalCard"></div></div>

<script src="arc_motion_templates.js"></script>
<script src="arc_legal_authority_store.js"></script>
<script src="arc_courtlistener_client.js"></script>
<script src="arc_motion_legal.js"></script>
</body>
</html>
