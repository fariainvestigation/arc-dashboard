name = "arc-case-sync"
main = "worker.js"
compatibility_date = "2026-01-15"

# D1 database binding. Create the database first (see DEPLOY.md), then paste the
# database_id it prints into the line below.
[[d1_databases]]
binding = "ARC_DB"
database_name = "arc-cases"
database_id = "PASTE_YOUR_DATABASE_ID_HERE"
