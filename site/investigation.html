<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="arc-version" content="11.6.2"><title>ARC Investigation Workspace</title>
<link rel="stylesheet" href="arc_uniform_design.css"><style>
:root{--navy:#0b1726;--navy2:#18304d;--gold:#b59461;--paper:#fff;--ink:#172033;--muted:#657184;--line:#d9e0e8;--bg:#f4f6f9;--ok:#19734a;--warn:#9b6414;--bad:#a52a2a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--navy);color:#fff;padding:18px 24px;border-bottom:3px solid var(--gold)}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;color:#d8e1ec}
main{max-width:1280px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:16px;box-shadow:0 2px 8px rgba(13,31,52,.04)}h2,h3{margin:0 0 12px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button,.btn{border:1px solid #aeb9c7;border-radius:6px;background:#fff;padding:9px 12px;font-weight:700;cursor:pointer}
.tabs button[aria-selected=true],.btn.primary{background:var(--navy2);color:#fff;border-color:var(--navy2)}.btn.danger{color:var(--bad)}
.panel{display:none}.panel.active{display:block}.field{display:grid;gap:5px;margin-bottom:11px}.field input,.field textarea,.field select{width:100%;padding:9px;border:1px solid #b9c4d1;border-radius:6px;background:#fff}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.item{border-top:1px solid var(--line);padding:12px 0}.item:first-child{border-top:0}
.muted{color:var(--muted)}.notice{padding:10px 12px;border-left:4px solid var(--gold);background:#fff8e9;margin:10px 0}.error{color:var(--bad)}.ok{color:var(--ok)}
.badge{display:inline-block;border:1px solid #c5ced9;border-radius:999px;padding:3px 8px;font-size:12px;background:#f7f9fc}.toolbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
iframe{width:100%;min-height:680px;border:1px solid var(--line);border-radius:8px;background:#fff}
table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
@media(max-width:720px){main{padding:12px}header{padding:15px}.grid{grid-template-columns:1fr}}
</style>
<!-- "04_Discovery_Review.html" registered as the Discovery Review analysis pane -->
<script src="arc_provider_client.js"></script><script src="arc_report_header.js"></script><script src="arc_unified_bridge.js"></script>
</head><body>
<header><h1>ARC Investigation Workspace</h1><p>Investigation-first workflow: evidence, analysis, field work, supplemental records, findings, and legal research.</p></header>
<main>
<div class="toolbar"><div id="caseLabel" class="badge"></div><a class="btn" href="case.html">Case Intake</a></div>
<div class="tabs" role="tablist">
<button type="button" data-tab="evidence">Evidence</button>
<button type="button" data-tab="analysis">Analysis</button>
<button type="button" data-tab="field">Field Investigation</button>
<button type="button" data-tab="supplemental">Supplemental</button>
<button type="button" data-tab="findings">Findings</button>
<button type="button" data-tab="research">Legal Research</button>
</div>
<section id="framePanel" class="panel active"><iframe id="workspaceFrame" title="ARC workspace module"></iframe></section>
<section id="analysisPanel" class="panel">
<div class="tabs" role="tablist" aria-label="Analysis tools">
<button type="button" data-analysis="timeline" aria-selected="true">Timeline</button>
<button type="button" data-analysis="board">Intelligence Board</button>
<button type="button" data-analysis="gaps">Discovery Gaps</button>
<button type="button" data-analysis="contradictions">Contradictions</button>
<button type="button" data-analysis="questions">Open Questions</button>
</div>
<div id="analysisToolPanel"><iframe id="analysisFrame" title="Analysis tool"></iframe></div>
<div id="questionsPanel" style="display:none">
<div class="grid"><form id="questionForm" class="card"><h2>Add open question</h2>
<label class="field">Question<textarea name="question" rows="4" required></textarea></label>
<label class="field">Origin<select name="originType"><option value="timeline">Timeline</option><option value="intelligence_board">Intelligence Board</option><option value="discovery_gap">Discovery Gap</option><option value="contradiction">Contradiction</option><option value="analysis">Other analysis</option></select></label>
<label class="field">Origin references<input name="originRefs" placeholder="Comma-separated source or record IDs"></label>
<label class="field">Priority<select name="priority"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select></label>
<button class="btn primary">Add as open</button><div id="questionMessage"></div></form>
<section class="card"><h2>Structured Open Questions List</h2><div id="questionList"></div></section></div>
</div></section>
<section id="supplementalPanel" class="panel">
<div class="grid"><form id="supplementalForm" class="card"><h2>Append supplemental record</h2>
<label class="field">Type<select name="type"><option value="late_discovery">Late Discovery</option><option value="expert_report">Expert Report</option><option value="records_received">Records Received</option><option value="translation">Translation</option><option value="supplemental_report">Supplemental Report</option></select></label>
<label class="field">Title<input name="title" required></label>
<label class="field">Date received<input name="receivedAt" type="date" required></label>
<label class="field">Triggering event<input name="triggeringEvent"></label>
<label class="field">Source ID<input name="sourceId"></label>
<label class="field">SHA-256<input name="sha256" maxlength="64"></label>
<label class="field">Notes<textarea name="notes" rows="5"></textarea></label>
<button class="btn primary">Append record</button><div id="supplementalMessage"></div></form>
<section class="card"><h2>Append-only chronology</h2><div id="supplementalList"></div></section></div>
</section>
</main>
<script>
(function(){"use strict";
var routes={evidence:"evidence.html",field:"field.html",findings:"findings.html",research:"02_Legal_Research.html"};
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])})}
function showMain(tab){
 document.querySelectorAll("[data-tab]").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===tab))});
 document.getElementById("framePanel").classList.remove("active");document.getElementById("analysisPanel").classList.remove("active");document.getElementById("supplementalPanel").classList.remove("active");
 if(tab==="analysis"){document.getElementById("analysisPanel").classList.add("active");showAnalysis("timeline")}
 else if(tab==="supplemental"){document.getElementById("supplementalPanel").classList.add("active");renderSupplemental()}
 else{document.getElementById("framePanel").classList.add("active");document.getElementById("workspaceFrame").src=routes[tab]||routes.evidence}
 history.replaceState(null,"","#"+tab);
}
function showAnalysis(tool){
 document.querySelectorAll("[data-analysis]").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.analysis===tool))});
 var q=tool==="questions";document.getElementById("questionsPanel").style.display=q?"block":"none";document.getElementById("analysisToolPanel").style.display=q?"none":"block";
 if(q){renderQuestions();return}
 var map={timeline:"09_Intelligence_Board.html#timeline",board:"09_Intelligence_Board.html",gaps:"04_Discovery_Review.html"+"#gaps",contradictions:"04_Discovery_Review.html#contradictions"};
 document.getElementById("analysisFrame").src=map[tool];
}
function renderQuestions(){var rows=ARCUnified.getOpenQuestions();document.getElementById("questionList").innerHTML=rows.length?rows.map(function(x){return '<div class=item><strong>'+esc(x.question)+'</strong> <span class=badge>'+esc(x.status)+'</span><div class=muted>'+esc(x.priority)+' · '+esc(x.originType)+' · '+esc((x.originRefs||[]).join(", "))+'</div></div>'}).join(""):'<p class=muted>No open questions. Stage 3 cannot complete until analysis produces this list.</p>'}
document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){showMain(b.dataset.tab)}});
document.querySelectorAll("[data-analysis]").forEach(function(b){b.onclick=function(){showAnalysis(b.dataset.analysis)}});
document.getElementById("questionForm").onsubmit=function(e){e.preventDefault();var m=document.getElementById("questionMessage");try{var d=Object.fromEntries(new FormData(e.target).entries());d.originRefs=d.originRefs.split(",").map(function(x){return x.trim()}).filter(Boolean);ARCUnified.saveOpenQuestion(d);e.target.reset();m.className="notice ok";m.textContent="Open question saved.";renderQuestions()}catch(err){m.className="notice error";m.textContent=err.message}};
function renderSupplemental(){var rows=ARCUnified.getSupplementalRecords();document.getElementById("supplementalList").innerHTML=rows.length?rows.map(function(x){return '<div class=item><strong>'+esc(x.title)+'</strong> <span class=badge>revision '+esc(x.revision)+'</span><div class=muted>'+esc(x.receivedAt)+' · '+esc(x.type)+' · '+esc(x.status)+'</div><p>'+esc(x.notes)+'</p></div>'}).join(""):'<p class=muted>No supplemental records.</p>'}
document.getElementById("supplementalForm").onsubmit=function(e){e.preventDefault();var m=document.getElementById("supplementalMessage");try{ARCUnified.appendSupplementalRecord(Object.fromEntries(new FormData(e.target).entries()));e.target.reset();m.className="notice ok";m.textContent="Supplemental record appended; prior revisions were not modified.";renderSupplemental()}catch(err){m.className="notice error";m.textContent=err.message}};
document.addEventListener("DOMContentLoaded",function(){var c=ARCUnified.getCase();document.getElementById("caseLabel").textContent=(c.matter||"No active case")+(ARCUnified.canonicalCaseId(c)?" · "+ARCUnified.canonicalCaseId(c):"");var tab=(location.hash||"#evidence").slice(1);var valid=Object.prototype.hasOwnProperty.call(routes,tab)||tab==="analysis"||tab==="supplemental";showMain(valid?tab:"evidence")});
})();
</script></body></html>
