name = "arc-legal"
main = "worker/legal_worker.mjs"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ACCESS_TEAM_DOMAIN = "REPLACE.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APP_AUD_TAG"
ALLOWED_ORIGINS = "https://arcdefensereport.com"
CLAUDE_MODEL = "claude-sonnet-4-6"

[[d1_databases]]
binding = "DB"
database_name = "arc_legal"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "FILES"
bucket_name = "arc-legal-files"

# Secrets are NEVER placed in this file. Set them with:
#   wrangler secret put COURTLISTENER_API_KEY
#   wrangler secret put ANTHROPIC_API_KEY

[[routes]]
pattern = "arcdefensereport.com/legal-api/*"
zone_name = "arcdefensereport.com"
