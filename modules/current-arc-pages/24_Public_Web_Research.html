<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARC Public Web Research</title><link rel="stylesheet" href="arc_uniform_design.css"><style>body{background:#14181c;color:#e8ecef;font:14px system-ui}main{max-width:1200px;margin:auto;padding:22px}.card{background:#1b2127;border:1px solid #2e3841;border-radius:9px;padding:15px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,textarea{background:#0f1418;color:#fff;border:1px solid #48535d;border-radius:6px;padding:9px;flex:1;min-width:220px}button{background:#C9A84C;color:#14181c;border:0;border-radius:6px;padding:9px 13px;font-weight:700}.result{border-top:1px solid #2e3841;padding:12px 0}.muted{color:#94a2ad}a{color:#C9A84C}</style><script src="arc_unified_bridge.js"></script><script src="arc_case_link.js"></script><script src="arc_api_client.js"></script></head><body><main><h1>Public Web Research</h1><p>Firecrawl retrieves public webpages only. Saved material is marked <b>Unverified</b> until an investigator reviews the source.</p><div id="case" class="muted"></div><section class="card"><h2>Search public web</h2><div class="row"><input id="query" placeholder="Police department policy, lab procedure, public record topic"><button id="search">Search</button></div></section><section class="card"><h2>Scrape a public URL</h2><div class="row"><input id="url" placeholder="https://public-agency.example/page"><button id="scrape">Scrape</button></div></section><section class="card"><h2>Results</h2><div id="msg" class="muted"></div><div id="results"></div></section><section class="card"><h2>Saved to case</h2><div id="saved"></div></section></main><script>(function(){var c=ARCUnified.getCase(),cid=ARCUnified.canonicalCaseId(c);document.getElementById('case').textContent=cid?((c.matter||c.clientName||'Active case')+' · '+cid):'No active case selected.';function esc(v){return String(v||'').replace(/[&<>"']/g,function(x){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[x]})}async function req(path,body){if(!cid)throw new Error('Open an ARC case first.');return ARCAPI.request('/research-api/'+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body||{})})}function normalizeSearch(j){var d=j&&j.result&&(j.result.data||j.result.results||j.result);if(!Array.isArray(d))return[];return d.map(function(x){return{url:x.url||x.sourceUrl||'',title:x.title||x.metadata&&x.metadata.title||x.url||'Result',markdown:x.markdown||x.description||x.content||''}})}function render(items){document.getElementById('results').innerHTML=items.length?items.map(function(x,i){return '<div class="result"><strong>'+esc(x.title)+'</strong><div><a target="_blank" rel="noopener" href="'+esc(x.url)+'">'+esc(x.url)+'</a></div><p>'+esc(String(x.markdown||'').slice(0,800))+'</p><button data-save="'+i+'">Save to case</button></div>'}).join(''):'<p class="muted">No results.</p>';window.__res=items}async function load(){if(!cid)return;try{var j=await ARCAPI.request('/research-api/list',{headers:{'X-ARC-Case-ID':cid}});document.getElementById('saved').innerHTML=(j.results||[]).map(function(x){return '<div class="result"><strong>'+esc(x.title||x.source_url)+'</strong> <small>'+esc(x.verification_status)+'</small><div>'+esc(x.source_url)+'</div><small>SHA-256 '+esc(x.content_hash)+'</small></div>'}).join('')||'<p class="muted">No saved web research.</p>'}catch(e){document.getElementById('saved').textContent=e.message}}document.getElementById('search').onclick=async function(){try{document.getElementById('msg').textContent='Searching…';var j=await req('search',{query:document.getElementById('query').value,limit:5});render(normalizeSearch(j));document.getElementById('msg').textContent='Search complete.'}catch(e){document.getElementById('msg').textContent=e.message}};document.getElementById('scrape').onclick=async function(){try{document.getElementById('msg').textContent='Scraping…';var j=await req('scrape',{url:document.getElementById('url').value});var d=j.result&&j.result.data||j.result||{};render([{url:j.sourceUrl,title:d.metadata&&d.metadata.title||j.sourceUrl,markdown:d.markdown||d.content||''}]);document.getElementById('msg').textContent='Scrape complete.'}catch(e){document.getElementById('msg').textContent=e.message}};document.getElementById('results').onclick=async function(e){var b=e.target.closest('[data-save]');if(!b)return;var x=window.__res[+b.dataset.save];try{await req('save',{sourceUrl:x.url,title:x.title,contentMarkdown:x.markdown});document.getElementById('msg').textContent='Saved to active case as Unverified.';load()}catch(err){document.getElementById('msg').textContent=err.message}};load()})();</script></body></html>
